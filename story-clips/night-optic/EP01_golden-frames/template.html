<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      "ร้านแว่นตีสอง" EP01 "แว่นกรอบทองของยายจันทร์" (2026-11-21). Thai storytelling cartoon, 16:9, our own characters and story
      (format inspired by a TikTok the user sent; nothing copied). Painted backgrounds = local FLUX (bg/gen.sh), characters = SVG below.
      build.py inlines audio/timing.json (S = cue starts, E = cue ends, 1-based) -> hf/index.html.
      Scenes: night exterior 1-2 | shop at night 3-10 (glasses close-up 8) | workbench 11-13 | shop at dawn 14-20 (letter 15-16)
      | ledger 21-23 | morning exterior 24-25 (photo 26) | end card 27
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Charmonman:wght@400;700&family=Sriracha&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07070a; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Prompt', sans-serif; color: #fff; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .scene { opacity: 0; overflow: hidden; }
      .cam { transform-origin: 960px 540px; }
      .bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
      svg { display: block; overflow: visible; }

      #subs .sub { position: absolute; left: 120px; right: 120px; top: 958px; text-align: center; font: 600 46px/1.3 'Prompt', sans-serif;
                   opacity: 0; color: #fff; -webkit-text-stroke: 9px #000; paint-order: stroke fill; letter-spacing: .01em; }
      #subs .sub.g { color: #d6f3f6; }
      #subs .sub.l { color: #ffe3a3; }
      #subs .sub.o { color: #f3d9c0; }

      .vig { background: radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%); pointer-events: none; }
      #grain { opacity: .07; mix-blend-mode: overlay; }

      #title { opacity: 0; }
      #title .t1 { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font: 800 128px 'Prompt'; letter-spacing: .04em;
                   color: #f6e6c4; text-shadow: 0 0 40px rgba(255,190,90,.45), 0 6px 0 #000; }
      #title .t2 { position: absolute; left: 0; right: 0; top: 500px; text-align: center; font: 600 44px 'Prompt'; color: #e9d8b8;
                   text-shadow: 0 3px 10px #000; letter-spacing: .03em; }
      #title .rule { position: absolute; left: 760px; width: 400px; top: 485px; height: 3px; background: #d9a648; transform-origin: 50% 50%; }

      .paper { position: absolute; background: #efe0b8; border-radius: 6px; box-shadow: 0 30px 70px rgba(0,0,0,.6), inset 0 0 90px rgba(140,95,30,.35); }
      #letter { left: 520px; top: 120px; width: 880px; height: 780px; transform: rotate(-2deg); padding: 80px 90px;
                font: 400 50px/1.75 'Charmonman', cursive; color: #2b3a6a; }
      #letter .w { opacity: 0; }
      #letter .date { font-size: 34px; text-align: right; color: #4a5a85; margin-bottom: 24px; }
      #letter .sign { margin-top: 30px; text-align: right; }
      #page { left: 470px; top: 70px; width: 980px; height: 880px; transform: rotate(1.5deg); padding: 70px 80px;
              background: repeating-linear-gradient(#efe0b8 0 74px, #c9b48a 74px 76px); font: 400 38px/76px 'Sriracha', cursive; color: #4b3a2a; }
      #page .row { display: flex; gap: 26px; white-space: nowrap; opacity: .62; }
      #page .row span:first-child { width: 230px; }
      #page .row.last { opacity: 1; color: #2a1d12; }
      #page .row.last .w { opacity: 0; }
      #paid { position: absolute; left: 600px; top: 640px; font: 700 76px 'Charmonman', cursive; color: #1d3fb0; opacity: 0;
              transform: rotate(-8deg); text-shadow: 0 0 16px rgba(60,110,255,.45); }
      #photo { left: 640px; top: 120px; width: 640px; height: 800px; background: #f4ead6; padding: 36px 36px 120px; transform: rotate(3deg); }
      #photo .pic { width: 100%; height: 100%; background: #6d5a44; overflow: hidden; filter: sepia(.9) contrast(1.05); }
      #photo .cap { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font: 400 40px 'Charmonman', cursive; color: #5a4632; }

      #end .t1 { position: absolute; left: 0; right: 0; top: 340px; text-align: center; font: 800 120px 'Prompt'; color: #f6e6c4;
                 text-shadow: 0 0 40px rgba(255,190,90,.45), 0 6px 0 #000; opacity: 0; }
      #end .t2 { position: absolute; left: 0; right: 0; top: 520px; text-align: center; font: 600 52px 'Prompt'; color: #d9a648; opacity: 0; }
      #end .t3 { position: absolute; left: 0; right: 0; top: 600px; text-align: center; font: 500 38px 'Prompt'; color: #cfc4ae; opacity: 0; }
      #dawn { background: linear-gradient(115deg, rgba(120,170,230,.0) 0%, rgba(150,190,240,.32) 55%, rgba(255,214,160,.38) 100%); mix-blend-mode: screen; }
      .ray { position: absolute; top: -200px; width: 160px; height: 1500px; background: linear-gradient(rgba(255,236,200,.28), rgba(255,236,200,0));
             transform: rotate(28deg); transform-origin: 50% 0; filter: blur(14px); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="@TOTAL@" data-width="1920" data-height="1080">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <radialGradient id="gGhost"><stop offset="0" stop-color="#bff3ff" stop-opacity=".55" /><stop offset="1" stop-color="#bff3ff" stop-opacity="0" /></radialGradient>
          <radialGradient id="gLamp"><stop offset="0" stop-color="#ffc56b" stop-opacity=".55" /><stop offset="1" stop-color="#ffc56b" stop-opacity="0" /></radialGradient>
          <radialGradient id="gSpark"><stop offset="0" stop-color="#fff6c8" /><stop offset="1" stop-color="#ffb040" stop-opacity="0" /></radialGradient>
          <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d47a" /><stop offset=".5" stop-color="#c8922e" /><stop offset="1" stop-color="#f2c75c" /></linearGradient>
          <filter id="fSoft"><feGaussianBlur stdDeviation="6" /></filter>
        </defs>
      </svg>

      <div id="ext" class="scene full" style="opacity:1"><div class="cam full"><img class="bg" src="assets/ext.png" /><svg class="full" viewBox="0 0 1920 1080" id="sExt"></svg></div></div>
      <div id="shop" class="scene full"><div class="cam full"><img class="bg" id="shopImg" src="assets/shop.png" /><div id="shopDark" class="full" style="background:#050812;opacity:0"></div><div id="dawn" class="full" style="opacity:0"><div class="ray" style="left:1300px"></div><div class="ray" style="left:1520px;width:110px"></div><div class="ray" style="left:1700px;width:200px"></div></div><svg class="full" viewBox="0 0 1920 1080" id="sShop"></svg></div></div>
      <div id="glass" class="scene full"><div class="cam full"><img class="bg" src="assets/shop.png" style="filter:blur(14px) brightness(.45)" /><svg class="full" viewBox="0 0 1920 1080" id="sGlass"></svg></div></div>
      <div id="bench" class="scene full"><div class="cam full"><img class="bg" src="assets/bench.png" /><div id="flick" class="full" style="background:#000;opacity:0"></div><svg class="full" viewBox="0 0 1920 1080" id="sBench"></svg></div></div>
      <div id="letterS" class="scene full"><div class="cam full"><img class="bg" src="assets/shop.png" style="filter:blur(16px) brightness(.55) saturate(.7)" />
        <div id="letter" class="paper"><div class="date">๑๒ ธันวาคม ๒๕๑๘</div><div id="letterBody"></div><div class="sign w">ลูกชาญ</div></div>
        <svg class="full" viewBox="0 0 1920 1080" id="sLetter"></svg></div></div>
      <div id="ledgerS" class="scene full"><div class="cam full"><img class="bg" src="assets/ledger.png" style="filter:blur(5px) brightness(.7)" />
        <div id="page" class="paper"><div id="rows"></div><div id="paid">จ่ายแล้ว</div></div></div></div>
      <div id="day" class="scene full"><div class="cam full"><img class="bg" id="dayImg" src="assets/day.png" /><svg class="full" viewBox="0 0 1920 1080" id="sDay"></svg></div></div>
      <div id="photoS" class="scene full"><div class="cam full"><img class="bg" src="assets/day.png" style="filter:blur(16px) brightness(.6)" />
        <div id="photo" class="paper"><div class="pic"><svg viewBox="0 0 568 644" width="568" height="644" id="sPhoto"></svg></div><div class="cap">แม่ ๒๕๑๗</div></div></div></div>
      <div id="end" class="scene full"><div class="cam full"><img class="bg" src="assets/shop.png" style="filter:blur(10px) brightness(.28)" /><svg class="full" viewBox="0 0 1920 1080" id="sEnd"></svg>
        <div class="t1">ร้านแว่นตีสอง</div><div class="t2">EP.2</div><div class="t3">ลูกค้าคนต่อไป…</div></div></div>

      <div id="title" class="full"><div class="t1">ร้านแว่นตีสอง</div><div class="rule"></div><div class="t2">EP.1 แว่นกรอบทองของยายจันทร์</div></div>
      <div class="full vig"></div>
      <svg id="grain" class="full" viewBox="0 0 1920 1080"><filter id="fn"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" /></filter><rect width="1920" height="1080" filter="url(#fn)" /></svg>
      <div id="fade" class="full" style="background:#000;opacity:0"></div>
      <div id="subs"></div>
    </div>

    <script>
      const TIMING = /*TIMING*/;
      const S = [0], E = [0]; TIMING.cues.forEach(c => { S[c.n] = c.start; E[c.n] = c.end; });
      const END = TIMING.total;
      let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const NS = 'http://www.w3.org/2000/svg';
      const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
      const $ = id => document.getElementById(id);
      const T = o => `translate(${o.x ?? 0} ${o.y ?? 0}) rotate(${o.r ?? 0}) scale(${o.sx ?? o.s ?? 1} ${o.sy ?? o.s ?? 1})`;
      const G = (p, o = {}) => el('g', { transform: T(o) }, p);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const INK = '#241c18';

      // ---------- timeline helpers ----------
      function show(id, t0, t1, fi = .6, fo = .6) {
        tl.fromTo('#' + id, { opacity: 0 }, { opacity: 1, duration: fi, ease: 'none', immediateRender: false }, t0);
        if (t1 != null) tl.to('#' + id, { opacity: 0, duration: fo, ease: 'none' }, t1);
      }
      function cam(id, t0, dur, from, to, ease = 'sine.inOut') {
        tl.fromTo(`#${id} .cam`, from, { ...to, duration: dur, ease, immediateRender: false }, t0);
      }
      function F(px, py, sc) { const mx = (sc - 1) * 960, my = (sc - 1) * 540;
        return { scale: sc, x: Math.max(-mx, Math.min(mx, -(px - 960) * sc)), y: Math.max(-my, Math.min(my, -(py - 540) * sc)) }; }
      function talk(c, t0, t1) {
        for (let t = t0; t < t1 - .05; t += .1 + rnd() * .06) { const o = rnd() > .35; tl.set(c.mo, { opacity: o ? 1 : 0 }, t); tl.set(c.mc, { opacity: o ? 0 : 1 }, t); }
        tl.set(c.mo, { opacity: 0 }, t1); tl.set(c.mc, { opacity: 1 }, t1);
      }
      function blink(c, t0, t1) {
        for (let t = t0 + .8 + rnd() * 1.5; t < t1 - .3; t += 2.4 + rnd() * 2.2) {
          tl.set(c.eyes, { attr: { transform: 'scale(1 .1)' } }, t); tl.set(c.eyes, { attr: { transform: 'scale(1 1)' } }, t + .13);
        }
      }
      function breathe(c, t0, t1, amt = .012, per = 1.8) {
        const n = Math.max(1, Math.floor((t1 - t0) / per));
        tl.fromTo(c.torso, { attr: { transform: 'scale(1 1)' } }, { attr: { transform: `scale(1 ${1 + amt})` }, duration: per / 2, yoyo: true, repeat: n * 2 - 1, ease: 'sine.inOut', immediateRender: false }, t0);
      }
      function face(c, t, which) {  // swap expression layers: eyes 'n' | 'w' (wide) | 's' (soft/closed smile); mouth stays on talk()
        for (const k in c.eye) tl.set(c.eye[k], { opacity: k === which ? 1 : 0 }, t);
      }
      function mouthShape(c, t, which) { for (const k in c.mouth) tl.set(c.mouth[k], { opacity: k === which ? 1 : 0 }, t); c.mc = c.mouth[which]; }

      // ---------- characters (origin = between the feet, ~520 px tall at scale 1) ----------
      function eyeSet(g, x, y, kind, col = INK) {   // returns groups n / w / s
        const out = {};
        out.n = G(g); [-1, 1].forEach(sg => el('ellipse', { cx: x * sg, cy: y, rx: 7.5, ry: 10.5, fill: col }, out.n));
        out.w = G(g); [-1, 1].forEach(sg => { el('circle', { cx: x * sg, cy: y, r: 13, fill: '#fff', stroke: col, 'stroke-width': 3.5 }, out.w); el('circle', { cx: x * sg, cy: y + 1, r: 5.5, fill: col }, out.w); });
        out.s = G(g); [-1, 1].forEach(sg => el('path', { d: `M${x * sg - 12} ${y + 3} Q${x * sg} ${y - 9} ${x * sg + 12} ${y + 3}`, stroke: col, 'stroke-width': 4.5, fill: 'none', 'stroke-linecap': 'round' }, out.s));
        out.d = G(g); [-1, 1].forEach(sg => { el('ellipse', { cx: x * sg, cy: y + 2, rx: 7.5, ry: 8.5, fill: col }, out.d); el('path', { d: `M${x * sg - 14} ${y - 13} L${x * sg + 12} ${y - 9 - sg * 3}`, stroke: col, 'stroke-width': 4, 'stroke-linecap': 'round' }, out.d); });
        for (const k in out) out[k].setAttribute('opacity', k === kind ? 1 : 0);
        return out;
      }
      function mouthSet(g, y, col = INK) {
        const m = {};
        m.f = el('path', { d: `M-10 ${y} Q0 ${y + 3} 10 ${y}`, stroke: col, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, g);
        m.sm = el('path', { d: `M-15 ${y - 3} Q0 ${y + 11} 15 ${y - 3}`, stroke: col, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round', opacity: 0 }, g);
        m.o = el('ellipse', { cx: 0, cy: y + 2, rx: 8, ry: 10, fill: '#3a1f1c', opacity: 0 }, g);
        const mo = el('ellipse', { cx: 0, cy: y + 3, rx: 11, ry: 9, fill: '#3a1f1c', opacity: 0 }, g);
        return { m, mo };
      }

      // Ton (ต้น), the narrator: round head, messy dark hair, round black glasses, moss cardigan over a cream tee.
      function ton(p, o, opt = {}) {
        const g = G(p, o);
        el('ellipse', { cx: 0, cy: 4, rx: 70, ry: 12, fill: '#000', opacity: .28 }, g);
        [-1, 1].forEach(s => { el('path', { d: `M${s * 24} -118 L${s * 27} -10`, stroke: '#2b2a33', 'stroke-width': 17, 'stroke-linecap': 'round' }, g);
          el('ellipse', { cx: s * 32, cy: -4, rx: 22, ry: 10, fill: '#1b1a1f' }, g); });
        const torso = G(g, { y: -120 }); const tb = G(torso, { y: 0 });
        el('path', { d: 'M-74 0 Q-84 -150 -52 -176 Q0 -196 52 -176 Q84 -150 74 0 Z', fill: '#4f6b58', stroke: INK, 'stroke-width': 5 }, tb);
        el('path', { d: 'M-26 -184 L0 -60 L26 -184 Z', fill: '#efe7d6', stroke: INK, 'stroke-width': 4 }, tb);
        [[-12, -40], [-12, -80]].forEach(([x, y]) => el('circle', { cx: x + 12, cy: y, r: 4.5, fill: '#d8c79f' }, tb));
        const arm = s => { const a = G(tb, { x: s * 60, y: -160 }); el('path', { d: `M0 0 Q${s * 18} 70 ${s * 8} 140`, stroke: '#4f6b58', 'stroke-width': 26, fill: 'none', 'stroke-linecap': 'round' }, a);
          el('path', { d: `M0 0 Q${s * 18} 70 ${s * 8} 140`, stroke: INK, 'stroke-width': 32, fill: 'none', 'stroke-linecap': 'round', opacity: .0 }, a);
          el('circle', { cx: s * 8, cy: 146, r: 15, fill: '#f1dcc3', stroke: INK, 'stroke-width': 4 }, a); return a; };
        const armL = arm(-1), armR = arm(1);
        const head = G(g, { y: -400 });
        el('circle', { cx: 0, cy: 0, r: 104, fill: '#f3e1cb', stroke: INK, 'stroke-width': 5 }, head);
        el('ellipse', { cx: -58, cy: 38, rx: 16, ry: 9, fill: '#f0a99a', opacity: .45 }, head); el('ellipse', { cx: 58, cy: 38, rx: 16, ry: 9, fill: '#f0a99a', opacity: .45 }, head);
        el('path', { d: 'M-110 10 Q-122 -70 -70 -104 Q-20 -138 40 -118 Q100 -104 114 -40 Q120 0 108 22 Q96 -18 74 -40 Q60 -10 30 -44 Q10 -12 -18 -46 Q-40 -12 -64 -42 Q-84 -10 -110 10 Z', fill: '#1f1b22', stroke: INK, 'stroke-width': 4 }, head);
        el('path', { d: 'M-20 -120 Q-8 -150 16 -142 Q0 -134 -2 -118 Z', fill: '#1f1b22' }, head);
        const eyes = G(head, { y: 12 }); const eye = eyeSet(eyes, 38, 0, opt.eye || 'n');
        el('circle', { cx: -38, cy: 12, r: 30, fill: 'rgba(220,240,255,.14)', stroke: '#1a1a1a', 'stroke-width': 5.5 }, head);
        el('circle', { cx: 38, cy: 12, r: 30, fill: 'rgba(220,240,255,.14)', stroke: '#1a1a1a', 'stroke-width': 5.5 }, head);
        el('path', { d: 'M-8 8 Q0 2 8 8', stroke: '#1a1a1a', 'stroke-width': 5, fill: 'none' }, head);
        const { m, mo } = mouthSet(head, 62);
        return { g, head, torso: tb, armL, armR, eyes, eye, mouth: m, mc: m.f, mo };
      }

      // Grandma Jan (ยายจันทร์): pale, softly glowing, silver bun, cream lace dress, small and a little hunched.
      function jan(p, o, opt = {}) {
        const g = G(p, o);
        el('ellipse', { cx: 0, cy: -260, rx: 260, ry: 330, fill: 'url(#gGhost)' }, g);
        const body = G(g); const torso = G(body);
        el('path', { d: 'M-58 -300 Q-70 -200 -96 -10 Q0 10 96 -10 Q70 -200 58 -300 Q0 -322 -58 -300 Z', fill: '#efe5cf', stroke: INK, 'stroke-width': 5 }, torso);
        for (let i = 0; i < 11; i++) el('circle', { cx: -84 + i * 16.8, cy: -22, r: 5, fill: 'none', stroke: '#c7b38c', 'stroke-width': 2.5 }, torso);
        el('path', { d: 'M-50 -290 Q0 -250 50 -290', stroke: '#c7b38c', 'stroke-width': 3, fill: 'none' }, torso);
        el('path', { d: 'M-60 -296 Q-110 -200 -84 -100 L84 -100 Q110 -200 60 -296', fill: '#9fb4b6', opacity: .55 }, torso);   // shawl
        const arm = s => { const a = G(torso, { x: s * 50, y: -280 }); el('path', { d: `M0 0 Q${s * 22} 80 ${s * 4} 150`, stroke: '#9fb4b6', 'stroke-width': 24, fill: 'none', 'stroke-linecap': 'round' }, a);
          el('circle', { cx: s * 4, cy: 156, r: 14, fill: '#eef2ef', stroke: INK, 'stroke-width': 4 }, a); return a; };
        const armL = arm(-1), armR = arm(1);
        const head = G(g, { x: 8, y: -392, r: 4 });
        el('circle', { cx: 0, cy: -108, r: 40, fill: '#cfd6da', stroke: INK, 'stroke-width': 4.5 }, head);   // bun
        el('circle', { cx: 0, cy: 0, r: 96, fill: '#eef2ef', stroke: INK, 'stroke-width': 5 }, head);
        el('path', { d: 'M-98 6 Q-104 -66 -50 -90 Q0 -108 50 -90 Q104 -66 98 6 Q84 -40 40 -58 Q0 -66 -40 -58 Q-84 -40 -98 6 Z', fill: '#d5dcdf', stroke: INK, 'stroke-width': 4 }, head);
        el('path', { d: 'M-70 -34 Q-30 -70 0 -66 M70 -34 Q30 -70 0 -66', stroke: '#aeb8bd', 'stroke-width': 3, fill: 'none' }, head);
        el('ellipse', { cx: -54, cy: 40, rx: 15, ry: 8, fill: '#f2b0a8', opacity: .4 }, head); el('ellipse', { cx: 54, cy: 40, rx: 15, ry: 8, fill: '#f2b0a8', opacity: .4 }, head);
        const eyes = G(head, { y: 14 }); const eye = eyeSet(eyes, 36, 0, opt.eye || 's', '#3b3540');
        el('path', { d: 'M-58 26 Q-50 32 -42 28 M42 28 Q50 32 58 26', stroke: '#9aa3a8', 'stroke-width': 3, fill: 'none' }, head);
        const specs = G(head); el('circle', { cx: -36, cy: 14, r: 27, fill: 'rgba(255,245,210,.12)', stroke: 'url(#gGold)', 'stroke-width': 6 }, specs);
        el('circle', { cx: 36, cy: 14, r: 27, fill: 'rgba(255,245,210,.12)', stroke: 'url(#gGold)', 'stroke-width': 6 }, specs);
        el('path', { d: 'M-9 10 Q0 4 9 10', stroke: '#c8922e', 'stroke-width': 5, fill: 'none' }, specs); specs.setAttribute('opacity', opt.specs ? 1 : 0);
        const { m, mo } = mouthSet(head, 58, '#4a3f46');
        return { g, head, torso, body, armL, armR, eyes, eye, mouth: m, mc: m.f, mo, specs };
      }

      // Chan (ชาญ), the son, now ~70: grey side hair, moustache, brown jacket, cane.
      function chan(p, o, opt = {}) {
        const g = G(p, o);
        el('ellipse', { cx: 0, cy: 4, rx: 70, ry: 12, fill: '#000', opacity: .28 }, g);
        [-1, 1].forEach(s => { el('path', { d: `M${s * 24} -118 L${s * 26} -10`, stroke: '#3b3630', 'stroke-width': 17, 'stroke-linecap': 'round' }, g); el('ellipse', { cx: s * 32, cy: -4, rx: 22, ry: 10, fill: '#2a201a' }, g); });
        el('path', { d: 'M-110 -2 L-96 -250', stroke: '#5a3a22', 'stroke-width': 9, 'stroke-linecap': 'round' }, g);
        const torso = G(g, { y: -120 }); const tb = G(torso);

        tl.fromTo(mh, { attr: { transform: 'rotate(-60)' } }, { attr: { transform: 'rotate(-6)' }, duration: END - t0, ease: 'none', immediateRender: false }, t0);

      // =================== subtitles ===================
