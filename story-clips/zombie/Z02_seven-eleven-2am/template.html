<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!--
      Zombie series "กรุงเทพฯ ไม่มีพรุ่งนี้" Z02 "เซเว่นตีสอง" (user, 2026-10-28). Pure zombie action, no eyewear/brand. Thai only.
      ../template.html is the source: ../build.py inlines ../audio/timing.json (S = cue starts, E = cue ends, 1-based),
      ../../_shared/cast.js at /*CAST*/ (characters + timeline helpers) -> index.html.
      Everything is drawn in SVG by the script below; scenes switch on cue times, so re-timing the voice needs no edits here.
      Scenes: glass 1 (+ breach 8) | floor + flashback 2-5 | stock-room door 6 (+ bark 19, reveal 23-25) | runners outside 7
      | store fight (dollhouse) 9-15, 18, 20-22 | slow-mo counter leap 16-17 | glass sliver 26 | the four 27 | next 28
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800;900&family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0a10; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Anuphan', sans-serif; color: #fff; }
      .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .scene { opacity: 0; overflow: hidden; }
      .cam { transform-origin: 540px 960px; }
      svg { display: block; overflow: visible; }

      .sub { position: absolute; left: 50px; right: 50px; top: 1600px; text-align: center; font-family: 'Prompt', sans-serif; font-weight: 700;
             font-size: 58px; line-height: 1.3; opacity: 0; text-shadow: 0 4px 0 #000, 0 0 18px rgba(0,0,0,.9), 0 0 4px #000; }
      .sub.y { color: #FFD23F; }
      .sub.r span { display: inline-block; background: #D8343A; color: #fff; padding: 4px 26px 8px; border-radius: 10px; text-shadow: none;
                    box-shadow: 0 6px 24px rgba(0,0,0,.45); }
      .sub b { color: #9fe8ff; font-weight: 800; }

      .chip { position: absolute; top: 150px; height: 86px; background: #EEE8DC; border-radius: 16px; color: #1d2433; display: flex; align-items: center;
              gap: 14px; padding: 0 26px 0 20px; box-shadow: 0 8px 26px rgba(0,0,0,.45); }
      .chip small { display: block; font-size: 20px; font-weight: 500; color: #555a63; line-height: 1; }
      .chip b { display: block; font-family: 'Prompt'; font-size: 40px; font-weight: 700; line-height: 1.05; letter-spacing: .02em; }
      #ep { left: auto; right: 56px; background: #D8343A; color: #fff; font: 800 34px 'Prompt'; padding: 0 26px; }

      .badge { position: absolute; left: 60px; top: 1380px; background: rgba(12,12,18,.82); border-left: 10px solid #FFD23F; border-radius: 10px;
               padding: 14px 26px; font: 600 38px 'Prompt'; color: #fff; opacity: 0; white-space: nowrap; }
      .badge i { font-style: normal; color: #FFD23F; }
      #tag { position: absolute; left: 50%; top: 420px; transform: translateX(-50%); background: #D8343A; color: #fff; font: 800 50px 'Prompt';
             padding: 10px 34px 14px; border-radius: 12px; opacity: 0; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.5); }

      .fx { position: absolute; font: 900 150px/1 'Prompt'; color: #FFD23F; opacity: 0; white-space: nowrap;
            -webkit-text-stroke: 10px #111; paint-order: stroke fill; text-shadow: 10px 10px 0 #D8343A; transform-origin: 50% 50%; }
      .fx.w { color: #fff; text-shadow: 10px 10px 0 #2a6cd8; }
      .fx.s { font-size: 96px; }

      #title { position: absolute; left: 0; right: 0; top: 360px; text-align: center; opacity: 0; }
      #title h1 { font: 900 112px/1.05 'Prompt'; color: #fff; -webkit-text-stroke: 8px #111; paint-order: stroke fill; text-shadow: 8px 8px 0 #D8343A; }
      #title p { margin-top: 18px; display: inline-block; background: #FFD23F; color: #111; font: 800 44px 'Prompt'; padding: 6px 28px; border-radius: 8px; }

      #flash { background: #fff; opacity: 0; }
      #redv { background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(216,52,58,0) 40%, rgba(150,10,20,.85)); opacity: 0; }
      #bars { pointer-events: none; }
      #bars div { position: absolute; left: 0; width: 1080px; height: 0; background: #000; }

      #next { background: radial-gradient(ellipse 80% 45% at 50% 42%, #2a1416, #0d0b0d 70%); }
      #next .pill { position: absolute; left: 50%; top: 600px; transform: translateX(-50%); border: 2px solid #4a4a55; border-radius: 40px; padding: 8px 30px;
                    font-size: 32px; font-weight: 600; color: #d6d6dc; white-space: nowrap; }
      #next .pill:before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #D8343A; margin-right: 12px; vertical-align: 4px; }
      #next h1 { position: absolute; left: 40px; right: 40px; top: 700px; text-align: center; font: 900 120px/1.15 'Prompt'; color: #fff;
                 -webkit-text-stroke: 8px #111; paint-order: stroke fill; text-shadow: 8px 8px 0 #D8343A; }
      #next .rl { position: absolute; left: 400px; top: 1000px; width: 280px; height: 8px; background: #D8343A; border-radius: 4px; }
      #next .s1 { position: absolute; left: 0; right: 0; top: 1040px; text-align: center; font: 700 40px 'Prompt'; color: #FFD23F; }
      #next .s2 { position: absolute; left: 0; right: 0; top: 1110px; text-align: center; font-size: 34px; color: #c8c8d0; }
      #next .sr { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font: 800 46px 'Prompt'; color: #e05a5f; letter-spacing: .04em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="@TOTAL@" data-width="1080" data-height="1920">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <linearGradient id="gOut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070a18" /><stop offset=".55" stop-color="#1a2648" /><stop offset=".75" stop-color="#2a3a64" /></linearGradient>
          <linearGradient id="gSepia" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3018" /><stop offset="1" stop-color="#c8783a" /></linearGradient>
          <radialGradient id="gGlow"><stop offset="0" stop-color="#ffe2a0" stop-opacity=".9" /><stop offset="1" stop-color="#ffe2a0" stop-opacity="0" /></radialGradient>
          <radialGradient id="gExit"><stop offset="0" stop-color="#3dff8a" stop-opacity=".55" /><stop offset="1" stop-color="#3dff8a" stop-opacity="0" /></radialGradient>
          <radialGradient id="gMoon"><stop offset="0" stop-color="#9fc4ff" stop-opacity=".35" /><stop offset="1" stop-color="#9fc4ff" stop-opacity="0" /></radialGradient>
          <radialGradient id="gEye"><stop offset="0" stop-color="#fff" stop-opacity=".9" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
          <linearGradient id="gBeam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe9b0" stop-opacity=".55" /><stop offset="1" stop-color="#ffe9b0" stop-opacity="0" /></linearGradient>
          <clipPath id="cFrz"><rect x="-500" y="0" width="1350" height="1400" /></clipPath>
        </defs>
      </svg>

      <div id="glass" class="scene full" style="opacity:1"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sGlass"></svg></div></div>
      <div id="floor" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sFloor"></svg></div></div>
      <div id="door" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sDoor"></svg></div></div>
      <div id="out" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sOut"></svg></div></div>
      <div id="fight" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sFight"></svg></div></div>
      <div id="leap" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sLeap"></svg></div></div>
      <div id="arm" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sArm"></svg></div></div>
      <div id="four" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sFour"></svg></div></div>

      <div id="redv" class="full"></div>
      <div id="flash" class="full"></div>
      <div id="bars" class="full"><div id="barT" style="top:0"></div><div id="barB" style="bottom:0"></div></div>
      <div id="fxl" class="full"></div>

      <div id="title"><h1>กรุงเทพฯ<br>ไม่มีพรุ่งนี้</h1><p>EP.2 เซเว่นตีสอง</p></div>
      <div id="bHrs" class="badge"><i>8 ชม.</i> · ยังไม่เปลี่ยน</div>
      <div id="tag">ตัววิ่ง · กลางคืนมันวิ่ง</div>
      <div id="bMew" class="badge"><i>มิว</i> · 10 ขวบ</div>
      <div id="bDog" class="badge" style="top:1480px"><i>ข้าวตัง</i> · หมาของมิว</div>

      <div id="clock" class="chip" style="left:56px">
        <svg viewBox="-24 -24 48 48" width="46" height="46"><circle r="19" fill="none" stroke="#1d2433" stroke-width="4" /><path d="M0 -10 L0 0 L8 6" fill="none" stroke="#1d2433" stroke-width="4" stroke-linecap="round" /></svg>
        <div><small>วันที่ 2</small><b id="clockt">02:00</b></div>
      </div>
      <div id="ep" class="chip">EP.2</div>

      <div id="subs"></div>

      <div id="next" class="scene full">
        <div class="sr">กรุงเทพฯ ไม่มีพรุ่งนี้</div>
        <div class="pill">ตอนหน้า</div>
        <h1>ขบวน<br>สุดท้าย</h1>
        <div class="rl"></div>
        <div class="s1">EP.3 เร็วๆ นี้</div>
        <div class="s2">กดติดตาม แล้วไปรอดด้วยกัน</div>
      </div>
    </div>

    <script>
      const TIMING = /*TIMING*/;
      const S = [0], E = [0]; TIMING.cues.forEach(c => { S[c.n] = c.start; E[c.n] = c.end; });
      const END = TIMING.total;
      let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const NS = 'http://www.w3.org/2000/svg';
      const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
      const $ = id => document.getElementById(id);
      const T = o => `translate(${o.x ?? 0} ${o.y ?? 0}) rotate(${o.r ?? 0}) scale(${o.sx ?? 1} ${o.sy ?? 1})`;
      const G = (p, o = {}) => el('g', { transform: T(o) }, p);
      const piv = (p, x, y, o = {}) => G(G(p, { x, y }), o);   // inner group rotates around (x, y)

/*CAST*/

      // ---------- Z02 helpers: state-tracked moves so every tween starts where the last one ended ----------
      const ST = new Map();
      const put = (g, o) => { ST.set(g, o); g.setAttribute('transform', T(o)); return g; };
      const go = (g, t, d, b, ease = 'power2.out') => { const a = ST.get(g) || {}; const n = { ...a, ...b }; mv(g, t, d, a, n, ease); ST.set(g, n); };
      const CS = {};   // camera state per scene
      const cg = (id, t, d, b, ease = 'sine.inOut') => { const a = CS[id] || { scale: 1, transformOrigin: '540px 960px' }; const n = { ...a, ...b }; cam(id, t, d, a, n, ease); CS[id] = n; };
      const MS = new Map();   // mouth shapes
      const say = (m, t, d) => { const a = MS.get(m) || m.getAttribute('d'); tl.fromTo(m, { attr: { d: a } }, { attr: { d }, duration: .08, immediateRender: false }, t); MS.set(m, d); };
      const talk = (m, t0, t1, open, shut) => { for (let t = t0; t < t1 - .12; t += .2) { say(m, t, open); say(m, t + .1, shut); } };
      const TM = { n: 'M16 16 Q22 18 28 15', o: 'M14 10 Q22 28 30 10 Z', g: 'M12 10 Q22 26 32 9 Z' };   // Tae: neutral / shout / grin
      const FM = { n: 'M14 15 Q20 17 25 14', o: 'M12 10 Q20 28 28 10 Z', g: 'M12 11 Q20 22 28 10 Z' };
      const mouthFill = m => { m.setAttribute('fill', '#5a1a1a'); return m; };
      const appear = (g, t, on = 1) => tl.set(g, { attr: { opacity: on } }, t);

      // fight beats (the same formulas are in audio/ambience.py)
      const H = {
        slap: [S[1] + .25, S[1] + 1.05, S[1] + 1.85], crack: S[8] + .45, shatter: S[8] + 1.5,
        shelf: S[9] + .9, bonk: S[10] + 1.0, clamp: Math.min(S[10] + 2.0, S[11] - .4),
        atm: S[11] + .75, can: Math.min(S[11] + 1.7, S[12] - .35),
        head: Math.min(S[12] + 1.95, S[13] - .3), dive: Math.min(S[14] + 1.8, S[15] - .35),
        lid: S[15] + .3, swing: E[17] - .2, bark: S[19] + .1, elbow: Math.min(S[20] + .7, S[21] - .5), seal: S[21] + 2.0,
      };
      H.shin = H.head - .75;
      H.thump = [1.0, 1.8, 2.6].map(d => S[15] + d).filter(t => t < S[16] - .25);
      H.crate = [1.4, 2.2].map(d => S[15] + d).filter(t => t < S[16] - .25);

      // ---------- subtitles ----------
      const LINES = [null,
        ['ตีสอง ไฟดับทั้งเขต…<br>มีมือแปะกระจก ทีละมือ', 'r'],
        ['แปดชั่วโมงก่อน ฝนโดนข่วน<br>และเธอยังไม่เปลี่ยน', ''],
        ['แต่ไม่มีใครรู้…<br>ว่ารอยข่วน นับด้วยไหม', 'y'],
        ['<b>ฝน:</b> “ถ้าฉันเปลี่ยน ตีหัวเลยนะ<br>ไม่ต้องลังเล”', ''],
        ['<b>เต้:</b> “ได้พี่<br>แต่ขอซื้อขนมก่อนนะ”', ''],
        ['หลังร้าน มีเสียงขูดประตูเบาๆ…<br>แล้วเงียบ', 'r'],
        ['กลางคืน พวกมันไม่เดินแล้ว…<br>มันวิ่ง', 'r'],
        ['กระจกร้าว เปรี๊ยะ!<br>แล้วแตกทั้งบาน', 'r'],
        ['ฝนถีบชั้นวาง ล้มขวางทาง<br>โครม!', 'y'],
        ['ตัวแรกข้ามมา โดนประตูตู้แช่<br>หนีบหัว เคร้ง!', 'y'],
        ['เต้ปากระป๋องปลากระป๋อง<br>ใส่หน้าตัวที่สอง', ''],
        ['<b>เต้:</b> “ซื้อครบสามร้อย<br>ได้แสตมป์ไหมพี่!”', ''],
        ['<b>ฝน:</b> “ตู้ไอติม! เปิดฝาไว้!”', 'y'],
        ['ตัวที่สามพุ่งใส่ ฝนหลบ<br>มันดิ่งลงตู้', ''],
        ['ปิดฝา! ฝนนั่งทับ<br>มันทุบอยู่ข้างใต้', 'y'],
        ['ตัวใหญ่สุด<br>กระโจนข้ามเคาน์เตอร์…', 'r'],
        ['เต้เหวี่ยงหมวกกลางอากาศ…<br>ตุ้บ!', 'y'],
        ['แต่เต้ไม่เห็น<br>ตัวที่คลานมาข้างหลัง', 'r'],
        ['โฮ่ง! เสียงหมาเห่า<br>จากหลังร้าน', 'y'],
        ['เต้หันทัน ศอกลงกลางหัว<br>ร่วงไม่ลุก', ''],
        ['ทั้งคู่ดันตู้น้ำ ปิดหน้าร้าน…<br>เงียบแล้ว', ''],
        ['<b>เต้:</b> “หมา…<br>ในร้านเซเว่นเหรอพี่”', ''],
        ['ประตูหลังร้าน<br>ค่อยๆ แง้มออก', 'r'],
        ['ไฟฉายส่องหน้า… เด็กผู้หญิง<br>กอดหมาสีน้ำตาล', 'y'],
        ['<b>มิว:</b> “อย่าตีหนูนะ…<br>ข้าวตังเห่าช่วยพี่แล้ว”', ''],
        ['ในแสงไฟฉาย ฝนเห็นเศษกระจก<br>ฝังอยู่ในแผล', 'y'],
        ['<b>ฝน:</b> “กระจกรถเมล์…<br>ไม่ใช่เล็บมัน”', 'y'],
        null];
      const subs = $('subs');
      for (let n = 1; n < LINES.length; n++) { if (!LINES[n]) continue;
        const d = document.createElement('div'); d.className = 'sub ' + LINES[n][1];
        d.innerHTML = LINES[n][1] === 'r' ? `<span>${LINES[n][0]}</span>` : LINES[n][0]; subs.appendChild(d);
        const off = Math.min(E[n] + .35, (S[n + 1] ?? END) - .05);
        tl.fromTo(d, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .18, ease: 'power2.out', immediateRender: false }, S[n] - .05);
        tl.to(d, { opacity: 0, duration: .1 }, off); }

      // clock 02:00 -> 02:09; red while the glass is down (breach to the seal)
      { const o = { v: 0 }; tl.fromTo(o, { v: 0 }, { v: 9.9, duration: E[27] - S[1], ease: 'none', immediateRender: false, onUpdate: () => $('clockt').textContent = '02:0' + Math.floor(o.v) }, S[1]); }
      tl.fromTo('#clock', { backgroundColor: '#EEE8DC' }, { backgroundColor: RED, duration: .3, immediateRender: false }, S[8]); tl.fromTo('#clockt', { color: '#1d2433' }, { color: '#fff', duration: .3, immediateRender: false }, S[8]);
      tl.to('#clock', { backgroundColor: '#EEE8DC', duration: .4 }, S[21] + 1.5); tl.to('#clockt', { color: '#1d2433', duration: .4 }, S[21] + 1.5);
      tl.to('#clock, #ep', { opacity: 0, duration: .3 }, S[28] - .2);

      // a hand pressed on glass (palm towards us)
      function palm(p, x, y, r, sc = 1) {
        const g = G(p, { x, y, r, sx: sc, sy: sc });
        el('ellipse', { rx: 48, ry: 56, fill: ZSK }, g);
        [[-34, -50, -14], [-12, -64, -4], [12, -64, 4], [34, -52, 14]].forEach(([fx, fy, fr]) =>
          el('rect', { x: fx - 11, y: fy - 58, width: 22, height: 74, rx: 11, fill: ZSK, transform: `rotate(${fr} ${fx} ${fy})` }, g));
        el('rect', { x: 36, y: -10, width: 22, height: 62, rx: 11, fill: ZSK, transform: 'rotate(-50 46 20)' }, g);
        el('ellipse', { rx: 26, ry: 30, fill: '#6e7e68', opacity: .6 }, g);
        el('path', { d: 'M-20 30 Q0 50 24 26', stroke: '#7a1418', 'stroke-width': 5, fill: 'none', opacity: .7 }, g);
        return g;
      }
      // an exit sign on battery, glowing green
      function exitSign(p, x, y, sc = 1) {
        const g = G(p, { x, y, sx: sc, sy: sc });
        el('circle', { r: 150, fill: 'url(#gExit)' }, g);
        el('rect', { x: -80, y: -28, width: 160, height: 56, rx: 6, fill: '#1fbf5a', stroke: '#0e5a2a', 'stroke-width': 4 }, g);
        el('text', { x: 18, y: 12, 'font-size': 30, 'font-weight': 800, 'text-anchor': 'middle', fill: '#eafff0', 'font-family': 'Prompt' }, g).textContent = 'ทางออก';
        el('path', { d: 'M-62 14 L-52 -4 L-44 4 L-38 -10', stroke: '#eafff0', 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' }, g);
        el('circle', { cx: -50, cy: -14, r: 5, fill: '#eafff0' }, g);
        return g;
      }
      // a small sparkle (glass glint)
      function glint(p, x, y, sc = 1) {
        const g = G(p, { x, y, sx: sc, sy: sc });
        el('path', { d: 'M0 -40 L7 -7 L40 0 L7 7 L0 40 L-7 7 L-40 0 L-7 -7 Z', fill: '#fff' }, g);
        el('circle', { r: 10, fill: '#cfe8ff' }, g);
        return g;
      }

      // ================= 1 + 8. the shop glass from inside: hands, then the breach =================
      { const s = $('sGlass');
        el('rect', { width: 1080, height: 1920, fill: 'url(#gOut)' }, s);
        el('circle', { cx: 820, cy: 520, r: 220, fill: 'url(#gMoon)' }, s);
        el('circle', { cx: 820, cy: 520, r: 64, fill: '#dfe8ff', opacity: .9 }, s);
        skyline(s, 1020, '#10162a', 5, 380);
        el('rect', { y: 1020, width: 1080, height: 900, fill: '#0c1120' }, s);
        for (let x = -40; x < 1080; x += 220) el('rect', { x, y: 1180, width: 120, height: 8, fill: '#3a4664', opacity: .5 }, s);
        // the crowd standing in the dark soi, eye dots only
        const crowd = G(s); seed = 12;
        for (let i = 0; i < 13; i++) { const x = 30 + i * 82 + rnd() * 40, y = 1080 + rnd() * 70, sc = .45 + rnd() * .3; zSil(crowd, x, y, (rnd() > .5 ? 1 : -1) * sc, '#05070f'); }
        // near runners for the breach
        const near = [[230, 1620, 3.2], [600, 1700, -3.4], [880, 1600, -3.0]].map(([x, y, sc]) => {
