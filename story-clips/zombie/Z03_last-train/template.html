<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!--
      Zombie series "กรุงเทพฯ ไม่มีพรุ่งนี้" Z03 "ขบวนสุดท้าย" (user, 2026-10-28). Pure zombie action, no eyewear/brand. Thai only.
      ../template.html is the source: ../build.py inlines ../audio/timing.json (S = cue starts, E = cue ends, 1-based),
      ../../_shared/cast.js at /*CAST*/ (characters + timeline helpers) -> index.html.
      Everything is drawn in SVG by the script below; scenes switch on cue times, so re-timing the voice needs no edits here.
      Scenes: hook 1 | city 2-3 | line (side view) 4 | carriages 5-16 (fight in side-section, lines 10-16 inside it)
      | jump 16-17 | breather 17-19 | street looks up 20-21 | rail 22 | next 23
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800;900&family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0a10; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Anuphan', sans-serif; color: #fff; }
      .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .scene { opacity: 0; overflow: hidden; }
      .cam { transform-origin: 540px 960px; }
      svg { display: block; overflow: visible; }

      .sub { position: absolute; left: 50px; right: 50px; top: 1600px; text-align: center; font-family: 'Prompt', sans-serif; font-weight: 700;
             font-size: 58px; line-height: 1.3; opacity: 0; text-shadow: 0 4px 0 #000, 0 0 18px rgba(0,0,0,.9), 0 0 4px #000; }
      .sub.y { color: #FFD23F; }
      .sub.r span { display: inline-block; background: #D8343A; color: #fff; padding: 4px 26px 8px; border-radius: 10px; text-shadow: none;
                    box-shadow: 0 6px 24px rgba(0,0,0,.45); }
      .sub b { color: #9fe8ff; font-weight: 800; }

      .chip { position: absolute; top: 150px; height: 86px; background: #EEE8DC; border-radius: 16px; color: #1d2433; display: flex; align-items: center;
              gap: 14px; padding: 0 26px 0 20px; box-shadow: 0 8px 26px rgba(0,0,0,.45); }
      .chip small { display: block; font-size: 20px; font-weight: 500; color: #555a63; line-height: 1; }
      .chip b { display: block; font-family: 'Prompt'; font-size: 40px; font-weight: 700; line-height: 1.05; letter-spacing: .02em; }
      #ep { left: auto; right: 56px; background: #D8343A; color: #fff; font: 800 34px 'Prompt'; padding: 0 26px; }

      .badge { position: absolute; left: 60px; top: 1380px; background: rgba(12,12,18,.82); border-left: 10px solid #FFD23F; border-radius: 10px;
               padding: 14px 26px; font: 600 38px 'Prompt'; color: #fff; opacity: 0; white-space: nowrap; }
      .badge i { font-style: normal; color: #FFD23F; }
      #tag { position: absolute; left: 50%; top: 420px; transform: translateX(-50%); background: #D8343A; color: #fff; font: 800 50px 'Prompt';
             padding: 10px 34px 14px; border-radius: 12px; opacity: 0; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.5); }

      .fx { position: absolute; font: 900 150px/1 'Prompt'; color: #FFD23F; opacity: 0; white-space: nowrap;
            -webkit-text-stroke: 10px #111; paint-order: stroke fill; text-shadow: 10px 10px 0 #D8343A; transform-origin: 50% 50%; }
      .fx.w { color: #fff; text-shadow: 10px 10px 0 #2a6cd8; }
      .fx.s { font-size: 96px; }

      #title { position: absolute; left: 0; right: 0; top: 360px; text-align: center; opacity: 0; }
      #title h1 { font: 900 112px/1.05 'Prompt'; color: #fff; -webkit-text-stroke: 8px #111; paint-order: stroke fill; text-shadow: 8px 8px 0 #D8343A; }
      #title p { margin-top: 18px; display: inline-block; background: #FFD23F; color: #111; font: 800 44px 'Prompt'; padding: 6px 28px; border-radius: 8px; }

      #flash { background: #fff; opacity: 0; }
      #redv { background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(216,52,58,0) 40%, rgba(150,10,20,.85)); opacity: 0; }
      #bars { pointer-events: none; }
      #bars div { position: absolute; left: 0; width: 1080px; height: 0; background: #000; }

      #next { background: radial-gradient(ellipse 80% 45% at 50% 42%, #2a1416, #0d0b0d 70%); }
      #next .pill { position: absolute; left: 50%; top: 600px; transform: translateX(-50%); border: 2px solid #4a4a55; border-radius: 40px; padding: 8px 30px;
                    font-size: 32px; font-weight: 600; color: #d6d6dc; white-space: nowrap; }
      #next .pill:before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #D8343A; margin-right: 12px; vertical-align: 4px; }
      #next h1 { position: absolute; left: 40px; right: 40px; top: 700px; text-align: center; font: 900 120px/1.15 'Prompt'; color: #fff;
                 -webkit-text-stroke: 8px #111; paint-order: stroke fill; text-shadow: 8px 8px 0 #D8343A; }
      #next .rl { position: absolute; left: 400px; top: 1000px; width: 280px; height: 8px; background: #D8343A; border-radius: 4px; }
      #next .s1 { position: absolute; left: 0; right: 0; top: 1040px; text-align: center; font: 700 40px 'Prompt'; color: #FFD23F; }
      #next .s2 { position: absolute; left: 0; right: 0; top: 1110px; text-align: center; font-size: 34px; color: #c8c8d0; }
      #next .sr { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font: 800 46px 'Prompt'; color: #e05a5f; letter-spacing: .04em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="@TOTAL@" data-width="1080" data-height="1920">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0c1c" /><stop offset=".7" stop-color="#2a2048" /></linearGradient>
          <radialGradient id="gGlow"><stop offset="0" stop-color="#ffb070" stop-opacity=".9" /><stop offset="1" stop-color="#ffb070" stop-opacity="0" /></radialGradient>
          <radialGradient id="gEye"><stop offset="0" stop-color="#fff" stop-opacity=".9" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
        </defs>
      </svg>

      <div id="hook" class="scene full" style="opacity:1"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sHook"></svg></div></div>
      <div id="city" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sCity"></svg></div></div>
      <div id="line" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sLine"></svg></div></div>
      <div id="car" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sCar"></svg></div></div>
      <div id="jump" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sJump"></svg></div></div>
      <div id="rest" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sRest"></svg></div></div>
      <div id="below" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sBelow"></svg></div></div>
      <div id="rail" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sRail"></svg></div></div>

      <div id="redv" class="full"></div>
      <div id="flash" class="full"></div>
      <div id="bars" class="full"><div id="barT" style="top:0"></div><div id="barB" style="bottom:0"></div></div>
      <div id="fxl" class="full"></div>

      <div id="clock" class="chip" style="left:56px">
        <svg viewBox="-24 -24 48 48" width="46" height="46"><circle r="19" fill="none" stroke="#1d2433" stroke-width="4" /><path d="M0 -10 L0 0 L8 6" fill="none" stroke="#1d2433" stroke-width="4" stroke-linecap="round" /></svg>
        <div><small>วันที่ 2</small><b id="clockt">02:31</b></div>
      </div>
      <div id="ep" class="chip">EP.3</div>

      <div id="subs"></div>

      <div id="next" class="scene full">
        <div class="sr">กรุงเทพฯ ไม่มีพรุ่งนี้</div>
        <div class="pill">ตอนหน้า</div>
        <h1>ชั้น 9</h1>
        <div class="rl"></div>
        <div class="s1">EP.4 เร็วๆ นี้</div>
        <div class="s2">กดติดตาม แล้วไปรอดด้วยกัน</div>
      </div>
    </div>

    <script>
      const TIMING = /*TIMING*/;
      const S = [0], E = [0]; TIMING.cues.forEach(c => { S[c.n] = c.start; E[c.n] = c.end; });
      const END = TIMING.total;
      let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const NS = 'http://www.w3.org/2000/svg';
      const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
      const $ = id => document.getElementById(id);
      const T = o => `translate(${o.x ?? 0} ${o.y ?? 0}) rotate(${o.r ?? 0}) scale(${o.sx ?? 1} ${o.sy ?? 1})`;
      const G = (p, o = {}) => el('g', { transform: T(o) }, p);
      const piv = (p, x, y, o = {}) => G(G(p, { x, y }), o);   // inner group rotates around (x, y)

/*CAST*/

      // ---------- shared episode helpers (from Z02): state-tracked moves so every tween starts where the last one ended ----------
      const ST = new Map();
      const put = (g, o) => { ST.set(g, o); g.setAttribute('transform', T(o)); return g; };
      const go = (g, t, d, b, ease = 'power2.out') => { const a = ST.get(g) || {}; const n = { ...a, ...b }; mv(g, t, d, a, n, ease); ST.set(g, n); };
      const CS = {};   // camera state per scene
      const cg = (id, t, d, b, ease = 'sine.inOut') => { const a = CS[id] || { scale: 1, transformOrigin: '540px 960px' }; const n = { ...a, ...b }; cam(id, t, d, a, n, ease); CS[id] = n; };
      const MS = new Map();   // mouth shapes
      const say = (m, t, d) => { const a = MS.get(m) || m.getAttribute('d'); tl.fromTo(m, { attr: { d: a } }, { attr: { d }, duration: .08, immediateRender: false }, t); MS.set(m, d); };
      const talk = (m, t0, t1, open, shut) => { for (let t = t0; t < t1 - .12; t += .2) { say(m, t, open); say(m, t + .1, shut); } };
      const TM = { n: 'M16 16 Q22 18 28 15', o: 'M14 10 Q22 28 30 10 Z', g: 'M12 10 Q22 26 32 9 Z' };   // Tae: neutral / shout / grin
      const FM = { n: 'M14 15 Q20 17 25 14', o: 'M12 10 Q20 28 28 10 Z', g: 'M12 11 Q20 22 28 10 Z' };
      const mouthFill = m => { m.setAttribute('fill', '#5a1a1a'); return m; };
      const appear = (g, t, on = 1) => tl.set(g, { attr: { opacity: on } }, t);

      const MM = { n: 'M10 12 Q15 14 20 11', o: 'M9 8 Q15 22 21 8 Z' };

      // fight beats (the same formulas are in audio/ambience.py); lines 10-16 sit inside the fight
      const H = {
        slam: S[1] + .15,
        pin: S[10] - 2.2, helm: S[10] - 1.0,
        kick: S[11] - 2.0, elbow: S[11] - .8,
        bar: S[12] - 1.7, knee: S[12] - .7,
        dom1: S[13] - 2.5, dom2: S[13] - 2.2, teeth: S[13] - 1.2, duck: E[13] + .25,
        swing: S[14] - .45,
        door1: S[15] - 1.8, door2: S[15] - 1.2, lever: E[15] + .1,
        trip: S[16] - .9, land: S[17] - .35,
      };
      H.slowA = H.duck + .45;

      // ---------- subtitles ----------
      const LINES = [null,
        ['<b>เต้:</b> “อย่าหายใจดัง…<br>มันฟังอยู่”', 'r'],
        ['ตีสองครึ่ง<br>ข้างล่างเต็มไปด้วยพวกมัน', ''],
        ['ฝนบอก โรงพยาบาล<br>อยู่อีกฝั่งของราง', ''],
        ['ทางเดียวที่ไม่มีพวกมัน…<br>คือข้างบน', 'y'],
        ['รถไฟฟ้าขบวนนี้<br>จอดค้างตั้งแต่เย็น', ''],
        ['<b>มิว:</b> “ในรถ…<br>มีคนนั่งอยู่”', 'r'],
        ['<b>ฝน:</b> “ไม่ใช่คนแล้วจ้ะหนู”', 'r'],
        ['โฮ่ง! โฮ่ง!', 'r'],
        ['<b>เต้:</b> “โอเค…<br>ป้ายหน้า โรงพยาบาลครับ”', 'y'],
        ['<b>ฝน:</b> “ตีหัว!<br>ที่อื่นไม่หยุด!”', 'y'],
        ['<b>เต้:</b> “ขอโทษพี่<br>ไม่ได้ลุกให้คนแก่!”', ''],
        ['ตู้สอง… ยังมีอีก', 'r'],
        ['<b>ฝน:</b> “ก้มลง!”', 'r'],
        ['<b>เต้:</b> “บัตรรถไฟฟ้าหักอีก<br>ซวยซ้ำ!”', ''],
        ['ประตูฉุกเฉิน…<br>ดึงคันโยก!', 'y'],
        ['<b>เต้:</b> “โดด!”', 'r'],
        ['ทุกคนยังอยู่ครบ…<br>มิว ข้าวตัง ฝน', ''],
        ['<b>มิว:</b> “พี่เต้ เลือดออก”', ''],
        ['<b>เต้:</b> “เลือดมัน<br>ไม่ใช่ของพี่”', ''],
        ['แล้วเสียงข้างล่าง…<br>ก็เงียบไป', ''],
        ['ทั้งถนน…<br>เงยหน้าขึ้นมามองเรา', 'r'],
        ['ทางเดียวที่เหลือ…<br>คือรางนี้', 'y'],
        null];
      const subs = $('subs');
      for (let n = 1; n < LINES.length; n++) { if (!LINES[n]) continue;
        const d = document.createElement('div'); d.className = 'sub ' + LINES[n][1];
        d.innerHTML = LINES[n][1] === 'r' ? `<span>${LINES[n][0]}</span>` : LINES[n][0]; subs.appendChild(d);
        const off = Math.min(E[n] + .35, (S[n + 1] ?? END) - .05);
        tl.fromTo(d, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .18, ease: 'power2.out', immediateRender: false }, S[n] - .05);
        tl.to(d, { opacity: 0, duration: .1 }, off); }

      // clock 02:31 -> 02:33
      { const o = { v: 31 }; tl.fromTo(o, { v: 31 }, { v: 33.9, duration: E[22] - S[1], ease: 'none', immediateRender: false, onUpdate: () => $('clockt').textContent = '02:' + Math.floor(o.v) }, S[1]); }
      tl.to('#clock, #ep', { opacity: 0, duration: .3 }, S[23] - .2);

      const flicker = (sel, t0, t1, seedN) => { seed = seedN; for (let t = t0; t < t1; t += .25 + rnd() * .9) { tl.to(sel, { opacity: .55, duration: .04 }, t); tl.to(sel, { opacity: 1, duration: .05 }, t + .06 + rnd() * .08); } };
      const NIGHT = '#0c1024';

      // ================= 1. hook: a face slams the window =================
      { const s = $('sHook'), t1 = S[2] - .05;
        el('rect', { width: 1080, height: 1920, fill: '#05060c' }, s);
        el('rect', { x: 120, y: 360, width: 860, height: 1000, rx: 60, fill: '#0e1430', stroke: '#2a2f3c', 'stroke-width': 30 }, s);
        seed = 3; for (let i = 0; i < 40; i++) el('circle', { cx: 160 + rnd() * 780, cy: 900 + rnd() * 400, r: 2 + rnd() * 4, fill: ['#ffcf6a', '#ff7a5a', '#fff'][i % 3], opacity: .6 }, s);
        const face = G(s); face.setAttribute('opacity', 0);
        el('ellipse', { cx: 700, cy: 800, rx: 230, ry: 260, fill: ZSK, opacity: .95 }, face);
        el('ellipse', { cx: 630, cy: 760, rx: 34, ry: 22, fill: '#fff' }, face); el('ellipse', { cx: 780, cy: 760, rx: 34, ry: 22, fill: '#fff' }, face);
        el('circle', { cx: 630, cy: 760, r: 60, fill: 'url(#gEye)' }, face); el('circle', { cx: 780, cy: 760, r: 60, fill: 'url(#gEye)' }, face);
        el('path', { d: 'M600 920 Q700 990 810 910 Q700 940 600 920 Z', fill: '#3a0a10' }, face);
        el('path', { d: 'M640 925 L650 960 M700 935 L700 975 M760 925 L752 962', stroke: '#8a1018', 'stroke-width': 8 }, face);
        [[430, 640, -20], [950, 620, 18]].forEach(([x, y, r]) => { const h = G(face, { x, y, r });
          el('ellipse', { rx: 70, ry: 90, fill: ZSK, opacity: .9 }, h);
          [-44, -15, 15, 44].forEach(dx => el('rect', { x: dx - 12, y: -170, width: 24, height: 100, rx: 12, fill: ZSK, opacity: .9 }, h)); });
        el('rect', { x: 120, y: 360, width: 860, height: 1000, rx: 60, fill: '#fff', opacity: .05 }, s);
        // Tae in the foreground, hand over his mouth
        const tH = tae(s, { x: 260, y: 2380, sx: 4.2, sy: 4.2 }, { helmet: false, armF: { r: -168 } });
        tl.set(face, { attr: { opacity: 1 } }, H.slam);
        tl.fromTo(face, { attr: { transform: T({ x: 700, y: 800, sx: .6, sy: .6 }) } }, { attr: { transform: T({ x: 0, y: 0 }) }, duration: .1, ease: 'power3.in', immediateRender: false }, H.slam - .1);
        hit('hook', s, H.slam, 700, 820, 'ปึ้ง!', 520, 420, 'w', -8);
        cam('hook', 0, t1, { scale: 1.06, transformOrigin: '540px 900px' }, { scale: 1.18 }, 'sine.in');
        flicker('#hook .cam', H.slam + .6, t1, 5);
        show('hook', 0, t1); }

      // ================= 2-3. the city from the station stairs =================
      { const s = $('sCity'), t0 = S[2] - .05, t1 = S[4] - .05;
        el('rect', { width: 1080, height: 1920, fill: 'url(#gNight)' }, s);
        el('circle', { cx: 860, cy: 420, r: 70, fill: '#e8e2c4', opacity: .8 }, s);
        skyline(s, 1000, '#1c1a34', 13, 360);
        const m = G(s, { x: 300, y: 1060 });
        el('path', { d: 'M-22 0 L22 0 L12 -420 L0 -460 L-12 -420 Z', fill: '#100e20' }, m); el('rect', { x: -70, y: -60, width: 140, height: 60, fill: '#100e20' }, m);
        el('rect', { y: 1000, width: 1080, height: 920, fill: '#141225' }, s);
        // burning bus
        const bus = G(s, { x: 640, y: 1300 }); el('rect', { x: -170, y: -110, width: 340, height: 110, rx: 12, fill: '#4a1a18' }, bus);
        const fire = G(bus); [[-110, 90], [-20, 130], [80, 100]].forEach(([x, h]) => el('path', { d: `M${x - 50} -110 Q${x - 40} ${-110 - h} ${x} ${-110 - h * 1.3} Q${x + 30} ${-110 - h * .8} ${x + 50} -110 Z`, fill: '#ff8a2a', opacity: .9 }, fire));
        el('circle', { cx: 0, cy: -160, r: 260, fill: 'url(#gGlow)', opacity: .5 }, bus);
        for (let k = 0; k < (t1 - t0) / .15; k++) tl.to(fire, { attr: { transform: T({ sx: 1 + (k % 2 ? .08 : -.05), sy: 1 + (k % 3) * .06 }) }, duration: .15 }, t0 + k * .15);
        // swarm: eye dots drifting toward the fire
        seed = 17; const sw = G(s);
        for (let i = 0; i < 140; i++) { const x = rnd() * 1080, y = 1140 + rnd() * 700, g = G(sw, { x, y });
          el('circle', { r: 9 + (y - 1140) / 70, fill: '#07060e' }, g); el('circle', { cx: -3, cy: -3, r: 2.2, fill: '#fff' }, g); el('circle', { cx: 4, cy: -3, r: 2.2, fill: '#fff' }, g);
          mv(g, t0, t1 - t0, { x, y }, { x: x + (640 - x) * .12, y: y + (1300 - y) * .08 }, 'none'); }
        // viaduct + station stairs with four small figures climbing
        el('rect', { x: -40, y: 860, width: 1160, height: 70, fill: '#2c2f42' }, s);
        [80, 420, 760, 1040].forEach(x => el('rect', { x: x - 26, y: 930, width: 52, height: 400, fill: '#23253a' }, s));
        const st = G(s, { x: 820, y: 1500 });
        for (let i = 0; i < 12; i++) el('rect', { x: i * -28, y: -i * 48, width: 120, height: 48, fill: '#3a3d55' }, st);
        const climb = G(st); [['#f07a1e', 0], ['#2a9d8f', 40], ['#f5a8c8', 75], ['#9a6232', 100]].forEach(([c, d]) => { const p = person(climb, -d, -20, .55, c, false, false); });
        mv(climb, t0, t1 - t0, { x: 0, y: 0 }, { x: -250, y: -430 }, 'none');
        cam('city', t0, t1 - t0, { scale: 1.25, transformOrigin: '640px 1200px' }, { scale: 1 }, 'power1.out');
        show('city', t0, t1); }

      // ================= 4. side view of the line: train stuck, hospital far right =================
      { const s = $('sLine'), t0 = S[4] - .05, t1 = S[5] - .05;
        el('rect', { width: 1080, height: 1920, fill: 'url(#gNight)' }, s);
        const w = G(s);
        skyline(w, 1050, '#1c1a34', 23, 300); const w2 = G(w, { x: 1150 }); skyline(w2, 1050, '#1c1a34', 29, 300);
        el('rect', { x: -100, y: 1050, width: 2600, height: 900, fill: '#141225' }, w);
        el('rect', { x: -100, y: 1100, width: 2600, height: 60, fill: '#2c2f42' }, w);
