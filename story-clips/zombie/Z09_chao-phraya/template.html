<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!--
      Zombie series "กรุงเทพฯ ไม่มีพรุ่งนี้" Z09 "เจ้าพระยา" (user, 2026-10-28). Pure zombie action, no eyewear/brand. Thai only.
      ../template.html is the source: ../build.py inlines ../audio/timing.json (S = cue starts, E = cue ends, 1-based)
      and ../_shared/cast.js (characters + timeline helpers, at /*CAST*/) -> index.html.
      Everything is drawn in SVG by the script below; scenes switch on cue times, so re-timing the voice needs no edits here.
      Scenes: canal 1, 3, 5 | bell tower 2 | Fon 4 | river + bridge 6-7 | dog 8 | under the bridge 9 | boat fight + slow-mo 10-17
      | drift montage 18 | two-shot 19-20 | ship ahead 21 | under the pier 22-25 | smile + timer 26 | next 27
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800;900&family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070a14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Anuphan', sans-serif; color: #fff; }
      .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .scene { opacity: 0; overflow: hidden; }
      .cam { transform-origin: 540px 960px; }
      svg { display: block; overflow: visible; }

      .sub { position: absolute; left: 50px; right: 50px; top: 1600px; text-align: center; font-family: 'Prompt', sans-serif; font-weight: 700;
             font-size: 58px; line-height: 1.3; opacity: 0; text-shadow: 0 4px 0 #000, 0 0 18px rgba(0,0,0,.9), 0 0 4px #000; }
      .sub.y { color: #FFD23F; }
      .sub.r span { display: inline-block; background: #D8343A; color: #fff; padding: 4px 26px 8px; border-radius: 10px; text-shadow: none;
                    box-shadow: 0 6px 24px rgba(0,0,0,.45); }
      .sub b { color: #9fe8ff; font-weight: 800; }

      .chip { position: absolute; top: 150px; height: 86px; background: #EEE8DC; border-radius: 16px; color: #1d2433; display: flex; align-items: center;
              gap: 14px; padding: 0 26px 0 20px; box-shadow: 0 8px 26px rgba(0,0,0,.45); }
      .chip small { display: block; font-size: 20px; font-weight: 500; color: #555a63; line-height: 1; }
      .chip b { display: block; font-family: 'Prompt'; font-size: 40px; font-weight: 700; line-height: 1.05; letter-spacing: .02em; }
      #ep { left: auto; right: 56px; background: #D8343A; color: #fff; font: 800 34px 'Prompt'; padding: 0 26px; }
      #timer { left: 330px; top: 1180px; background: #D8343A; color: #fff; opacity: 0; transform-origin: 0 0; }
      #timer small { color: #fff; }

      .badge { position: absolute; left: 60px; top: 1380px; background: rgba(12,12,18,.82); border-left: 10px solid #FFD23F; border-radius: 10px;
               padding: 14px 26px; font: 600 38px 'Prompt'; color: #fff; opacity: 0; white-space: nowrap; }
      .badge i { font-style: normal; color: #FFD23F; }

      .fx { position: absolute; font: 900 150px/1 'Prompt'; color: #FFD23F; opacity: 0; white-space: nowrap;
            -webkit-text-stroke: 10px #111; paint-order: stroke fill; text-shadow: 10px 10px 0 #D8343A; transform-origin: 50% 50%; }
      .fx.w { color: #fff; text-shadow: 10px 10px 0 #2a6cd8; }
      .fx.s { font-size: 96px; }
      .fx.xs { font-size: 70px; -webkit-text-stroke: 7px #111; text-shadow: 6px 6px 0 #D8343A; }
      .fx.red { color: #ff4a50; text-shadow: none; }

      #title { position: absolute; left: 0; right: 0; top: 360px; text-align: center; opacity: 0; }
      #title h1 { font: 900 112px/1.05 'Prompt'; color: #fff; -webkit-text-stroke: 8px #111; paint-order: stroke fill; text-shadow: 8px 8px 0 #D8343A; }
      #title p { margin-top: 18px; display: inline-block; background: #FFD23F; color: #111; font: 800 44px 'Prompt'; padding: 6px 28px; border-radius: 8px; }

      #flash { background: #fff; opacity: 0; }
      #redv { background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(216,52,58,0) 40%, rgba(150,10,20,.85)); opacity: 0; }
      #blk { background: #000; opacity: 0; }
      #bars { pointer-events: none; }
      #bars div { position: absolute; left: 0; width: 1080px; height: 0; background: #000; }

      #next { background: radial-gradient(ellipse 80% 45% at 50% 42%, #18243f, #070a16 70%); }
      #next .dawn { position: absolute; left: 0; right: 0; bottom: 0; height: 260px; background: linear-gradient(to top, rgba(255,140,60,.55), rgba(255,140,60,0)); }
      #next .dl { position: absolute; left: 0; right: 0; bottom: 120px; height: 6px; background: #ff9a3d; box-shadow: 0 0 30px #ff9a3d; }
      #next .pill { position: absolute; left: 50%; top: 600px; transform: translateX(-50%); border: 2px solid #4a5068; border-radius: 40px; padding: 8px 30px;
                    font-size: 32px; font-weight: 600; color: #d6d6dc; white-space: nowrap; }
      #next .pill:before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #D8343A; margin-right: 12px; vertical-align: 4px; }
      #next h1 { position: absolute; left: 40px; right: 40px; top: 700px; text-align: center; font: 900 120px/1.15 'Prompt'; color: #fff;
                 -webkit-text-stroke: 8px #111; paint-order: stroke fill; text-shadow: 8px 8px 0 #D8343A; }
      #next .rl { position: absolute; left: 400px; top: 1000px; width: 280px; height: 8px; background: #ff9a3d; border-radius: 4px; }
      #next .s1 { position: absolute; left: 0; right: 0; top: 1040px; text-align: center; font: 700 40px 'Prompt'; color: #FFD23F; }
      #next .s2 { position: absolute; left: 0; right: 0; top: 1110px; text-align: center; font-size: 34px; color: #c8c8d0; }
      #next .sr { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font: 800 46px 'Prompt'; color: #e05a5f; letter-spacing: .04em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="@TOTAL@" data-width="1080" data-height="1920">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070f" /><stop offset=".6" stop-color="#121a33" /><stop offset="1" stop-color="#1c2444" /></linearGradient>
          <linearGradient id="gNavy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1024" /><stop offset=".7" stop-color="#1e2a52" /></linearGradient>
          <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1638" /><stop offset=".55" stop-color="#4a2c5e" /><stop offset=".8" stop-color="#a0506a" /></linearGradient>
          <linearGradient id="gPreDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1a40" /><stop offset=".5" stop-color="#523466" /><stop offset=".72" stop-color="#d27058" /><stop offset=".8" stop-color="#ffb070" /></linearGradient>
          <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101a30" /><stop offset="1" stop-color="#04070e" /></linearGradient>
          <radialGradient id="gGlow"><stop offset="0" stop-color="#ffe2a0" stop-opacity=".9" /><stop offset="1" stop-color="#ffe2a0" stop-opacity="0" /></radialGradient>
          <radialGradient id="gEye"><stop offset="0" stop-color="#fff" stop-opacity=".9" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
          <filter id="fBlur"><feGaussianBlur stdDeviation="5" /></filter>
        </defs>
      </svg>

      <div id="canal" class="scene full" style="opacity:1"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sCanal"></svg></div></div>
      <div id="tower" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sTower"></svg></div></div>
      <div id="fonc" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sFonc"></svg></div></div>
      <div id="river" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sRiver"></svg></div></div>
      <div id="bark" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sBark"></svg></div></div>
      <div id="under" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sUnder"></svg></div></div>
      <div id="boat" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sBoat"></svg></div></div>
      <div id="drift" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sDrift"></svg></div></div>
      <div id="two" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sTwo"></svg></div></div>
      <div id="ship" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sShip"></svg></div></div>
      <div id="pier" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sPier"></svg></div></div>
      <div id="smile" class="scene full"><div class="cam full"><svg class="full" viewBox="0 0 1080 1920" id="sSmile"></svg></div></div>

      <div id="redv" class="full"></div>
      <div id="flash" class="full"></div>
      <div id="bars" class="full"><div id="barT" style="top:0"></div><div id="barB" style="bottom:0"></div></div>
      <div id="blk" class="full"></div>
      <div id="fxl" class="full"></div>

      <div id="title"><h1>กรุงเทพฯ<br>ไม่มีพรุ่งนี้</h1><p>EP.9 เจ้าพระยา</p></div>
      <div id="bRiver" class="badge"><i>แม่น้ำเจ้าพระยา</i> · ใต้สะพานพุทธ</div>
      <div id="bFort" class="badge"><i>ป้อมพระจุลจอมเกล้า</i> · ปากน้ำ</div>

      <div id="clock" class="chip" style="left:56px">
        <svg viewBox="-24 -24 48 48" width="46" height="46"><circle r="19" fill="none" stroke="#1d2433" stroke-width="4" /><path d="M0 -10 L0 0 L8 6" fill="none" stroke="#1d2433" stroke-width="4" stroke-linecap="round" /></svg>
        <div><small>วันที่ 3</small><b id="clockt">01:02</b></div>
      </div>
      <div id="ep" class="chip">EP.9</div>

      <div id="subs"></div>

      <div id="next" class="scene full">
        <div class="dawn"></div><div class="dl"></div>
        <div class="sr">กรุงเทพฯ ไม่มีพรุ่งนี้</div>
        <div class="pill">ตอนหน้า</div>
        <h1>รุ่งเช้า<br>ที่ปากน้ำ</h1>
        <div class="rl"></div>
        <div class="s1">EP.10 ตอนจบ เร็วๆ นี้</div>
        <div class="s2">กดติดตาม แล้วไปรอดด้วยกัน</div>
      </div>

      <div id="timer" class="chip">
        <svg viewBox="-24 -24 48 48" width="46" height="46"><circle r="19" fill="none" stroke="#fff" stroke-width="4" /><path d="M0 -10 L0 0 L8 6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" /></svg>
        <div><small>ถูกกัด</small><b id="timert">03:00</b></div>
      </div>
    </div>

    <script>
      const TIMING = /*TIMING*/;
      const S = [0], E = [0]; TIMING.cues.forEach(c => { S[c.n] = c.start; E[c.n] = c.end; });
      const END = TIMING.total;
      let seed = 9; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const NS = 'http://www.w3.org/2000/svg';
      const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
      const $ = id => document.getElementById(id);
      const T = o => `translate(${o.x ?? 0} ${o.y ?? 0}) rotate(${o.r ?? 0}) scale(${o.sx ?? 1} ${o.sy ?? 1})`;
      const G = (p, o = {}) => el('g', { transform: T(o) }, p);
      const piv = (p, x, y, o = {}) => G(G(p, { x, y }), o);   // inner group rotates around (x, y)

/*CAST*/

      // ---------- Z09 props ----------
      // long-tail boat, side view, stern (engine) left, bow right; origin = deck centre, deck at y 0, waterline ~ y 40.
      // Layers: back (posts, engine, shaft) < chars < front (hull side, covers the feet) < roof (canopy) < top (things on the canopy).
      function longtail(p, o) {
        const g = G(p, o);
        const back = G(g), chars = G(g), front = G(g), roof = G(g), top = G(g);
        el('rect', { x: -440, y: -40, width: 900, height: 14, fill: '#3e2616' }, back);
        [-220, 220].forEach(x => el('rect', { x: x - 5, y: -444, width: 10, height: 444, fill: '#4a4e58' }, back));
        // engine + long shaft + tiller
        const eng = G(back, { x: -470, y: -50 });
        el('line', { x1: 0, y1: 0, x2: -100, y2: 150, stroke: '#7d838e', 'stroke-width': 11, 'stroke-linecap': 'round' }, eng);
        const prop = G(eng, { x: -100, y: 150 });
        el('ellipse', { rx: 34, ry: 8, fill: '#a0a6b0' }, prop); el('ellipse', { rx: 8, ry: 30, fill: '#8a909a' }, prop);
        el('rect', { x: -38, y: -44, width: 76, height: 56, rx: 8, fill: '#5a616c' }, eng);
        el('rect', { x: -30, y: -60, width: 22, height: 20, fill: '#3a3f48' }, eng);
        el('line', { x1: 20, y1: -20, x2: 110, y2: -96, stroke: '#2a2d33', 'stroke-width': 9, 'stroke-linecap': 'round' }, eng);
        // hull
        el('path', { d: 'M-450 -26 Q0 -12 430 -40 Q472 -64 500 -132 L514 -128 Q506 -40 452 22 Q300 74 0 74 Q-300 74 -426 52 Q-458 30 -450 -26 Z', fill: '#6b4428', stroke: '#2a180c', 'stroke-width': 4 }, front);
        el('path', { d: 'M-450 -26 Q0 -12 430 -40 Q472 -64 500 -132', stroke: '#e0b030', 'stroke-width': 9, fill: 'none' }, front);
        el('path', { d: 'M-440 4 Q0 18 440 -8', stroke: '#c8352e', 'stroke-width': 10, fill: 'none' }, front);
        ['#ff5a9a', '#ffd23f', '#3fd27a', '#fff'].forEach((c, i) => el('path', { d: `M506 -128 Q${520 + i * 6} -96 ${512 + i * 9} -60`, stroke: c, 'stroke-width': 5, fill: 'none' }, front));
        // canopy: two halves (pivot at the outer ends) so it can tear in the middle
        const cL = piv(roof, -250, -446), cR = piv(roof, 250, -446);
        el('rect', { x: 0, y: -12, width: 252, height: 24, fill: '#2e5f8f' }, cL); el('rect', { x: -252, y: -12, width: 252, height: 24, fill: '#2e5f8f' }, cR);
        for (let x = 8; x < 250; x += 26) { el('path', { d: `M${x} 12 l12 0 l-6 12 Z`, fill: '#e8c040' }, cL); el('path', { d: `M${-x - 12} 12 l12 0 l-6 12 Z`, fill: '#e8c040' }, cR); }
        const dent = el('path', { d: 'M-220 -434 Q-170 -360 -130 -380 Q-100 -366 -80 -434 Z', fill: '#24507a', opacity: 0 }, roof);
        const lan = G(roof, { x: -150, y: -434 });
        el('line', { x1: 0, y1: 0, x2: 0, y2: 44, stroke: '#222', 'stroke-width': 3 }, lan);
        el('circle', { cy: 70, r: 40, fill: 'url(#gGlow)', opacity: .7 }, lan);
        el('ellipse', { cy: 70, rx: 18, ry: 24, fill: '#ffcf6a', stroke: '#7a3a12', 'stroke-width': 4 }, lan);
        return { g, back, chars, front, roof, top, prop, cL, cR, dent, lan };
      }
      // Memorial Bridge, side view: steel truss deck between y and y+60, bascule towers, pillars down to the water
      function memBridge(p, y, col, h = 180) {
        const g = G(p);
        el('rect', { x: -100, y, width: 1300, height: 60, fill: col }, g);
        for (let x = -100; x < 1200; x += 90) { el('path', { d: `M${x} ${y} L${x + 45} ${y - h} L${x + 90} ${y}`, stroke: col, 'stroke-width': 12, fill: 'none' }, g); }
        el('rect', { x: -100, y: y - h - 10, width: 1300, height: 16, fill: col }, g);
        [420, 640].forEach(x => el('rect', { x, y: y - h - 120, width: 40, height: h + 180, fill: col }, g));
        [140, 900].forEach(x => el('rect', { x: x - 40, y: y + 60, width: 80, height: 900, fill: col }, g));
        for (let i = 0; i < 9; i++) el('circle', { cx: 60 + i * 120, cy: y + 8, r: 5, fill: '#ffe2a0', opacity: .55 }, g);
        return g;
      }
      // splash: crown + droplets, stays near (x, y)
      function splash(p, t, x, y, s = 1) {
        const g = G(p, { x, y, sx: s, sy: s }); g.setAttribute('opacity', 0);
        const crown = el('path', { d: 'M-90 0 L-70 -70 L-40 -10 L-10 -110 L20 -10 L50 -80 L80 0 Z', fill: '#cfe6ff', opacity: .85 }, g);
        tl.set(g, { attr: { opacity: 1 } }, t);
        tl.fromTo(crown, { attr: { transform: T({ sx: .2, sy: .1 }) } }, { attr: { transform: T({ sx: 1.3, sy: 1.2 }) }, duration: .25, ease: 'power2.out', immediateRender: false }, t);
        for (let i = 0; i < 12; i++) { const d = el('circle', { r: 6 + rnd() * 8, fill: '#e2f0ff' }, g), dx = (rnd() - .5) * 320, up = 120 + rnd() * 160;
          tl.fromTo(d, { attr: { transform: T({}) } }, { attr: { transform: T({ x: dx * .6, y: -up }) }, duration: .3, ease: 'power2.out', immediateRender: false }, t);
          tl.to(d, { attr: { transform: T({ x: dx, y: 40 }) }, duration: .35, ease: 'power2.in' }, t + .3); }
        tl.to(g, { attr: { opacity: 0 }, duration: .2 }, t + .7);
      }
      // sound rings spreading from (x, y)
      function rings(p, t, d, x, y, col = '#ff9a3d', every = .5, r1 = 500) {
        for (let k = 0; k * every < d; k++) { const c = el('circle', { cx: x, cy: y, r: 20, fill: 'none', stroke: col, 'stroke-width': 10, opacity: 0 }, p);
          tl.fromTo(c, { attr: { r: 20, opacity: .9 } }, { attr: { r: r1, opacity: 0 }, duration: 1.2, ease: 'none', immediateRender: false }, t + k * every); }
      }
      // wooden canal houses on stilts along a bank line
      function houses(p, y, sd, sc = 1, lit = .0) {
        const g = G(p); seed = sd; let x = -40;
        while (x < 1140) { const w = (150 + rnd() * 110) * sc, h = (180 + rnd() * 160) * sc, c = ['#2a2230', '#30283a', '#251e2a'][Math.floor(rnd() * 3)];
          el('rect', { x, y: y - h, width: w, height: h, fill: c }, g);
          el('path', { d: `M${x - 16} ${y - h} L${x + w / 2} ${y - h - 70 * sc} L${x + w + 16} ${y - h} Z`, fill: '#1a1420' }, g);
          for (let k = 0; k < 4; k++) el('rect', { x: x + 6 + k * (w - 18) / 3, y, width: 8, height: 90 * sc, fill: '#1a1420' }, g);
          if (rnd() < lit) el('rect', { x: x + w * .3, y: y - h * .6, width: w * .3, height: h * .25, fill: '#ffcf6a', opacity: .5 }, g);
          x += w + 10; }
        return g;
      }
      // legs cycle for a running character (lF/lB pivots)
      const legs = (c, t, d, step = .12, a = 34) => { for (let k = 0; k * step < d; k++) { const s = k % 2 ? 1 : -1;
        tl.to(c.lF, { attr: { transform: T({ r: -a * s }) }, duration: step, ease: 'sine.inOut' }, t + k * step);
        tl.to(c.lB, { attr: { transform: T({ r: a * s }) }, duration: step, ease: 'sine.inOut' }, t + k * step); }
        tl.to([c.lF, c.lB], { attr: { transform: T({}) }, duration: .1 }, t + d); };
      const runner = (p, o, opt = {}) => zomb(p, o, { armF: -20, armR: -10, ...opt });
      const mouthTo = (m, t, d) => tl.to(m, { attr: { d }, duration: .08 }, t);
      const OPEN = 'M14 10 Q22 28 30 10 Z', SHUT = 'M16 16 Q22 18 28 15';

      // ---------- subtitles ----------
      const LINES = [null,
        ['<b>เต้:</b> “ติดสิวะ! ติด!”', 'r'],
        ['ระฆังเงียบแล้ว…<br>และพวกมันหันกลับมาหาเรา', 'r'],
        ['ตีหนึ่งสองนาที วันที่สาม', 'y'],
        ['<b>ฝน:</b> “เรือรบออกตอนรุ่งสาง<br>ต้องถึงปากน้ำให้ทัน”', 'y'],
        ['<b>เต้:</b> “ติดแล้ว! นั่งดีๆ<br>วินเรือมาแล้ว!”', ''],
        ['ออกจากคลอง…<br>เจ้าพระยามืดสนิท', ''],
        ['แต่เสียงดัง… คือเหยื่อล่อ', 'r'],
        ['ข้าวตังเห่าขึ้นไปบนสะพานพุทธ', 'r'],
        ['<b>ฝน:</b> “บนสะพาน! หมอบ!”', 'r'],
        ['<b>เต้:</b> “ลงผิดป้ายแล้วพี่!”', ''],
        ['ตัวที่สอง สาม สี่…<br>ร่วงลงมาไม่หยุด', 'r'],
        ['<b>เต้:</b> “ฝนตกหนักเลย…<br>ไม่ได้หมายถึงเธอนะ!”', ''],
        ['<b>ฝน:</b> “ตีที่หัว!<br>อย่าให้มันกัด!”', 'y'],
        ['เรือเอียง…<br>มิวลื่นไถลไปท้ายเรือ', 'r'],
