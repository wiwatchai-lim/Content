<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>7-float-blue</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../brand/tokens.css">
<style>
  /* From ref.mp4 (stills ref.png, ref-2.png): gradient darkening toward the bottom, frame floating center, a separate floating lens with faint horizontal lines,
     thin type — good for lens/coating-focused posts.
     Reworked off the periwinkle-blue (not a brand colour): gradient now runs Snow → Timberwolf → Pastel Gray → Phthalo Green,
     keeping the same airy-top / grounded-bottom, floating-lens character but on the brand palette. */
  html, body { margin: 0; background: transparent; }
  body { position: relative; width: 1080px; height: 1080px; overflow: hidden; font-family: var(--to-font-body); color: var(--to-black); }
  body > [data-layer] { position: absolute; box-sizing: border-box; }

  .background { inset: 0; background: linear-gradient(180deg, var(--to-snow) 0%, var(--to-timberwolf) 35%, var(--to-pastel) 68%, var(--to-green) 100%); }
  .eyebrow { left: 0; right: 0; top: 78px; text-align: center; font-family: var(--to-font-display); font-weight: 500;
             font-size: 20px; letter-spacing: var(--to-track-eyebrow); text-transform: uppercase; color: var(--to-green); opacity: .8; }
  .headline { left: 60px; right: 60px; top: 122px; margin: 0; text-align: center; font-family: var(--to-font-display);
              font-weight: 500; font-size: 58px; line-height: 1.3; letter-spacing: var(--to-track-display); color: var(--to-black); }
  .lens { left: 96px; top: 690px; width: 212px; height: 256px; transform: rotate(14deg); }
  .ground-shadow { left: 310px; top: 806px; width: 460px; height: 38px; border-radius: 50%; background: radial-gradient(closest-side, rgba(33, 33, 33, .3), rgba(33, 33, 33, 0)); filter: blur(10px); }
  .product { left: 170px; top: 430px; width: 740px; filter: drop-shadow(0 22px 26px rgba(33, 33, 33, .28)); }
  .specs { left: 0; right: 0; bottom: 118px; text-align: center; font-family: var(--to-font-body); font-size: 27px; line-height: 1.55; color: var(--to-snow); }
  .logo { left: var(--to-margin); top: var(--to-margin); width: var(--to-logo-width); }
  .cta { left: 0; right: 0; bottom: 58px; text-align: center; font-family: var(--to-font-display); font-weight: 700;
         font-size: 22px; letter-spacing: var(--to-track-eyebrow); text-transform: uppercase; color: var(--to-snow); opacity: .95; }
</style>
</head>
<body data-width="1080" data-height="1080">
  <div class="background" data-layer="background"></div>
  <img class="logo" data-layer="logo" src="../../brand/logo/timeoptic.svg" alt="">
  <div class="eyebrow" data-layer="eyebrow">FRAME · LENS · COATING</div>
  <h1 class="headline" data-layer="headline">See clearly,<br>your way</h1>
  <svg class="lens" data-layer="lens" viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="glass" cx=".35" cy=".3" r=".9">
        <stop offset="0" stop-color="#FAFAFA" stop-opacity=".85"/>
        <stop offset=".5" stop-color="#CFD0BF" stop-opacity=".35"/>
        <stop offset="1" stop-color="#123A29" stop-opacity=".45"/>
      </radialGradient>
      <clipPath id="disc"><ellipse cx="150" cy="180" rx="132" ry="162"/></clipPath>
    </defs>
    <ellipse cx="150" cy="180" rx="132" ry="162" fill="url(#glass)"/>
    <g clip-path="url(#disc)" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.5">
      <path d="M0 60 H300 M0 90 H300 M0 120 H300 M0 150 H300 M0 180 H300 M0 210 H300 M0 240 H300 M0 270 H300 M0 300 H300"/>
    </g>
    <ellipse cx="150" cy="180" rx="132" ry="162" fill="none" stroke="#123A29" stroke-opacity=".75" stroke-width="3"/>
  </svg>
  <div class="ground-shadow" data-layer="ground-shadow"></div>
  <img class="product" data-layer="product" src="../_preview/front.png" alt="">
  <div class="specs" data-layer="specs">Lens name<br>Coating name</div>
  <div class="cta" data-layer="cta">MESSAGE US</div>
</body>
</html>
