<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>1-type-behind</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../brand/tokens.css">
<style>
  /* From ref.jpg: large type blurred behind the lens, angled frame floating over paper planes, white/taupe palette */
  :root {
    --taupe: #a8968f;
    --ink: #3a3634;
    --muted: #6d6763;
  }
  html, body { margin: 0; background: transparent; }
  body { position: relative; width: 1080px; height: 1080px; overflow: hidden; font-family: var(--to-font-body); color: var(--ink); }
  body > [data-layer] { position: absolute; box-sizing: border-box; }

  .background { left: 0; top: 0; width: 1080px; height: 1080px; }
  .wordmark { left: 80px; top: 68px; font-family: var(--to-font-display); font-size: 54px; font-weight: 800; letter-spacing: var(--to-track-display); color: var(--taupe); }
  /* Large type in 2 layers: type-back is fully blurred, type-lens is sharp only inside the larger lens.
     After placing the real photo, render, measure the lens inner rim on a gridded crop, and update the .type-lens polygon.
     Center the 2nd line in the lens so the top and bottom lines spill outside it (blurred), like the ref. */
  .type-back, .type-lens { left: 0; top: 0; width: 1080px; height: 1080px; }
  .type-back h2, .type-lens h2 { position: absolute; left: 350px; top: 300px; margin: 0; font-family: var(--to-font-display); font-size: 124px; font-weight: 800; line-height: .92; letter-spacing: var(--to-track-display); color: var(--taupe); }
  .type-back h2 { filter: blur(5px); opacity: .9; }
  .type-lens { clip-path: polygon(405px 476px, 425px 452px, 470px 436px, 705px 434px, 735px 452px, 740px 476px, 738px 556px, 720px 578px, 690px 588px, 500px 592px, 455px 576px, 420px 548px, 405px 516px); }
  /* Cutout photos keep their original floor shadow; no extra drop-shadow needed */
  .product { left: 20px; top: 330px; width: 1010px; transform: rotate(-6deg); }
  .note { left: 700px; top: 250px; width: 300px; font-size: 20px; line-height: 1.45; }
  .cta { left: 80px; bottom: 74px; font-size: 20px; line-height: 1.45; }
  .logo { right: var(--to-margin); top: var(--to-margin); width: var(--to-logo-width); }
  .specs { right: 80px; bottom: 74px; width: 520px; text-align: right; font-size: 17px; line-height: 1.6; color: var(--muted); }
</style>
</head>
<body data-width="1080" data-height="1080">
  <svg class="background" data-layer="background" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ebe9e5"/><stop offset="1" stop-color="#d8d5cf"/></linearGradient>
      <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfaf8"/><stop offset="1" stop-color="#eeede9"/></linearGradient>
    </defs>
    <rect width="1080" height="1080" fill="#f6f5f3"/>
    <polygon points="260,264 1080,136 1080,1080 260,1080" fill="url(#wall)"/>
    <polygon points="0,704 1080,944 1080,1080 0,1080" fill="url(#table)"/>
  </svg>
  <img class="logo" data-layer="logo" src="../../brand/logo/timeoptic.svg" alt="">
  <div class="wordmark" data-layer="wordmark">Brand</div>
  <div class="type-back" data-layer="type-back"><h2>Clear<br>Every<br>Day</h2></div>
  <div class="type-lens" data-layer="type-lens"><h2>Clear<br>Every<br>Day</h2></div>
  <img class="product" data-layer="product" src="../_preview/angle.png" alt="">
  <div class="note" data-layer="note">Made for everyday.<br>Comfortable all day long.</div>
  <div class="cta" data-layer="cta">Find your everyday pair.<br>Message us today.</div>
  <div class="specs" data-layer="specs">Brand Model · Color<br>Lens Lens name · Coating Coating name</div>
</body>
</html>
