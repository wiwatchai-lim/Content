<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>9-spec-callout</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../brand/tokens.css">
<style>
  /* From ref.jpg: dark moody ground lit from behind, one hero object tilted in the middle, four short benefit labels
     joined to it by hairline leader lines with a dot, bold headline top centre.
     Own skin: Raisin black into Phthalo green instead of the ref's brown, Peach-orange dots, our own wording.
     Use for lens/coating-led posts where the benefits are the story. Keep to four labels — five is clutter. */
  :root {
    --muted: color-mix(in srgb, var(--to-snow) 72%, transparent);
    --hair: color-mix(in srgb, var(--to-snow) 50%, transparent);
  }
  html, body { margin: 0; background: transparent; }
  body { position: relative; width: 1080px; height: 1080px; overflow: hidden; font-family: var(--to-font-body); color: var(--to-snow); }
  body > [data-layer] { position: absolute; box-sizing: border-box; }

  /* Phthalo lit toward its brand-lifted tint at centre, easing into Raisin Black at the edges.
     Centre stays bright enough that an opaque dark frame still reads against it. */
  /* The product is usually an opaque dark frame: it needs a LIGHT stage or it disappears into the field.
     Timberwolf core easing out to Phthalo Green then Raisin Black — the top stays dark enough for white type.
     Do not use --to-green-on-dark here: that token is for accents ON a dark ground, and as a light source it
     sits at the same value as a black frame, which is exactly how this style's contrast gets lost. */
  .background { inset: 0; background: radial-gradient(58% 44% at 50% 56%, var(--to-timberwolf) 0%, #6E8577 38%, var(--to-green) 68%, var(--to-black) 100%); }
  .headline { left: 120px; right: 120px; top: 84px; margin: 0; text-align: center; font-family: var(--to-font-display);
              font-size: 34px; font-weight: 700; letter-spacing: var(--to-track-display); }
  .product { left: 130px; top: 430px; width: 820px; transform: rotate(-6deg); filter: drop-shadow(0 30px 40px rgba(0, 0, 0, .5)); }

  /* One callout = one layer: label text + hairline + dot. Point the line at the part of the product it describes. */
  [data-layer^="callout"] { font-size: 22px; font-weight: 500; line-height: 1.34; color: var(--muted); }
  [data-layer^="callout"] b { display: block; font-family: var(--to-font-display); font-weight: 700; color: var(--to-snow); }
  [data-layer^="callout"] .dot { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--to-peach); }
  [data-layer^="callout"] .line { position: absolute; height: 1px; background: var(--hair); transform-origin: left center; }

  .callout-a { left: 96px; top: 300px; width: 300px; text-align: right; }
  .callout-a .dot { right: -30px; top: 24px; }
  .callout-a .line { right: -142px; top: 29px; width: 116px; transform: rotate(16deg); }

  .callout-b { left: 60px; top: 770px; width: 260px; text-align: right; }
  .callout-b .dot { right: -30px; top: 22px; }
  .callout-b .line { right: -128px; top: 27px; width: 104px; transform: rotate(-26deg); }

  .callout-c { right: 70px; top: 300px; width: 300px; }
  .callout-c .dot { left: -30px; top: 22px; }
  .callout-c .line { left: -134px; top: 27px; width: 110px; transform: rotate(10deg); }

  .callout-d { right: 96px; top: 770px; width: 280px; }
  .callout-d .dot { left: -30px; top: 22px; }
  .callout-d .line { left: -140px; top: 27px; width: 116px; transform: rotate(-26deg); }

  .specs { left: 0; right: 0; bottom: 64px; text-align: center; font-family: var(--to-font-body);
           font-size: 19px; letter-spacing: var(--to-track-eyebrow); text-transform: uppercase; color: var(--muted); }
  /* Dark ground, so this style uses the white logo file. */
  .logo { left: var(--to-margin); top: var(--to-margin); width: var(--to-logo-width); opacity: .9; }
</style>
</head>
<body data-width="1080" data-height="1080">
  <div class="background" data-layer="background"></div>
  <img class="logo" data-layer="logo" src="../../brand/logo/timeoptic-white.svg" alt="">
  <h1 class="headline" data-layer="headline">Headline about the lens</h1>
  <img class="product" data-layer="product" src="../_preview/front.png" alt="">
  <div class="callout-a" data-layer="callout-a"><b>Benefit one</b>short proof<span class="dot"></span><span class="line"></span></div>
  <div class="callout-b" data-layer="callout-b"><b>Benefit two</b>short proof<span class="dot"></span><span class="line"></span></div>
  <div class="callout-c" data-layer="callout-c"><b>Benefit three</b>short proof<span class="dot"></span><span class="line"></span></div>
  <div class="callout-d" data-layer="callout-d"><b>Benefit four</b>short proof<span class="dot"></span><span class="line"></span></div>
  <div class="specs" data-layer="specs">BRAND MODEL · LENS NAME · COATING NAME</div>
</body>
</html>
