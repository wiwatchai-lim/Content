<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>6-feature-grid</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../brand/tokens.css">
<style>
  /* From ref.jpg: cream background with palm-leaf shadow top-right, large centered brand name + accent rule, frame lying flat with shadow,
     4 icon columns (frame / lens / coating / highlight) with hairline dividers, footer flanked by lines — good for explaining lens + coating.
     Rebuilt on brand tokens: gold accent → Peach-Orange, dividers → --to-hairline, type → Archivo/Inter. */
  :root {
    --muted: #5e5a54;
  }
  html, body { margin: 0; background: transparent; }
  body { position: relative; width: 1080px; height: 1080px; overflow: hidden; font-family: var(--to-font-body); color: var(--to-black); }
  body > [data-layer] { position: absolute; box-sizing: border-box; }

  .background { inset: 0; background: linear-gradient(180deg, var(--to-snow) 0%, var(--to-timberwolf) 100%); }
  .leaf-shadow { right: -120px; top: -160px; width: 660px; height: 660px; filter: blur(9px); }
  .kicker { left: 0; right: 0; top: 72px; text-align: center; font-family: var(--to-font-display); font-weight: 500;
            font-size: 21px; letter-spacing: var(--to-track-eyebrow); text-transform: uppercase; line-height: 1.8; color: var(--to-green); }
  .brand { left: 0; right: 0; top: 148px; text-align: center; font-family: var(--to-font-display); font-weight: 800;
           font-size: 100px; letter-spacing: var(--to-track-display); line-height: 1.1; color: var(--to-black); }
  .tagline { left: 0; right: 0; top: 274px; text-align: center; font-family: var(--to-font-display); font-weight: 700;
             font-size: 20px; letter-spacing: var(--to-track-eyebrow); text-transform: uppercase; color: var(--to-black); }
  .tagline::after { content: ""; display: block; width: 70px; height: 2px; margin: 24px auto 0; background: var(--to-peach); }
  .shadow { left: 250px; top: 668px; width: 580px; height: 52px; border-radius: 50%; background: radial-gradient(closest-side, rgba(33, 33, 33, .28), rgba(33, 33, 33, 0)); filter: blur(8px); }
  .product { left: 200px; top: 388px; width: 680px; }
  .features { left: 50px; right: 50px; top: 752px; display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
  .features div { padding: 0 16px; }
  .features div + div { border-left: 1px solid var(--to-hairline); }
  .features svg { width: 50px; height: 50px; stroke: var(--to-black); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .features h3 { margin: 12px 0 8px; font-family: var(--to-font-display); font-weight: 700; font-size: 19px;
                 letter-spacing: var(--to-track-eyebrow); text-transform: uppercase; color: var(--to-green); }
  .features p { margin: 0; font-family: var(--to-font-body); font-size: 18px; line-height: 1.45; color: var(--muted); }
  .footer { left: 180px; right: 180px; bottom: 48px; display: flex; align-items: center; gap: 24px;
            font-family: var(--to-font-display); font-weight: 700; font-size: 20px; letter-spacing: var(--to-track-eyebrow);
            text-transform: uppercase; color: var(--to-green); }
  .footer::before, .footer::after { content: ""; flex: 1; height: 1px; background: var(--to-peach); }
  .logo { left: var(--to-margin); top: var(--to-margin); width: var(--to-logo-width); }
</style>
</head>
<body data-width="1080" data-height="1080">
  <div class="background" data-layer="background"></div>
  <img class="logo" data-layer="logo" src="../../brand/logo/timeoptic.svg" alt="">
  <svg class="leaf-shadow" data-layer="leaf-shadow" viewBox="0 0 760 760" xmlns="http://www.w3.org/2000/svg">
    <g style="fill: var(--to-hairline);">
      <path d="M760 40 C560 120 380 260 200 470 C380 330 560 230 760 170 Z"/>
      <path d="M760 200 C590 250 430 360 290 560 C450 420 600 340 760 310 Z"/>
      <path d="M700 0 C600 140 520 300 470 520 C560 330 640 190 760 90 Z"/>
      <path d="M560 0 C500 120 430 230 330 330 C450 250 530 150 620 40 Z"/>
      <path d="M760 360 C640 400 540 480 460 620 C560 520 660 470 760 450 Z"/>
    </g>
  </svg>
  <div class="kicker" data-layer="kicker">ICONIC STYLE.<br>TIMELESS VISION.</div>
  <div class="brand" data-layer="brand">BRAND</div>
  <div class="tagline" data-layer="tagline">MODEL 0000</div>
  <div class="shadow" data-layer="shadow"></div>
  <img class="product" data-layer="product" src="../_preview/front.png" alt="">
  <div class="features" data-layer="features">
    <div>
      <svg viewBox="0 0 48 48"><circle cx="13" cy="26" r="9"/><circle cx="35" cy="26" r="9"/><path d="M22 25 Q24 22 26 25"/><path d="M4 24 L2 18"/><path d="M44 24 L46 18"/></svg>
      <h3>FRAME</h3><p>Material / shape<br>Size</p>
    </div>
    <div>
      <svg viewBox="0 0 48 48"><ellipse cx="24" cy="24" rx="15" ry="18"/><path d="M15 16 Q19 10 26 9"/></svg>
      <h3>LENS</h3><p>Lens name<br>Key feature</p>
    </div>
    <div>
      <svg viewBox="0 0 48 48"><path d="M24 5 L39 11 V23 C39 33 32 40 24 43 C16 40 9 33 9 23 V11 Z"/><path d="M17 24 L22 29 L31 19"/></svg>
      <h3>COATING</h3><p>Coating name<br>Key feature</p>
    </div>
    <div>
      <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="7"/><path d="M24 5 V10 M24 38 V43 M5 24 H10 M38 24 H43 M10.5 10.5 L14 14 M34 34 L37.5 37.5 M10.5 37.5 L14 34 M34 14 L37.5 10.5"/></svg>
      <h3>CLEAR VIEW</h3><p>What this set<br>does best</p>
    </div>
  </div>
  <div class="footer" data-layer="footer">MESSAGE US</div>
</body>
</html>
