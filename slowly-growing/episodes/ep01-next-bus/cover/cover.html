<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sriracha&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root { --paper: 239, 232, 218; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: rgb(var(--paper)); position: relative; }
  body > div { position: absolute; inset: 0; }
  .art img { position: absolute; left: 50%; top: 40px; height: 1920px; transform: translateX(-50%) scale(1.1); transform-origin: 60% 45%; }
  .wash { background: linear-gradient(rgba(var(--paper),.97) 0, rgba(var(--paper),.93) 560px, rgba(var(--paper),0) 900px); }
  .vig { box-shadow: inset 0 0 240px rgba(70,55,40,.38); }
  .text { text-align: center; color: #3a332c; text-shadow: 0 0 20px rgb(var(--paper)), 0 0 6px rgb(var(--paper)); }
  .ep { position: absolute; top: 300px; left: 0; right: 0; font-family: 'Cormorant Garamond', serif; font-style: italic;
        font-size: 40px; letter-spacing: 10px; color: #8a7560; }
  h1 { position: absolute; top: 360px; left: 0; right: 0; font-family: 'Sriracha', cursive; font-weight: 400;
       font-size: 128px; line-height: 1.25; }
  .hook { position: absolute; top: 560px; left: 0; right: 0; font-family: 'Sriracha', cursive; font-size: 52px; color: #6b5440; }
</style>
</head>
<body data-width="1080" data-height="1920">
  <div data-layer="art" class="art"><img src="../img/scene.png" alt=""></div>
  <div data-layer="wash" class="wash"></div>
  <div data-layer="vignette" class="vig"></div>
  <div data-layer="text" class="text">
    <p class="ep">SLOWLY GROWING · EP.01</p>
    <h1>รถเมล์คันถัดไป</h1>
    <p class="hook">ถ้ารู้สึกว่าช้ากว่าคนอื่น…ดูคลิปนี้</p>
  </div>
</body>
</html>
