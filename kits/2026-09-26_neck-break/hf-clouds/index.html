<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!--
      Neck-break, ocean version: no person, almost no text; you close your eyes and follow the voice over sunset waves.
        0-2.5    "Let's take a break" / "15 seconds · close your eyes and listen"
        2.5-17.5 only the waves and a thin progress line (the voice leads the moves, same cues as hf15)
        17.5-20.5 soft veil, white wordmark, "Let Time Optic take care of your eyes"
      Video: assets/ocean.mp4 (the user's 10 s clip looped with cross-fades, ocean/ocean_long.mp4). Audio is mixed after render.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/tokens.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1c1a24; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--to-font-display); color: #fff; }
      .layer { position: absolute; }
      #sea { left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #shade { inset: 0; background: linear-gradient(to bottom, rgba(20, 16, 28, .25), rgba(20, 16, 28, 0) 35%, rgba(20, 16, 28, 0) 65%, rgba(20, 16, 28, .3)); }
      .t { position: absolute; left: 120px; right: 120px; text-align: center; text-shadow: 0 2px 24px rgba(20, 16, 28, .45); }
      #title { top: 760px; font-weight: 300; font-size: 104px; line-height: 1.05; letter-spacing: -.02em; }
      #title b { font-weight: 800; }
      #sub { top: 1010px; font-family: var(--to-font-body); font-weight: 500; font-size: 36px; letter-spacing: .06em; opacity: .9; }
      #line { left: 240px; top: 1440px; width: 600px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .25); overflow: hidden; }
      #line i { position: absolute; inset: 0; background: rgba(255, 255, 255, .85); transform-origin: 0 50%; transform: scaleX(0); }
      #veil { inset: 0; background: rgba(20, 16, 28, .45); opacity: 0; }
      #logo { left: 228px; top: 860px; width: 624px; opacity: 0; }
      #endline { top: 1010px; font-weight: 500; font-size: 52px; line-height: 1.3; }
      #endline b { font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.5" data-width="1080" data-height="1920">
      <video id="sea" class="clip layer" data-start="0" data-duration="20.5" data-track-index="0" src="assets/bg.mp4" muted playsinline></video>
      <div id="shade" class="clip layer" data-start="0" data-duration="20.5" data-track-index="1"></div>
      <div id="intro" class="clip layer" data-start="0" data-duration="3.2" data-track-index="2" style="inset:0">
        <div id="ishade" style="position:absolute; inset:0; background: radial-gradient(ellipse 70% 22% at 50% 47%, rgba(20,16,28,.5), rgba(20,16,28,0))"></div>
        <div id="title" class="t">Let's take<br><b>a break</b></div>
        <div id="sub" class="t">15 seconds · close your eyes and listen</div>
      </div>
      <div id="line" class="clip layer" data-start="2.5" data-duration="15.3" data-track-index="3"><i></i></div>
      <div id="veil" class="clip layer" data-start="17" data-duration="3.5" data-track-index="4"></div>
      <img id="logo" class="clip layer" data-start="17" data-duration="3.5" data-track-index="5" src="assets/timeoptic-white-spaced.svg" alt="TIMEOPTIC" />
      <div id="end" class="clip layer" data-start="17" data-duration="3.5" data-track-index="6" style="inset:0">
        <div id="endline" class="t">Let <b>Time Optic</b> take<br>care of your eyes</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const INTRO = 2.5, BODY = 15;
      tl.fromTo('#title', { opacity: 0.4, y: 20, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.8, ease: 'power2.out' }, 0);
      tl.fromTo('#sub', { opacity: 0, y: 16 }, { opacity: 0.9, y: 0, duration: 0.7, ease: 'power2.out' }, 0.6);
      tl.to('#ishade', { opacity: 0, duration: 0.9 }, INTRO - 0.2);
      tl.to('#intro .t', { opacity: 0, y: -16, filter: 'blur(6px)', duration: 0.8, ease: 'power2.in', stagger: 0.1 }, INTRO - 0.2);
      tl.fromTo('#line', { opacity: 0 }, { opacity: 1, duration: 0.6 }, INTRO);
      tl.fromTo('#line i', { scaleX: 0 }, { scaleX: 1, duration: BODY, ease: 'none' }, INTRO);
      tl.to('#line', { opacity: 0, duration: 0.5 }, INTRO + BODY - 0.3);
      tl.to('#veil', { opacity: 1, duration: 0.8 }, INTRO + BODY - 0.4);
      tl.fromTo('#logo', { opacity: 0, y: 20, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: 'power2.out' }, INTRO + BODY - 0.2);
      tl.fromTo('#endline', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' }, INTRO + BODY + 0.1);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
