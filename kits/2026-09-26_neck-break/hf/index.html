<!doctype html>
<html lang="th" data-lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!--
      TIMEOPTIC 20-second eye break: follow-along neck stretch. Same file for both languages:
      data-lang="th" | "en" on <html> picks the text (build-en copies this folder and flips it).
        0-2 s     intro "Let's take a break": green panel, pause icon, lines slam in, panel wipes up
        (everything below is +2 s in the final clip: the body timeline is added to main at INTRO)
        0-2.5 s   "Close your eyes", the character closes its eyes; a tick every second from 1 s to 20 s
        2.5-20 s  seven moves, 2.5 s each: up, right, left, neck back, chin to right shoulder, chin to left shoulder, open eyes
        20-22.5   "Let TIMEOPTIC take care of your eyes", wordmark
      All type and logos inside the TikTok safe zone (x 60-940, y 220-1480).
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500&family=Noto+Sans+Thai:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/tokens.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #e9efe9; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--to-font-display); color: var(--to-green); }
      html[data-lang="th"] #root { font-family: 'Noto Sans Thai', var(--to-font-display); }
      .layer { position: absolute; }
      #bg { inset: 0; background: radial-gradient(ellipse 75% 50% at 50% 42%, #f7faf6 0%, #e2ece5 58%, #cddcd2 100%); }
      #glow { left: 190px; top: 510px; width: 700px; height: 700px; border-radius: 50%;
              background: radial-gradient(circle, rgba(65, 153, 110, .16) 0%, rgba(65, 153, 110, .06) 45%, rgba(65, 153, 110, 0) 70%); }
      #dim { inset: 0; background: radial-gradient(ellipse 80% 55% at 50% 45%, #1f3340 0%, #0d1820 75%); }
      #intro { inset: 0; }
      #intro .hook { position: absolute; left: 80px; right: 80px; top: 330px; text-align: center; font-weight: 800;
                     font-size: 86px; line-height: 1.08; letter-spacing: -.02em; }
      html[data-lang="th"] #intro .hook { font-size: 90px; line-height: 1.25; letter-spacing: 0; }
      #hook1 { color: var(--to-snow); }
      #hook2 { color: var(--to-green); opacity: 0; }
      #intro .hook em { font-style: normal; color: #d98a3a; }
      #hook1 em { color: #ff6b5e; }
      #hook1 .warn { display: inline-block; color: #ff3b30; font-size: 1.22em; letter-spacing: .02em; }
      #hook1 { top: 300px; }
      #screenglow { position: absolute; left: 240px; top: 780px; width: 600px; height: 600px; border-radius: 50%;
                    background: radial-gradient(circle, rgba(120, 190, 255, .38) 0%, rgba(120, 190, 255, .12) 45%, rgba(120, 190, 255, 0) 70%); }
      #phone { position: absolute; left: 380px; top: 1230px; width: 320px; height: 560px; border-radius: 46px; background: #15191d;
               border: 10px solid #2a3037; box-shadow: 0 0 120px rgba(120, 190, 255, .35); }
      #phone .scr { position: absolute; inset: 10px; border-radius: 34px; background: linear-gradient(170deg, #2c5b8a, #16324f); overflow: hidden; }
      #phone .lbl { position: absolute; left: 0; right: 0; top: 70px; text-align: center; color: #cfe3ff; font-family: var(--to-font-display);
                    font-weight: 700; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; }
      #phone .hrs { position: absolute; left: 0; right: 0; top: 108px; text-align: center; color: #ff6b5e; font-family: var(--to-font-display);
                    font-weight: 800; font-size: 92px; letter-spacing: -.02em; }
      #bigpause { position: absolute; left: 390px; top: 648px; width: 300px; height: 300px; border-radius: 50%; background: var(--to-green); opacity: 0;
                   box-shadow: 0 16px 60px rgba(0, 0, 0, .25); }
      #bigpause i { position: absolute; top: 80px; width: 44px; height: 140px; border-radius: 10px; background: var(--to-peach); box-shadow: 0 10px 40px rgba(0, 0, 0, .18); }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      .t { position: absolute; left: 140px; right: 140px; text-align: center; }
      #kicker { top: 326px; font-weight: 700; font-size: 34px; letter-spacing: .22em; text-transform: uppercase; }
      html[data-lang="th"] #kicker { letter-spacing: .04em; font-size: 42px; top: 316px; }
      #count { left: 480px; top: 390px; width: 120px; height: 120px; }
      #count .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                    font-family: var(--to-font-display); font-weight: 800; font-size: 54px; }
      #char { left: 170px; top: 500px; width: 740px; height: 740px; }
      .say { top: 1262px; font-weight: 800; font-size: 84px; line-height: 1.08; letter-spacing: -.01em; opacity: 0; }
      html[data-lang="th"] .say { font-size: 80px; line-height: 1.22; letter-spacing: 0; }
      .say.start { color: #2f7d57; font-size: 92px; }
      #bar { left: 160px; top: 1492px; width: 760px; height: 12px; display: flex; gap: 10px; }
      #bar i { flex: 1; border-radius: 6px; background: rgba(18, 58, 41, .14); overflow: hidden; position: relative; }
      #bar i b { position: absolute; inset: 0; background: var(--to-green); transform-origin: 0 50%; transform: scaleX(0); }
      .arw { width: 150px; height: 60px; opacity: 0; }
      .arw svg { position: absolute; top: 0; width: 60px; height: 60px; }
      #end { inset: 0; }
      #endline b { font-weight: 800; }
      #endline { top: 1100px; font-weight: 700; font-size: 58px; line-height: 1.25; }
      #logo { left: 384px; top: 940px; width: 312px; height: 48px; transform-origin: 50% 50%; opacity: 0; }
      #logo b { position: absolute; top: 0; height: 48px; background: url(assets/timeoptic.svg) no-repeat; background-size: 300px 47.6px; }
      #logo .shine { position: absolute; left: 0; top: 0; bottom: 0; width: 136px; -webkit-mask: url(assets/timeoptic-mono.svg) center / 100% no-repeat; mask: url(assets/timeoptic-mono.svg) center / 100% no-repeat; overflow: hidden; }
      #logo .shine i { position: absolute; top: 0; bottom: 0; left: 0; width: 80px; transform: translateX(-90px); background: linear-gradient(100deg, transparent, rgba(239, 207, 156, .95), transparent); }
      #endline .bt, .brand .bt { color: #123A29; font-weight: 800; }  /* same two colours as the logo: TIME green, OPTIC black */
      #endline .bo, .brand .bo { color: #212121; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="28.5" data-width="1080" data-height="1920">
      <div id="bg" class="clip layer" data-start="0" data-duration="28.5" data-track-index="0"></div>
      <div id="glow" class="clip layer" data-start="0" data-duration="28.5" data-track-index="1"></div>

      <div id="dim" class="clip layer" data-start="0" data-duration="5.5" data-track-index="8"></div>
      <div id="char" class="clip layer" data-start="0" data-duration="28.5" data-track-index="2"><svg viewBox="0 0 800 800" width="740" height="740" style="display:block"><g id="slump"><g id="slouch">
        <defs><clipPath id="faceclip"><ellipse cx="400" cy="320" rx="162" ry="182" /></clipPath></defs>
        <path d="M110 800 C120 665 230 612 330 602 L470 602 C570 612 680 665 690 800 Z" fill="#123A29" />
        <path d="M350 602 L400 660 L450 602 Z" fill="#e8bfa3" />
        <rect x="352" y="440" width="96" height="175" rx="36" fill="#e8bfa3" />
        <g id="head">
          <ellipse cx="400" cy="300" rx="170" ry="186" fill="#2b2420" />
          <ellipse id="earL" cx="240" cy="335" rx="24" ry="40" fill="#efc7ad" />
          <ellipse id="earR" cx="560" cy="335" rx="24" ry="40" fill="#efc7ad" />
          <ellipse cx="400" cy="322" rx="150" ry="178" fill="#f3d2bb" />
          <g clip-path="url(#faceclip)">
            <g id="feat">
              <circle cx="312" cy="378" r="24" fill="#f0b3a0" opacity=".55" />
              <circle cx="488" cy="378" r="24" fill="#f0b3a0" opacity=".55" />
              <path d="M298 248 q37 -20 74 0 M428 248 q37 -20 74 0" stroke="#2b2420" stroke-width="10" stroke-linecap="round" fill="none" />
              <g id="eyesOpen">
                <circle cx="335" cy="302" r="14" fill="#2b2420" /><circle cx="465" cy="302" r="14" fill="#2b2420" />
                <circle cx="340" cy="297" r="4.5" fill="#fff" /><circle cx="470" cy="297" r="4.5" fill="#fff" />
              </g>
              <g id="eyesDizzy" opacity="0" stroke="#2b2420" stroke-width="5" fill="none" stroke-linecap="round">
                <path d="M335 302 m0 -3 a3 3 0 1 1 -3 3 a7 7 0 1 1 7 7 a11 11 0 1 1 -11 -11 a15 15 0 1 1 15 15" />
                <path d="M465 302 m0 -3 a3 3 0 1 1 -3 3 a7 7 0 1 1 7 7 a11 11 0 1 1 -11 -11 a15 15 0 1 1 15 15" />
              </g>
              <path id="eyesClosed" d="M314 302 q21 15 42 0 M444 302 q21 15 42 0" stroke="#2b2420" stroke-width="7" stroke-linecap="round" fill="none" opacity="0" />
              <path d="M400 318 q-12 32 0 44 q9 3 15 -3" stroke="#d6a286" stroke-width="6" stroke-linecap="round" fill="none" />
              <path id="mouth" d="M368 408 q32 22 64 0" stroke="#b5675a" stroke-width="8" stroke-linecap="round" fill="none" />
              <g stroke="#123A29" stroke-width="9" fill="rgba(207,227,215,.3)">
                <circle cx="335" cy="302" r="52" /><circle cx="465" cy="302" r="52" />
              </g>
              <path d="M387 298 q13 -11 26 0 M283 292 L240 285 M517 292 L560 285" stroke="#123A29" stroke-width="9" stroke-linecap="round" fill="none" />
            </g>
          </g>
          <path id="hairTop" d="M232 305 C222 150 330 106 400 108 C478 106 580 150 568 305 C548 222 474 188 400 198 C326 188 252 222 232 305 Z" fill="#2b2420" />
        </g>
      </g></g></svg></div>

      <div id="arrow" class="clip layer arw" data-start="0" data-duration="28.5" data-track-index="3"></div>
      <div id="arrow2" class="clip layer arw" data-start="0" data-duration="28.5" data-track-index="9"></div>

      <div id="ui" class="clip layer" data-start="0" data-duration="28.5" data-track-index="4" style="inset:0">
        <div id="kicker" class="t"></div>
        <div id="count" class="layer">
          <svg viewBox="0 0 120 120" width="120" height="120">
            <circle cx="60" cy="60" r="54" fill="rgba(255,255,255,.55)" stroke="rgba(18,58,41,.14)" stroke-width="6" />
            <circle id="countArc" cx="60" cy="60" r="54" fill="none" stroke="#123A29" stroke-width="6" stroke-linecap="round"
                    stroke-dasharray="339.3" stroke-dashoffset="339.3" transform="rotate(-90 60 60)" />
          </svg>
          <div class="num"></div>
        </div>
        <div id="says"></div>
        <div id="bar" class="layer"></div>
      </div>

      <div id="end" class="clip layer" data-start="25.4" data-duration="3.1" data-track-index="5">
        <div id="endline" class="t"></div>
      </div>
      <div id="logo" class="clip layer" data-start="0" data-duration="28.5" data-track-index="6" aria-label="TIMEOPTIC"><div class="shine"><i></i></div></div>
      <div id="intro" class="clip layer" data-start="0" data-duration="5.5" data-track-index="7">
        <div id="screenglow"></div>
        <div id="phone"><div class="scr"><div class="lbl">screen time</div><div class="hrs">0h</div></div></div>
        <div id="bigpause"><i style="left:94px"></i><i style="left:162px"></i></div>
        <div class="hook" id="hook1"></div>
        <div class="hook" id="hook2"></div>
        <div id="flash"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const INTRO = 5.5, SNAP = 3.6;
      const main = gsap.timeline({ paused: true });
      const tl = gsap.timeline();
      const LANG = document.documentElement.dataset.lang || 'th';
      const TEXT = {
        th: { hook1: '<b class="warn">ระวัง!!!</b><br>เล่นมือถือเกิน <em>20 นาที</em><br>ต้องรีบทำสิ่งนี้', hook2: 'ทำตามเลย<br><em>20 วิ</em>', kicker: 'พักสายตา 20 วินาที', start: 'หลับตา', end: 'ให้ <b class="bt">Time</b> <b class="bo">Optic</b><br>ดูแลสายตาของคุณ',
              moves: ['เงยหน้าขึ้น', 'หันไปทางขวา', 'หันไปทางซ้าย', 'เงยหน้าขึ้น<br>ยืดคอไปข้างหลัง', 'หันไปทางขวา<br>ให้คางชิดไหล่', 'หันไปทางซ้าย<br>ให้คางชิดไหล่', 'ลืมตา'] },
        en: { hook1: '<b class="warn">WARNING!!!</b><br>On your phone<br><em>20+ minutes?</em><br>Do this now', hook2: '<em>20 seconds.</em><br>Follow me.', kicker: '20-second eye break', start: 'Close your eyes', end: 'Let <b class="bt">Time</b> <b class="bo">Optic</b> take<br>care of your eyes',
              moves: ['Look up', 'Turn right', 'Turn left', 'Look up and<br>stretch your neck', 'Turn right,<br>chin to shoulder', 'Turn left,<br>chin to shoulder', 'Open your eyes'] },
      }[LANG];

      document.getElementById('kicker').textContent = TEXT.kicker;
      document.getElementById('endline').innerHTML = TEXT.end;
      const says = document.getElementById('says');
      [TEXT.start, ...TEXT.moves].forEach((s, i) => {
        const d = document.createElement('div');
        d.className = 't say' + (i === 0 ? ' start' : '');
        d.innerHTML = s;
        says.append(d);
      });
      const sayEls = says.querySelectorAll('.say');
      const bar = document.getElementById('bar');
      for (let i = 0; i < 7; i++) bar.append(Object.assign(document.createElement('i'), { innerHTML: '<b></b>' }));
      for (const arrow of document.querySelectorAll('.arw')) for (let i = 0; i < 3; i++) arrow.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 60 60" style="left:${i * 45}px"><path d="M18 10 L40 30 L18 50" fill="none" stroke="#41996E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
      const LETTERS = [[0, 282], [310, 392], [438, 834], [876, 1134], [1170, 1498], [1540, 1784], [1808, 2078], [2112, 2164], [2214, 2520]];
      const logo = document.getElementById('logo'), k = 300 / 2520;
      const LOGO_GAP = 12;  // space between TIME and OPTIC
      LETTERS.forEach(([x0, x1], n) => {
        const el = document.createElement('b');
        el.style.cssText = `left:${x0 * k + (n >= 4 ? LOGO_GAP : 0)}px;width:${(x1 - x0) * k + 1}px;background-position:${-x0 * k}px 0;`;
        logo.insertBefore(el, logo.firstChild);
      });

      const CLOSE = 2.5, STEP = 2.5, BODY = 20;
      // countdown 20 -> 0, one step per tick (ticks at 1..20 s)
      const num = document.querySelector('#count .num');
      const counter = { v: BODY };
      tl.to(counter, { v: 0, duration: BODY, ease: `steps(${BODY})`, onUpdate: () => { num.textContent = Math.round(counter.v); } }, 0);
      num.textContent = String(BODY);
      tl.fromTo('#countArc', { attr: { 'stroke-dashoffset': 339.3 } }, { attr: { 'stroke-dashoffset': 0 }, duration: BODY - 1, ease: 'none' }, 1);
      for (let s = 1; s <= BODY; s++) tl.fromTo('#count', { scale: 1.12 }, { scale: 1, duration: 0.3, ease: 'power2.out', immediateRender: false }, s);
      for (let c = 0; c < 4; c++) tl.fromTo('#glow', { scale: 0.9 }, { keyframes: { scale: [0.9, 1.08, 0.9] }, duration: BODY / 4, ease: 'sine.inOut', immediateRender: false }, c * BODY / 4);

      // 0-1: in, "Start!", eyes close
      tl.fromTo('#char', { scale: 1.06 }, { scale: 1, transformOrigin: '50% 60%', duration: 0.4, ease: 'power2.out' }, 0);
      tl.fromTo(sayEls[0], { opacity: 0, scale: 1.4, filter: 'blur(10px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.25, ease: 'back.out(2)' }, 0.1);
      tl.to(sayEls[0], { opacity: 0, y: -20, duration: 0.25 }, CLOSE - 0.3);
      tl.to('#eyesOpen', { opacity: 0, duration: 0.15 }, 0.55);
      tl.to('#eyesClosed', { opacity: 1, duration: 0.15 }, 0.55);

      // head poses; x/y in svg units, feat = face features, turn hides one ear
      const O = { svgOrigin: '400 560' };
      const NEUTRAL = { head: { x: 0, y: 0, rotation: 0 }, feat: { x: 0, y: 0, scaleY: 1 }, hair: { x: 0, y: 0, scaleY: 1 }, earL: { x: 0, opacity: 1 }, earR: { x: 0, opacity: 1 } };
      const POSES = [
        { head: { y: -14 }, feat: { y: -48, scaleY: 0.93 }, hair: { y: -36, scaleY: 0.84 }, arrows: [[255, 700, -90], [835, 700, -90]] },
        { head: { x: 10 }, feat: { x: 56 }, hair: { x: 22 }, earL: { x: 36 }, earR: { x: -24, opacity: 0 }, arrows: [[810, 807, 0]] },
        { head: { x: -10 }, feat: { x: -56 }, hair: { x: -22 }, earL: { x: 24, opacity: 0 }, earR: { x: -36 }, arrows: [[270, 807, 180]] },
        { head: { y: -26 }, feat: { y: -78, scaleY: 0.86 }, hair: { y: -62, scaleY: 0.74 }, arrows: [[255, 700, -90], [835, 700, -90]] },
        { head: { x: 28, y: 30, rotation: 8 }, feat: { x: 62, y: 34 }, hair: { x: 26, y: 10 }, earL: { x: 36 }, earR: { x: -24, opacity: 0 }, arrows: [[800, 1030, 35]] },
        { head: { x: -28, y: 30, rotation: -8 }, feat: { x: -62, y: 34 }, hair: { x: -26, y: 10 }, earL: { x: 24, opacity: 0 }, earR: { x: -36 }, arrows: [[280, 1030, 145]] },
      ];
      const pose = (p, at, dur) => {
        tl.to('#head', { ...NEUTRAL.head, ...p.head, ...O, duration: dur, ease: 'power2.inOut' }, at);
        tl.to('#feat', { ...NEUTRAL.feat, ...p.feat, transformOrigin: '50% 50%', duration: dur, ease: 'power2.inOut' }, at);
        tl.to('#hairTop', { ...NEUTRAL.hair, ...p.hair, transformOrigin: '50% 100%', duration: dur, ease: 'power2.inOut' }, at);
        tl.to('#earL', { ...NEUTRAL.earL, ...p.earL, duration: dur, ease: 'power2.inOut' }, at);
        tl.to('#earR', { ...NEUTRAL.earR, ...p.earR, duration: dur, ease: 'power2.inOut' }, at);
      };

      const barFill = bar.querySelectorAll('b');
      for (let i = 0; i < 7; i++) {
        const t = CLOSE + i * STEP;
        const el = sayEls[i + 1];
        tl.fromTo(el, { opacity: 0, y: 30, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.3, ease: 'power3.out' }, t);
        tl.to(el, { opacity: 0, y: -24, filter: 'blur(6px)', duration: 0.25, ease: 'power2.in' }, t + STEP - 0.27);
        tl.fromTo(barFill[i], { scaleX: 0 }, { scaleX: 1, duration: STEP, ease: 'none', immediateRender: false }, t);
        if (i < 6) {
          const p = POSES[i];
          pose(p, t + 0.05, 0.9);
          pose({}, t + STEP - 0.7, 0.6);
          ['#arrow', '#arrow2'].forEach((sel, k) => {
            const a = p.arrows[k];
            if (!a) { tl.set(sel, { opacity: 0 }, t); return; }
            const [cx, cy, rot] = a;  // centre of the 150x60 chevron strip
            tl.set(sel, { left: cx - 75, top: cy - 30, rotation: rot, opacity: 1 }, t);
            tl.fromTo(`${sel} svg`, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.1, ease: 'power2.out', immediateRender: false }, t + 0.1);
            tl.to(`${sel} svg`, { opacity: 0, x: 20, duration: 0.3, stagger: 0.08 }, t + STEP - 0.9);
          });
        } else {
          // open eyes: pop open, smile
          tl.to('#eyesClosed', { opacity: 0, duration: 0.1 }, t + 0.2);
          tl.fromTo('#eyesOpen', { opacity: 0, scaleY: 0.1 }, { opacity: 1, scaleY: 1, transformOrigin: '50% 50%', duration: 0.35, ease: 'back.out(3)', immediateRender: false }, t + 0.2);
          tl.fromTo('#char', { scale: 1 }, { keyframes: { scale: [1, 1.05, 1] }, transformOrigin: '50% 60%', duration: 0.6, ease: 'power2.out', immediateRender: false }, t + 0.2);
          tl.to('#mouth', { attr: { d: 'M362 404 q38 34 76 0' }, duration: 0.3 }, t + 0.3);
        }
      }
      tl.set(['#arrow', '#arrow2'], { opacity: 0 }, CLOSE + 6 * STEP);

      // BODY to BODY+2.5: the wordmark and the closing line
      tl.to(['#char', '#ui', '#glow'], { opacity: 0, y: -30, filter: 'blur(8px)', duration: 0.45, ease: 'power2.in' }, BODY - 0.05);
      tl.set('#logo', { opacity: 1 }, BODY + 0.2);
      tl.fromTo('#logo', { scale: 2.2 }, { scale: 2.55, duration: 2.8, ease: 'none', immediateRender: false }, BODY + 0.2);
      tl.from('#logo b', { y: 30, opacity: 0, filter: 'blur(6px)', duration: 0.6, ease: 'power2.out', stagger: 0.06 }, BODY + 0.2);
      tl.fromTo('#logo .shine i', { x: -90 }, { x: 320, duration: 1.0, ease: 'power2.inOut', immediateRender: false }, BODY + 1.0);
      tl.from('#endline', { opacity: 0, y: 24, filter: 'blur(8px)', duration: 0.6, ease: 'power2.out' }, BODY + 0.4);

      // intro 0-INTRO s on main
      //   0-SNAP hook: dark room, slouched over a glowing phone, dizzy eyes, screen time counting up, phone buzz
      //   SNAP   snap: flash + big pause icon, sits up straight, phone drops away, the room lights up
      //   then   promise "Don't scroll. 20 seconds, with me.", then the counter UI comes in
      document.getElementById('hook1').innerHTML = TEXT.hook1;
      document.getElementById('hook2').innerHTML = TEXT.hook2;
      const hrs = document.querySelector('#phone .hrs'), screen = { h: 5 };
      main.to(screen, { h: 25, duration: SNAP - 0.4, ease: 'none', onUpdate: () => { hrs.textContent = Math.round(screen.h) + 'm'; } }, 0);
      hrs.textContent = '5m';
      // the screen goes red once it passes 20 minutes, the warning pulses
      main.to('#phone .scr', { background: 'linear-gradient(170deg, #8a2c2c, #4f1616)', duration: 0.2 }, (SNAP - 0.4) * 0.75);
      main.to('#phone .hrs', { color: '#ffffff', duration: 0.2 }, (SNAP - 0.4) * 0.75);
      for (let k = 0; k < 4; k++) main.fromTo('#hook1 .warn', { scale: 1.12 }, { scale: 1, duration: 0.35, ease: 'power2.out', immediateRender: k === 0 }, k * 0.8);
      main.set('#ui', { opacity: 0 }, 0);
      main.set('#eyesOpen', { opacity: 0 }, 0);
      main.set('#eyesDizzy', { opacity: 1 }, 0);
      main.set('#slump', { y: 190 }, 0);  // y lives on #slump, rotation on #slouch: mixing them with svgOrigin left the character 12 px off centre
      main.set('#feat', { y: 34 }, 0);
      main.set('#head', { y: 20, scale: 1.04, svgOrigin: '400 560' }, 0);
      main.to('#head', { y: 0, scale: 1, svgOrigin: '400 560', duration: 0.35, ease: 'back.out(2.5)' }, SNAP + 0.05);
      main.fromTo('#eyesDizzy path', { rotation: 0 }, { rotation: 720, transformOrigin: '50% 50%', duration: SNAP, ease: 'none' }, 0);
      main.fromTo('#hook1', { scale: 1.12, filter: 'blur(2px)' }, { scale: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power3.out' }, 0);
      main.fromTo('#phone', { x: 0 }, { keyframes: { x: [0, -9, 9, -7, 7, -4, 0, 0, -9, 9, -7, 7, -4, 0] }, duration: 0.6, ease: 'none', immediateRender: false }, 0);
      // sway via the transform attribute: GSAP's svgOrigin compensation left a stray 18 px translate on this group
      const slouchEl = document.getElementById('slouch'), sway = { r: -1.5 };
      const setSway = () => slouchEl.setAttribute('transform', `rotate(${sway.r} 400 800)`);
      main.fromTo(sway, { r: -1.5 }, { r: 1.5, duration: SNAP / 2, yoyo: true, repeat: 1, ease: 'sine.inOut', onUpdate: setSway }, 0);
      // snap
      main.fromTo('#flash', { opacity: 0.85 }, { opacity: 0, duration: 0.35, ease: 'power2.out', immediateRender: false }, SNAP);
      main.fromTo('#bigpause', { opacity: 1, scale: 3 }, { opacity: 1, scale: 1, duration: 0.2, ease: 'power4.out', immediateRender: false }, SNAP);
      main.fromTo('#intro', { x: 0 }, { keyframes: { x: [0, -16, 12, -6, 0] }, duration: 0.25, ease: 'none', immediateRender: false }, SNAP + 0.02);
      main.to('#hook1', { opacity: 0, duration: 0.1 }, SNAP);
      main.to(['#dim', '#screenglow'], { opacity: 0, duration: 0.35 }, SNAP);
      main.to('#phone', { y: 1000, rotation: 18, opacity: 0, duration: 0.5, ease: 'power3.in' }, SNAP + 0.02);
      main.to('#slump', { y: 0, duration: 0.35, ease: 'back.out(2.5)' }, SNAP + 0.05);
      main.to(sway, { r: 0, duration: 0.35, ease: 'back.out(2.5)', onUpdate: setSway }, SNAP + 0.05);
      main.to('#feat', { y: 0, duration: 0.3, ease: 'power2.out' }, SNAP + 0.05);
      main.set('#eyesDizzy', { opacity: 0 }, SNAP + 0.05);
      main.set('#eyesOpen', { opacity: 1 }, SNAP + 0.05);
      main.fromTo('#hook2', { opacity: 0, y: 30, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.3, ease: 'power3.out', immediateRender: false }, SNAP + 0.15);
      main.to('#bigpause', { scale: 0.5, opacity: 0, duration: 0.3, ease: 'power2.in' }, SNAP + 0.7);
      main.to('#hook2', { opacity: 0, y: -24, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, INTRO - 0.35);
      main.to('#ui', { opacity: 1, duration: 0.3 }, INTRO - 0.3);
      main.add(tl, INTRO);

      window.__timelines['main'] = main;
      main.seek(0);
    </script>
  </body>
