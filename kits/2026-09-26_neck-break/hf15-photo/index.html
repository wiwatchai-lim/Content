<!doctype html>
<html lang="en" data-lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!--
      TIMEOPTIC 20-second eye break: follow-along neck stretch. Same file for both languages:
      data-lang="th" | "en" on <html> picks the text (build-en copies this folder and flips it).
        0-2 s     intro "Let's take a break": green panel, pause icon, lines slam in, panel wipes up
        (everything below is +2 s in the final clip: the body timeline is added to main at INTRO)
        0-2.5 s   "Close your eyes", the character closes its eyes; a tick every second from 1 s to 20 s
        2.5-20 s  seven moves, 2.5 s each: up, right, left, neck back, chin to right shoulder, chin to left shoulder, open eyes
        20-22.5   "Let TIMEOPTIC take care of your eyes", wordmark
      All type and logos inside the TikTok safe zone (x 60-940, y 220-1480).
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500&family=Noto+Sans+Thai:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/tokens.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #e9efe9; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--to-font-display); color: var(--to-green); }
      html[data-lang="th"] #root { font-family: 'Noto Sans Thai', var(--to-font-display); }
      .layer { position: absolute; }
      #bg { inset: 0; background: linear-gradient(to bottom, #c2c3ba 0%, #b3b4ab 40%, #adaea5 100%); }  /* the Codex photos' studio grey, so the photo's top edge disappears */
      #glow { left: 190px; top: 510px; width: 700px; height: 700px; border-radius: 50%;
              background: radial-gradient(circle, rgba(65, 153, 110, .16) 0%, rgba(65, 153, 110, .06) 45%, rgba(65, 153, 110, 0) 70%); }
      #intro { inset: 0; background: radial-gradient(ellipse 80% 55% at 50% 45%, #1d5a40 0%, #123A29 70%); overflow: hidden; }
      #intro .pause { position: absolute; left: 470px; top: 560px; width: 140px; height: 160px; }
      #intro .pause i { position: absolute; top: 0; width: 50px; height: 160px; border-radius: 12px; background: var(--to-peach); }
      #intro .line { position: absolute; left: 140px; right: 140px; text-align: center; color: var(--to-snow); font-weight: 800;
                     font-size: 150px; line-height: 1; letter-spacing: -.03em; text-transform: uppercase; }
      html[data-lang="th"] #intro .line { font-size: 132px; line-height: 1.15; letter-spacing: 0; text-transform: none; }
      #intro .line.accent { color: var(--to-peach); }
      #intro .secs { position: absolute; left: 140px; right: 140px; top: 1290px; text-align: center; color: var(--to-peach);
                     font-family: var(--to-font-display); font-weight: 800; font-size: 80px; letter-spacing: .12em; text-transform: uppercase; }
      html[data-lang="th"] #intro .secs { font-family: 'Noto Sans Thai', var(--to-font-display); letter-spacing: .02em; font-size: 62px; }
      .t { position: absolute; left: 140px; right: 140px; text-align: center; }
      #kicker { top: 326px; font-weight: 700; font-size: 34px; letter-spacing: .22em; text-transform: uppercase; }
      html[data-lang="th"] #kicker { letter-spacing: .04em; font-size: 42px; top: 316px; }
      #count { left: 480px; top: 390px; width: 120px; height: 120px; }
      #count .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                    font-family: var(--to-font-display); font-weight: 800; font-size: 54px; }
      #char { left: 0; top: 330px; width: 1080px; height: 1620px; overflow: hidden;
              -webkit-mask: linear-gradient(to bottom, transparent 0, #000 140px, #000 100%); mask: linear-gradient(to bottom, transparent 0, #000 140px, #000 100%); }
      #char .ph { position: absolute; left: 0; top: 0; width: 1080px; height: 1620px; object-fit: cover; opacity: 0; }
      /* a soft light band behind the move text so it reads over the T-shirt */
      #says::before { content: ""; position: absolute; left: 0; right: 0; top: 1210px; height: 330px;
                      background: linear-gradient(to bottom, rgba(233, 239, 233, 0), rgba(233, 239, 233, .92) 30%, rgba(233, 239, 233, .92) 80%, rgba(233, 239, 233, 0)); }
      .say { top: 1262px; font-weight: 800; font-size: 84px; line-height: 1.08; letter-spacing: -.01em; opacity: 0; }
      html[data-lang="th"] .say { font-size: 80px; line-height: 1.22; letter-spacing: 0; }
      .say.start { color: #2f7d57; font-size: 92px; }
      #bar { left: 160px; top: 1492px; width: 760px; height: 12px; display: flex; gap: 10px; }
      #bar i { flex: 1; border-radius: 6px; background: rgba(18, 58, 41, .14); overflow: hidden; position: relative; }
      #bar i b { position: absolute; inset: 0; background: var(--to-green); transform-origin: 0 50%; transform: scaleX(0); }
      .arw { width: 150px; height: 60px; opacity: 0; display: none; }  /* the photos show the direction; arrows sat on her face */
      .arw svg { position: absolute; top: 0; width: 60px; height: 60px; }
      #end { inset: 0; }
      #endline b { font-weight: 800; }
      #endline { top: 1100px; font-weight: 700; font-size: 58px; line-height: 1.25; }
      #logo { left: 384px; top: 940px; width: 312px; height: 48px; transform-origin: 50% 50%; opacity: 0; }
      #logo b { position: absolute; top: 0; height: 48px; background: url(assets/timeoptic.svg) no-repeat; background-size: 300px 47.6px; }
      #logo .shine { position: absolute; left: 0; top: 0; bottom: 0; width: 136px; -webkit-mask: url(assets/timeoptic-mono.svg) center / 100% no-repeat; mask: url(assets/timeoptic-mono.svg) center / 100% no-repeat; overflow: hidden; }
      #logo .shine i { position: absolute; top: 0; bottom: 0; left: 0; width: 80px; transform: translateX(-90px); background: linear-gradient(100deg, transparent, rgba(239, 207, 156, .95), transparent); }
      #endline { color: var(--to-snow); text-shadow: 0 2px 14px rgba(18, 58, 41, .35); }  /* the sentence in Snow, only the name in logo colours (user, 2026-09-26) */
      #endline .bt, .brand .bt { color: #123A29; font-weight: 800; }  /* same two colours as the logo: TIME green, OPTIC black */
      #endline .bo, .brand .bo { color: #212121; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.5" data-width="1080" data-height="1920">
      <div id="bg" class="clip layer" data-start="0" data-duration="20.5" data-track-index="0"></div>
      <div id="glow" class="clip layer" data-start="0" data-duration="20.5" data-track-index="1"></div>

      <div id="char" class="clip layer" data-start="0" data-duration="20.5" data-track-index="2"><img class="ph" id="ph-open" src="assets/staff/open.png" alt="" /><img class="ph" id="ph-closed" src="assets/staff/closed.png" alt="" /><img class="ph" id="ph-up" src="assets/staff/up.png" alt="" /><img class="ph" id="ph-right" src="assets/staff/right.png" alt="" /><img class="ph" id="ph-left" src="assets/staff/left.png" alt="" /><img class="ph" id="ph-back" src="assets/staff/back.png" alt="" /><img class="ph" id="ph-chinright" src="assets/staff/chinright.png" alt="" /><img class="ph" id="ph-chinleft" src="assets/staff/chinleft.png" alt="" /></div>
      <svg style="display:none"><g id="slump"><g id="slouch"><g id="head"><g id="earL" /><g id="earR" /><g id="feat"><g id="eyesOpen" /><g id="eyesDizzy" /><path id="eyesClosed" /><path id="mouth" d="M0 0" /></g><path id="hairTop" /></g></g></g></svg>

      <div id="arrow" class="clip layer arw" data-start="0" data-duration="20.5" data-track-index="3"></div>
      <div id="arrow2" class="clip layer arw" data-start="0" data-duration="20.5" data-track-index="9"></div>

      <div id="ui" class="clip layer" data-start="0" data-duration="20.5" data-track-index="4" style="inset:0">
        <div id="kicker" class="t"></div>
        <div id="count" class="layer">
          <svg viewBox="0 0 120 120" width="120" height="120">
            <circle cx="60" cy="60" r="54" fill="rgba(255,255,255,.55)" stroke="rgba(18,58,41,.14)" stroke-width="6" />
            <circle id="countArc" cx="60" cy="60" r="54" fill="none" stroke="#123A29" stroke-width="6" stroke-linecap="round"
                    stroke-dasharray="339.3" stroke-dashoffset="339.3" transform="rotate(-90 60 60)" />
          </svg>
          <div class="num"></div>
        </div>
        <div id="says"></div>
        <div id="bar" class="layer"></div>
      </div>

      <div id="end" class="clip layer" data-start="17.4" data-duration="3.1" data-track-index="5">
        <div id="endline" class="t"></div>
      </div>
      <div id="logo" class="clip layer" data-start="0" data-duration="20.5" data-track-index="6" aria-label="TIMEOPTIC"><div class="shine"><i></i></div></div>
      <div id="intro" class="clip layer" data-start="0" data-duration="2.8" data-track-index="7">
        <div class="pause"><i style="left:0"></i><i style="left:90px"></i></div>
        <div class="line" id="il0" style="top:800px"></div>
        <div class="line" id="il1" style="top:960px"></div>
        <div class="line accent" id="il2" style="top:1120px"></div>
        <div class="secs" id="isecs"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const INTRO = 2.5;
      const main = gsap.timeline({ paused: true });
      const tl = gsap.timeline();
      const LANG = document.documentElement.dataset.lang || 'th';
      const TEXT = {
        th: { intro: ['มาพัก', 'สายตา', 'กันเถอะ'], secs: '15 วินาที', kicker: 'พักสายตา 15 วินาที', start: 'หลับตา', end: 'ให้ <b class="bt">Time</b> <b class="bo">Optic</b><br>ดูแลสายตาของคุณ',
              moves: ['เงยหน้าขึ้น', 'หันไปทางขวา', 'หันไปทางซ้าย', 'เงยหน้าขึ้น<br>ยืดคอไปข้างหลัง', 'หันไปทางขวา<br>ให้คางชิดไหล่', 'หันไปทางซ้าย<br>ให้คางชิดไหล่', 'ลืมตา'] },
        en: { intro: ["Let's", 'take a', 'break'], secs: '15 seconds', kicker: '15-second eye break', start: 'Close your eyes', end: 'Let <b class="bt">Time</b> <b class="bo">Optic</b> take<br>care of your eyes',
              moves: ['Look up', 'Turn right', 'Turn left', 'Look up and<br>stretch your neck', 'Turn right,<br>chin to shoulder', 'Turn left,<br>chin to shoulder', 'Open your eyes'] },
      }[LANG];

      document.getElementById('kicker').textContent = TEXT.kicker;
      document.getElementById('endline').innerHTML = TEXT.end;
      const says = document.getElementById('says');
      [TEXT.start, ...TEXT.moves].forEach((s, i) => {
        const d = document.createElement('div');
        d.className = 't say' + (i === 0 ? ' start' : '');
        d.innerHTML = s;
        says.append(d);
      });
      const sayEls = says.querySelectorAll('.say');
      const bar = document.getElementById('bar');
      for (let i = 0; i < 7; i++) bar.append(Object.assign(document.createElement('i'), { innerHTML: '<b></b>' }));
      for (const arrow of document.querySelectorAll('.arw')) for (let i = 0; i < 3; i++) arrow.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 60 60" style="left:${i * 45}px"><path d="M18 10 L40 30 L18 50" fill="none" stroke="#41996E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
      const LETTERS = [[0, 282], [310, 392], [438, 834], [876, 1134], [1170, 1498], [1540, 1784], [1808, 2078], [2112, 2164], [2214, 2520]];
      const logo = document.getElementById('logo'), k = 300 / 2520;
      const LOGO_GAP = 12;  // space between TIME and OPTIC
      LETTERS.forEach(([x0, x1], n) => {
        const el = document.createElement('b');
        el.style.cssText = `left:${x0 * k + (n >= 4 ? LOGO_GAP : 0)}px;width:${(x1 - x0) * k + 1}px;background-position:${-x0 * k}px 0;`;
        logo.insertBefore(el, logo.firstChild);
      });

      const CLOSE = 1, STEP = 2, BODY = 15;
      // countdown 20 -> 0, one step per tick (ticks at 1..20 s)
      const num = document.querySelector('#count .num');
      const counter = { v: BODY };
      tl.to(counter, { v: 0, duration: BODY, ease: `steps(${BODY})`, onUpdate: () => { num.textContent = Math.round(counter.v); } }, 0);
      num.textContent = String(BODY);
      tl.fromTo('#countArc', { attr: { 'stroke-dashoffset': 339.3 } }, { attr: { 'stroke-dashoffset': 0 }, duration: BODY - 1, ease: 'none' }, 1);
      for (let s = 1; s <= BODY; s++) tl.fromTo('#count', { scale: 1.12 }, { scale: 1, duration: 0.3, ease: 'power2.out', immediateRender: false }, s);
      for (let c = 0; c < 4; c++) tl.fromTo('#glow', { scale: 0.9 }, { keyframes: { scale: [0.9, 1.08, 0.9] }, duration: BODY / 4, ease: 'sine.inOut', immediateRender: false }, c * BODY / 4);

      // 0-1: in, "Start!", eyes close
      tl.fromTo('#char', { scale: 1.06 }, { scale: 1, transformOrigin: '50% 60%', duration: 0.4, ease: 'power2.out' }, 0);
      tl.fromTo(sayEls[0], { opacity: 0, scale: 1.4, filter: 'blur(10px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.25, ease: 'back.out(2)' }, 0.1);
      tl.to(sayEls[0], { opacity: 0, y: -20, duration: 0.25 }, CLOSE - 0.3);
      tl.to('#eyesOpen', { opacity: 0, duration: 0.15 }, 0.55);
      tl.to('#eyesClosed', { opacity: 1, duration: 0.15 }, 0.55);

      // head poses; x/y in svg units, feat = face features, turn hides one ear
      const O = { svgOrigin: '400 560' };
      const NEUTRAL = { head: { x: 0, y: 0, rotation: 0 }, feat: { x: 0, y: 0, scaleY: 1 }, hair: { x: 0, y: 0, scaleY: 1 }, earL: { x: 0, opacity: 1 }, earR: { x: 0, opacity: 1 } };
      const POSES = [
        { head: { y: -14 }, feat: { y: -48, scaleY: 0.93 }, hair: { y: -36, scaleY: 0.84 }, arrows: [[255, 700, -90], [835, 700, -90]] },
        { head: { x: 10 }, feat: { x: 56 }, hair: { x: 22 }, earL: { x: 36 }, earR: { x: -24, opacity: 0 }, arrows: [[810, 807, 0]] },
        { head: { x: -10 }, feat: { x: -56 }, hair: { x: -22 }, earL: { x: 24, opacity: 0 }, earR: { x: -36 }, arrows: [[270, 807, 180]] },
        { head: { y: -26 }, feat: { y: -78, scaleY: 0.86 }, hair: { y: -62, scaleY: 0.74 }, arrows: [[255, 700, -90], [835, 700, -90]] },
        { head: { x: 28, y: 30, rotation: 8 }, feat: { x: 62, y: 34 }, hair: { x: 26, y: 10 }, earL: { x: 36 }, earR: { x: -24, opacity: 0 }, arrows: [[800, 1030, 35]] },
        { head: { x: -28, y: 30, rotation: -8 }, feat: { x: -62, y: 34 }, hair: { x: -26, y: 10 }, earL: { x: 24, opacity: 0 }, earR: { x: -36 }, arrows: [[280, 1030, 145]] },
      ];
      const pose = (p, at, dur) => {
        tl.to('#head', { ...NEUTRAL.head, ...p.head, ...O, duration: dur, ease: 'power2.inOut' }, at);
        tl.to('#feat', { ...NEUTRAL.feat, ...p.feat, transformOrigin: '50% 50%', duration: dur, ease: 'power2.inOut' }, at);
        tl.to('#hairTop', { ...NEUTRAL.hair, ...p.hair, transformOrigin: '50% 100%', duration: dur, ease: 'power2.inOut' }, at);
        tl.to('#earL', { ...NEUTRAL.earL, ...p.earL, duration: dur, ease: 'power2.inOut' }, at);
        tl.to('#earR', { ...NEUTRAL.earR, ...p.earR, duration: dur, ease: 'power2.inOut' }, at);
      };

      const barFill = bar.querySelectorAll('b');
      for (let i = 0; i < 7; i++) {
        const t = CLOSE + i * STEP;
        const el = sayEls[i + 1];
        tl.fromTo(el, { opacity: 0, y: 30, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.3, ease: 'power3.out' }, t);
        tl.to(el, { opacity: 0, y: -24, filter: 'blur(6px)', duration: 0.25, ease: 'power2.in' }, t + STEP - 0.27);
        tl.fromTo(barFill[i], { scaleX: 0 }, { scaleX: 1, duration: STEP, ease: 'none', immediateRender: false }, t);
        if (i < 6) {
          const p = POSES[i];
          pose(p, t + 0.05, 0.9);
          pose({}, t + STEP - 0.7, 0.6);
          ['#arrow', '#arrow2'].forEach((sel, k) => {
            const a = p.arrows[k];
            if (!a) { tl.set(sel, { opacity: 0 }, t); return; }
            const [cx, cy, rot] = a;  // centre of the 150x60 chevron strip
            tl.set(sel, { left: cx - 75, top: cy - 30, rotation: rot, opacity: 1 }, t);
            tl.fromTo(`${sel} svg`, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.1, ease: 'power2.out', immediateRender: false }, t + 0.1);
            tl.to(`${sel} svg`, { opacity: 0, x: 20, duration: 0.3, stagger: 0.08 }, t + STEP - 0.9);
          });
        } else {
          // open eyes: pop open, smile
          tl.to('#eyesClosed', { opacity: 0, duration: 0.1 }, t + 0.2);
          tl.fromTo('#eyesOpen', { opacity: 0, scaleY: 0.1 }, { opacity: 1, scaleY: 1, transformOrigin: '50% 50%', duration: 0.35, ease: 'back.out(3)', immediateRender: false }, t + 0.2);
          tl.fromTo('#char', { scale: 1 }, { keyframes: { scale: [1, 1.05, 1] }, transformOrigin: '50% 60%', duration: 0.6, ease: 'power2.out', immediateRender: false }, t + 0.2);
          tl.to('#mouth', { attr: { d: 'M362 404 q38 34 76 0' }, duration: 0.3 }, t + 0.3);
        }
      }
      tl.set(['#arrow', '#arrow2'], { opacity: 0 }, CLOSE + 6 * STEP);

      // BODY to BODY+2.5: the wordmark and the closing line
      tl.to(['#char', '#ui', '#glow'], { opacity: 0, y: -30, filter: 'blur(8px)', duration: 0.45, ease: 'power2.in' }, BODY - 0.05);
      tl.set('#logo', { opacity: 1 }, BODY + 0.2);
      tl.fromTo('#logo', { scale: 2.2 }, { scale: 2.55, duration: 2.8, ease: 'none', immediateRender: false }, BODY + 0.2);
      tl.from('#logo b', { y: 30, opacity: 0, filter: 'blur(6px)', duration: 0.6, ease: 'power2.out', stagger: 0.06 }, BODY + 0.2);
      tl.fromTo('#logo .shine i', { x: -90 }, { x: 320, duration: 1.0, ease: 'power2.inOut', immediateRender: false }, BODY + 1.0);
      tl.from('#endline', { opacity: 0, y: 24, filter: 'blur(8px)', duration: 0.6, ease: 'power2.out' }, BODY + 0.4);

      // intro 0-2.5 s on main: pause icon + three lines + "15 seconds" slam in on the voice, then the panel wipes up
      TEXT.intro.forEach((s, i) => { document.getElementById('il' + i).textContent = s; });
      document.getElementById('isecs').textContent = TEXT.secs;
      main.fromTo('#intro .pause i', { scaleY: 1.35 }, { scaleY: 1, duration: 0.25, ease: 'back.out(2.5)', stagger: 0.06 }, 0);
      main.fromTo('#intro .line', { opacity: 0.35, scale: 1.5, filter: 'blur(8px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power3.out', stagger: 0.28 }, 0);
      main.fromTo('#intro .secs', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: 'back.out(2)' }, 1.35);
      main.fromTo('#intro', { x: 0 }, { keyframes: { x: [0, -14, 10, -5, 0] }, duration: 0.25, ease: 'none', immediateRender: false }, 0.02);
      main.fromTo('#intro .line', { y: 0 }, { y: -18, duration: 0.14, yoyo: true, repeat: 1, ease: 'power2.out', stagger: 0.12, immediateRender: false }, 1.4);
      main.fromTo('#intro .pause', { rotation: 0 }, { rotation: 90, scale: 0.7, opacity: 0, duration: 0.3, ease: 'power2.in', immediateRender: false }, INTRO - 0.4);
      main.fromTo('#intro', { yPercent: 0 }, { yPercent: -100, duration: 0.4, ease: 'power3.inOut', immediateRender: false }, INTRO - 0.3);
      // photo stills: open -> closed at the start, then each move's still, back to closed before the next move, open at the end
      const show = (p, at, d = 0.25) => { tl.to('#char .ph', { opacity: 0, duration: d }, at); tl.to(`#ph-${p}`, { opacity: 1, duration: d }, at); };
      tl.set('#ph-open', { opacity: 1 }, 0);
      show('closed', 0.5);
      ['up', 'right', 'left', 'back', 'chinright', 'chinleft'].forEach((p, i) => {
        const t = CLOSE + i * STEP;
        show(p, t + 0.05, 0.35);
        tl.fromTo(`#ph-${p}`, { scale: 1.04 }, { scale: 1, duration: STEP - 0.4, ease: 'sine.out', immediateRender: false }, t + 0.05);
        show('closed', t + STEP - 0.45, 0.35);
      });
      show('open', CLOSE + 6 * STEP + 0.2, 0.3);
      main.add(tl, INTRO);

      window.__timelines['main'] = main;
      main.seek(0);
    </script>
  </body>
</html>
