<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!--
      Vana Nava Water Jungle, Hua Hin, 30 s. Same text style, voice timing and shop ending as huahin-marriott.
      v2 (user asked for "prettier"): every photo is a 2.5D depth-parallax shot (shots/, rendered with tools/video.mjs),
      one colour grade for all photos, soft 0.35 s dissolves, warm light leaks on the cuts.
      Small photos (s2, s6, s7, s8) play as a full-width band over a blurred copy so they are not blown up past their pixels.
        0-5       s1  slides + mountain, push in     "Welcome to Vana Nava, Hua Hin."
        5-7.6     s2  entrance sign (band)           "Where the mountains meet the water, and every day feels like summer."
        7.6-10.6  s3  whole park from above
        10.6-12.4 s4  bowl slide                     "Every slide. Every splash. Every smile."
        12.4-14.2 s5  kids' slides
        14.2-16.1 s6  slides + tower (band)
        16.1-19.9 s7  wave pool (band)               "These are the moments you'll want to remember."
        19.9-22.8 s8  lazy river (band)              "So see every one of them clearly."
        22.8-25.6 s9  slides, other side             "See more. Experience more."
        25.4      storefront (assets/shop.mp4), voice "Time Optic. Take care of your vision."; ending as huahin-marriott
      Voice: audio/fast (Gemini TTS, voice Sulafat), mixed after render by audio/mix.sh.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/tokens.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #111; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--to-font-display); color: #fff; }
      .layer { position: absolute; }
      .vid { left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .bandbg { left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .bandbg img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; will-change: transform; }
      .bandbg i { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255, 255, 255, .35); }
      .bandv { left: 0; width: 1080px; object-fit: cover; box-shadow: 0 30px 90px rgba(0, 0, 0, .5); }
      #shade { inset: 0; background: linear-gradient(to bottom, rgba(12, 14, 16, 0) 45%, rgba(12, 14, 16, .38) 62%, rgba(12, 14, 16, .38) 78%, rgba(12, 14, 16, 0) 92%); }
      #leak { inset: -10%; mix-blend-mode: screen; opacity: 0; pointer-events: none;
        background: radial-gradient(ellipse 45% 35% at 85% 12%, rgba(255, 196, 120, .75), rgba(255, 150, 80, 0) 70%),
                    radial-gradient(ellipse 35% 30% at 10% 30%, rgba(255, 230, 190, .45), rgba(255, 200, 150, 0) 70%); }
      #glow { inset: 0; pointer-events: none; background: radial-gradient(ellipse 85% 65% at 50% 40%, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, .28) 100%); }
      .t { position: absolute; left: 100px; right: 100px; top: 1160px; text-align: center; font-weight: 300; font-size: 68px; line-height: 1.12; letter-spacing: -.02em; text-shadow: 0 2px 26px rgba(10, 12, 14, .6); opacity: 0; }
      .t b { font-weight: 700; }
      #l1 { top: 1110px; }
      #l1 .big { display: block; margin: 6px 0 4px; font-size: 118px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
      #l1 .kick { font-family: var(--to-font-body); font-size: 34px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; }
      #endshade { inset: 0; background: linear-gradient(to bottom, rgba(8, 20, 15, 0) 52%, rgba(8, 20, 15, .55) 66%, rgba(8, 20, 15, .88) 80%, rgba(8, 20, 15, .95) 100%); opacity: 0; }
      #vign { inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 42%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .35) 100%); opacity: 0; }
      #end .brand { position: absolute; left: 0; right: 0; top: 1560px; display: flex; flex-direction: column; align-items: center; }
      #rule { width: 120px; height: 2px; margin-top: 0; background: var(--to-peach); }
      #tag { margin-top: 34px; font-family: var(--to-font-body); font-weight: 400; font-size: 44px; letter-spacing: .22em; text-transform: uppercase; color: rgba(250, 250, 250, .92); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <video id="v1" class="clip layer vid" data-start="0" data-duration="5" data-track-index="0" src="assets/s1.mp4" muted playsinline></video>
      <div id="g2" class="clip layer bandbg" data-start="4.65" data-duration="2.95" data-track-index="1"><img data-layout-allow-overflow id="b2" src="assets/s2-bg.jpg" alt="" /><i style="top:381px"></i><i style="top:1019px"></i></div>
      <video id="v2" class="clip layer bandv" style="top:396px;height:608px" data-start="4.65" data-duration="2.95" data-track-index="2" src="assets/s2.mp4" muted playsinline></video>
      <video id="v3" class="clip layer vid" data-start="7.25" data-duration="3.35" data-track-index="0" src="assets/s3.mp4" muted playsinline></video>
      <video id="v4" class="clip layer vid" data-start="10.25" data-duration="2.15" data-track-index="1" src="assets/s4.mp4" muted playsinline></video>
      <video id="v5" class="clip layer vid" data-start="12.05" data-duration="2.15" data-track-index="0" src="assets/s5.mp4" muted playsinline></video>
      <div id="g6" class="clip layer bandbg" data-start="13.85" data-duration="2.25" data-track-index="1"><img data-layout-allow-overflow id="b6" src="assets/s6-bg.jpg" alt="" /><i style="top:325px"></i><i style="top:1075px"></i></div>
      <video id="v6" class="clip layer bandv" style="top:340px;height:720px" data-start="13.85" data-duration="2.25" data-track-index="2" src="assets/s6.mp4" muted playsinline></video>
      <div id="g7" class="clip layer bandbg" data-start="15.75" data-duration="4.15" data-track-index="0"><img data-layout-allow-overflow id="b7" src="assets/s7-bg.jpg" alt="" /><i style="top:347px"></i><i style="top:1053px"></i></div>
      <video id="v7" class="clip layer bandv" style="top:362px;height:676px" data-start="15.75" data-duration="4.15" data-track-index="3" src="assets/s7.mp4" muted playsinline></video>
      <div id="g8" class="clip layer bandbg" data-start="19.55" data-duration="3.25" data-track-index="1"><img data-layout-allow-overflow id="b8" src="assets/s8-bg.jpg" alt="" /><i style="top:365px"></i><i style="top:1035px"></i></div>
      <video id="v8" class="clip layer bandv" style="top:380px;height:640px" data-start="19.55" data-duration="3.25" data-track-index="2" src="assets/s8.mp4" muted playsinline></video>
      <video id="v9" class="clip layer vid" data-start="22.45" data-duration="3.15" data-track-index="0" src="assets/s9.mp4" muted playsinline></video>
      <div id="leak" class="clip layer" data-start="0" data-duration="26" data-track-index="7"></div>
      <div id="glow" class="clip layer" data-start="0" data-duration="26" data-track-index="8"></div>
      <div id="shade" class="clip layer" data-start="0" data-duration="26.1" data-track-index="9"></div>
      <div id="lines" class="clip layer" data-start="0" data-duration="26.4" data-track-index="10" style="inset:0">
        <div id="l1" class="t">Welcome to<b class="big">Vana Nava</b><span class="kick">Hua Hin</span></div>
        <div id="l2" class="t">Where the mountains<br>meet the water, and<br><b>every day feels like summer.</b></div>
        <div id="l3" class="t">Every <b>slide.</b><br>Every <b>splash.</b><br>Every <b>smile.</b></div>
        <div id="l4" class="t">These are the moments<br><b>you'll want to remember.</b></div>
        <div id="l5" class="t">So see every one of them<br><b>clearly.</b></div>
        <div id="l6" class="t"><b>See more.</b><br>Experience more.</div>
      </div>
      <video id="shop" class="clip layer vid" data-start="25.4" data-duration="4.6" data-track-index="11" src="assets/shop.mp4" muted playsinline></video>
      <div id="endshade" class="clip layer" data-start="25.4" data-duration="4.6" data-track-index="12"></div>
      <div id="vign" class="clip layer" data-start="25.4" data-duration="4.6" data-track-index="14"></div>
      <div id="end" class="clip layer" data-start="26" data-duration="4" data-track-index="13" style="inset:0">
        <div class="brand">
          <div id="rule"></div>
          <div id="tag">Take care of your vision</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // [id, in, out] — each line enters with its voice line (audio/mix.sh delays)
      const LINES = [['#l1', 0.2, 4.8], ['#l2', 5.0, 10.4], ['#l3', 10.7, 15.9], ['#l4', 16.2, 19.9], ['#l5', 20.2, 24.2], ['#l6', 24.4, 26.4]];
      for (const [id, a, b] of LINES) {
        tl.fromTo(id, { opacity: 0, y: 24, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.8, ease: 'power2.out' }, a);
        tl.to(id, { opacity: 0, y: -14, filter: 'blur(6px)', duration: 0.5, ease: 'power2.in' }, b - 0.5);
      }
      tl.fromTo('#l1 .big', { scale: 1.1 }, { scale: 1, duration: 2.4, ease: 'power3.out' }, 0.2);
      // soft dissolves: each shot (and its band background) fades in over the one before
      const X = 0.35;
      for (const [ids, a] of [[['#g2', '#v2'], 4.65], [['#v3'], 7.25], [['#v4'], 10.25], [['#v5'], 12.05], [['#g6', '#v6'], 13.85],
                              [['#g7', '#v7'], 15.75], [['#g8', '#v8'], 19.55], [['#v9'], 22.45]]) {
        tl.fromTo(ids, { opacity: 0 }, { opacity: 1, duration: X, ease: 'sine.inOut' }, a);
      }
      // band backgrounds drift slowly
      for (const [n, a, d] of [[2, 4.65, 2.95], [6, 13.85, 2.25], [7, 15.75, 4.15], [8, 19.55, 3.25]]) {
        tl.fromTo('#b' + n, { scale: 1.12, x: 30 }, { scale: 1.18, x: -30, duration: d, ease: 'none' }, a);
      }
      // warm sun leak: soft glow in the opening, a flare over some cuts, glow under "summer"
      tl.fromTo('#leak', { opacity: 0, x: 60 }, { opacity: 0.55, x: 0, duration: 1.6, ease: 'sine.out' }, 0);
      tl.to('#leak', { opacity: 0.15, duration: 1.8, ease: 'sine.inOut' }, 2.6);
      for (const c of [4.65, 7.25, 10.25, 13.85, 22.45]) {
        tl.to('#leak', { opacity: 0.7, x: -40, duration: 0.3, ease: 'sine.in' }, c - 0.1);
        tl.to('#leak', { opacity: 0.15, x: 0, duration: 0.9, ease: 'sine.out' }, c + 0.2);
      }
      tl.to('#leak', { opacity: 0.4, duration: 1.2, ease: 'sine.inOut' }, 8.2);
      tl.to('#leak', { opacity: 0.1, duration: 0.8, ease: 'sine.inOut' }, 9.2);
      tl.to('#leak', { opacity: 0, duration: 0.6 }, 25.3);
      tl.to(['#shade', '#glow'], { opacity: 0, duration: 0.6 }, 25.5);
      tl.fromTo('#shop', { opacity: 0, scale: 1.12, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.8, ease: 'power2.out' }, 25.4);
      tl.to('#shop', { scale: 1.0, duration: 4.6, ease: 'power1.out' }, 25.4);
      tl.to('#endshade', { opacity: 1, duration: 1.0, ease: 'power1.inOut' }, 25.8);
      tl.to('#vign', { opacity: 1, duration: 1.2 }, 25.8);
      tl.fromTo('#rule', { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: 'power2.out' }, 27.0);
      tl.fromTo('#tag', { opacity: 0, y: 14, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.1, ease: 'power2.out' }, 27.6);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
