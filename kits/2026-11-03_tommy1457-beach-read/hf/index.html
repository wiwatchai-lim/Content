<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!--
      TOMMY 1457 beach-read mood clip, 20 s (user's 7 AI clips from C:/timeoptic-content/ดาวน์โหลด01, joined by ../build_bg.py).
      Shots (dissolves at 2.85 5.5 8.15 10.8 13.75 16.4): glasses on book / chair wide / close smile / profile / frame orbit /
      golden profile / standing on the dunes -> end card. English text only, no music (user adds it later).
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #111; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Archivo', sans-serif; color: #fff; }
      .layer { position: absolute; }
      #bg { left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #shade { inset: 0; background: linear-gradient(to bottom, rgba(10,14,18,.32) 0%, rgba(10,14,18,0) 16%, rgba(10,14,18,0) 52%, rgba(10,14,18,.34) 66%, rgba(10,14,18,.34) 80%, rgba(10,14,18,0) 92%); }
      #leak { inset: -10%; mix-blend-mode: screen; opacity: 0;
        background: radial-gradient(ellipse 45% 35% at 85% 12%, rgba(255,196,120,.7), rgba(255,150,80,0) 70%); }
      #mark { left: 0; right: 0; top: 96px; display: flex; justify-content: center; }
      #mark img { width: 300px; opacity: .9; filter: drop-shadow(0 2px 10px rgba(0,0,0,.4)); }
      .t { position: absolute; left: 90px; right: 90px; top: 1180px; text-align: center; font-weight: 300; font-size: 76px; line-height: 1.1;
           letter-spacing: -.02em; text-shadow: 0 2px 26px rgba(10,12,14,.6); opacity: 0; }
      .t b { font-weight: 700; }
      .kick { display: block; margin-bottom: 18px; font-family: 'Inter', sans-serif; font-size: 30px; font-weight: 500; letter-spacing: .34em; text-transform: uppercase; }
      #endshade { inset: 0; background: linear-gradient(to bottom, rgba(14,20,24,0) 40%, rgba(14,20,24,.7) 60%, rgba(14,20,24,.9) 100%); opacity: 0; }
      #end .brand { position: absolute; left: 0; right: 0; top: 1240px; display: flex; flex-direction: column; align-items: center; }
      #end img { width: 600px; }
      #rule { width: 120px; height: 2px; margin-top: 40px; background: #EFCF9C; }
      #tag { margin-top: 32px; font-family: 'Inter', sans-serif; font-size: 38px; letter-spacing: .2em; text-transform: uppercase; color: rgba(250,250,250,.92); }
      #tag2 { margin-top: 14px; font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 500; letter-spacing: .34em; color: #EFCF9C; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <video id="bg" class="clip layer" data-start="0" data-duration="20" data-track-index="0" src="assets/bg.mp4" muted playsinline></video>
      <div id="leak" class="clip layer" data-start="0" data-duration="20" data-track-index="1"></div>
      <div id="shade" class="clip layer" data-start="0" data-duration="20" data-track-index="2"></div>
      <div id="mark" class="clip layer" data-start="0" data-duration="16.8" data-track-index="3"><img src="assets/timeoptic-white-spaced.svg" alt="TIMEOPTIC" /></div>
      <div id="lines" class="clip layer" data-start="0" data-duration="16.8" data-track-index="4" style="inset:0">
        <div id="l1" class="t" style="top:640px"><span class="kick">Slow days by the sea</span></div>
        <div id="l2" class="t">Every page.<br><b>Every line.</b></div>
        <div id="l3" class="t">Clear from<br><b>first word to last.</b></div>
        <div id="l4" class="t">Made for<br><b>long, slow chapters.</b></div>
      </div>
      <div id="endshade" class="clip layer" data-start="16.4" data-duration="3.6" data-track-index="5"></div>
      <div id="end" class="clip layer" data-start="16.7" data-duration="3.3" data-track-index="6" style="inset:0">
        <div class="brand">
          <img src="assets/timeoptic-white-spaced.svg" alt="TIMEOPTIC" />
          <div id="rule"></div>
          <div id="tag">Take care of your vision</div>
          <div id="tag2">HUA HIN</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // [id, in, out]
      for (const [id, a, b] of [['#l1', 0.3, 2.8], ['#l2', 3.2, 7.9], ['#l3', 8.5, 13.5], ['#l4', 14.0, 16.5]]) {
        tl.fromTo(id, { opacity: 0, y: 24, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power2.out' }, a);
        tl.to(id, { opacity: 0, y: -14, filter: 'blur(6px)', duration: 0.4, ease: 'power2.in' }, b - 0.4);
      }
      // wordmark drifts, fades before the end card
      tl.fromTo('#mark', { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' }, 0.2);
      tl.fromTo('#mark img', { x: -22 }, { x: 22, duration: 16.8, ease: 'sine.inOut' }, 0);
      tl.to('#mark', { opacity: 0, duration: 0.4 }, 16.3);
      // warm sun leak over the dissolves
      tl.fromTo('#leak', { opacity: 0 }, { opacity: 0.4, duration: 1.2, ease: 'sine.out' }, 0);
      for (const c of [2.85, 5.5, 8.15, 10.8, 13.75, 16.4]) {
        tl.to('#leak', { opacity: 0.65, duration: 0.25, ease: 'sine.in' }, c - 0.05);
        tl.to('#leak', { opacity: 0.2, duration: 0.7, ease: 'sine.out' }, c + 0.25);
      }
      // end card
      tl.to('#endshade', { opacity: 1, duration: 0.8, ease: 'power1.inOut' }, 16.5);
      tl.fromTo('#end img', { opacity: 0, y: 20, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.8, ease: 'power2.out' }, 16.75);
      tl.fromTo('#rule', { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: 'power2.out' }, 17.3);
      tl.fromTo(['#tag', '#tag2'], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, stagger: 0.18, ease: 'power2.out' }, 17.6);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
