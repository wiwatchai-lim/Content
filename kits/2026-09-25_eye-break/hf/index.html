<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!--
      TIMEOPTIC eye break — 15 s calm clip, no product.
        0-3 s     hook: a big eye opens, "Give your eyes 15 seconds"
        3-6.5 s   look far away: layered hills drift into the distance
        6.5-10 s  follow the dot: a slow glowing dot left, right, up, down
        10-12.5 s blink slowly: the eye blinks twice
        12.5-15 s breathe: a circle breathes, the TIMEOPTIC wordmark settles in the centre
      Audio is our own synthesised ambient pad + soft air noise (tools/ambient.py), so the shop owns it outright.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/tokens.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #e7efe9; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--to-font-body); color: var(--to-green); }
      .layer { position: absolute; }
      .bg { position: absolute; inset: 0; }
      #bg0 { background: radial-gradient(ellipse 70% 50% at 50% 45%, #f4f8f4 0%, #dfe9e2 60%, #c9d9cf 100%); }
      #bg1 { background: linear-gradient(180deg, #f6eee4 0%, #e9eee8 45%, #d6e3dc 100%); opacity: 0; }
      #bg2 { background: radial-gradient(ellipse 80% 60% at 50% 50%, #274b3f 0%, #183329 70%, #11261e 100%); opacity: 0; }
      #bg3 { background: radial-gradient(ellipse 70% 50% at 50% 50%, #fbfaf6 0%, #eceee6 60%, #dde3da 100%); opacity: 0; }

      .t { position: absolute; left: 60px; right: 60px; text-align: center; }
      .t .w { display: inline-block; }
      .kicker { font-family: var(--to-font-display); font-weight: 700; font-size: 30px; letter-spacing: .32em; text-transform: uppercase; }
      .head { font-family: var(--to-font-display); font-weight: 800; font-size: 92px; line-height: 1.05; letter-spacing: -.02em; }
      .sub { font-size: 38px; font-weight: 500; opacity: .8; }
      .light { color: #eef5ef; }

      #eye { left: 190px; top: 700px; width: 700px; height: 420px; }
      #hills { left: 0; top: 820px; width: 1080px; height: 1100px; opacity: 0; }
      #sun { left: 430px; top: 880px; width: 220px; height: 220px; border-radius: 50%; opacity: 0;
             background: radial-gradient(circle, #fff6df 0%, #ffe3b0 45%, rgba(255, 227, 176, 0) 70%); }
      #dot { left: 510px; top: 930px; width: 60px; height: 60px; border-radius: 50%; opacity: 0;
             background: radial-gradient(circle, #ffffff 0%, #d9f2e4 45%, rgba(160, 230, 200, 0) 72%); box-shadow: 0 0 60px 20px rgba(170, 235, 205, .35); }
      #trail { left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0; }
      #breath { left: 340px; top: 560px; width: 400px; height: 400px; border-radius: 50%; opacity: 0;
                border: 3px solid rgba(18, 58, 41, .35); background: radial-gradient(circle, rgba(65, 153, 110, .16), rgba(65, 153, 110, 0) 70%); }

      #logo { left: 390px; top: 936px; width: 300px; height: 48px; transform-origin: 50% 50%; opacity: 0; }
      #logo b { position: absolute; top: 0; height: 48px; background: url(assets/timeoptic.svg) no-repeat; background-size: 300px 47.6px; }
      #logo .shine { position: absolute; inset: 0; -webkit-mask: url(assets/timeoptic-mono.svg) center / 100% no-repeat; mask: url(assets/timeoptic-mono.svg) center / 100% no-repeat; overflow: hidden; }
      #logo .shine i { position: absolute; top: 0; bottom: 0; left: 0; width: 80px; transform: translateX(-90px); background: linear-gradient(100deg, transparent, rgba(239, 207, 156, .95), transparent); }
      #bar { left: 0; bottom: 0; height: 8px; width: 1080px; background: var(--to-peach); transform-origin: 0 50%; }
      #timer { right: 60px; top: 70px; font-family: var(--to-font-display); font-weight: 700; font-size: 34px; letter-spacing: .1em; opacity: .55; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="bgs" class="clip layer" data-start="0" data-duration="15" data-track-index="0" style="inset:0">
        <div class="bg" id="bg0"></div><div class="bg" id="bg1"></div><div class="bg" id="bg2"></div><div class="bg" id="bg3"></div>
      </div>

      <svg id="hills" class="clip layer" data-start="0" data-duration="15" data-track-index="1" viewBox="0 0 1080 1100">
        <path id="h1" d="M0 420 C200 330 360 360 540 300 C720 240 880 320 1080 280 L1080 1100 L0 1100Z" fill="#c9dccf" />
        <path id="h2" d="M0 560 C180 480 400 520 600 460 C780 410 940 470 1080 440 L1080 1100 L0 1100Z" fill="#a9c6b3" />
        <path id="h3" d="M0 720 C240 640 420 690 620 630 C820 580 960 640 1080 610 L1080 1100 L0 1100Z" fill="#7fa78e" />
        <path id="h4" d="M0 880 C220 820 460 860 680 800 C860 760 980 800 1080 790 L1080 1100 L0 1100Z" fill="#4f7f67" />
      </svg>
      <div id="sun" class="clip layer" data-start="0" data-duration="15" data-track-index="2"></div>

      <svg id="eye" class="clip layer" data-start="0" data-duration="15" data-track-index="3" viewBox="0 0 700 420">
        <defs><clipPath id="almond"><path d="M20 210 Q350 -60 680 210 Q350 480 20 210Z" /></clipPath></defs>
        <path d="M20 210 Q350 -60 680 210 Q350 480 20 210Z" fill="#fbfdfb" stroke="#123A29" stroke-width="10" />
        <g clip-path="url(#almond)">
          <g id="iris"><circle cx="350" cy="210" r="118" fill="#41996E" /><circle cx="350" cy="210" r="118" fill="none" stroke="#123A29" stroke-width="8" />
            <circle cx="350" cy="210" r="52" fill="#123A29" /><circle cx="386" cy="176" r="20" fill="#fff" opacity=".9" /></g>
          <rect id="lid" x="0" y="-420" width="700" height="420" fill="#dfe9e2" />
          <path id="lidline" d="M20 210 Q350 480 680 210" fill="none" stroke="#123A29" stroke-width="10" opacity="0" />
        </g>
      </svg>

      <svg id="trail" class="clip layer" data-start="0" data-duration="15" data-track-index="4" viewBox="0 0 1080 1920">
        <path id="trailpath" d="M540 960 L180 960 L900 960 L540 960 L540 600 L540 1320 L540 960" fill="none" stroke="rgba(220,245,232,.28)" stroke-width="4" stroke-dasharray="6 14" />
      </svg>
      <div id="dot" class="clip layer" data-start="0" data-duration="15" data-track-index="5"></div>
      <div id="breath" class="clip layer" data-start="0" data-duration="15" data-track-index="6"></div>

      <div id="s0" class="clip layer" data-start="0" data-duration="3.2" data-track-index="7" style="inset:0">
        <div class="t kicker" style="top:360px">Eye break</div>
        <div class="t head words" style="top:430px">Give your eyes 15 seconds</div>
      </div>
      <div id="s1" class="clip layer" data-start="3" data-duration="3.7" data-track-index="8" style="inset:0">
        <div class="t kicker" style="top:360px">Step 1</div>
        <div class="t head words" style="top:430px">Look far away</div>
        <div class="t sub words" style="top:560px">Let your focus relax</div>
      </div>
      <div id="s2" class="clip layer" data-start="6.4" data-duration="3.8" data-track-index="9" style="inset:0">
        <div class="t kicker light" style="top:360px">Step 2</div>
        <div class="t head light words" style="top:430px">Follow the dot</div>
        <div class="t sub light words" style="top:1480px">Slowly, only with your eyes</div>
      </div>
      <div id="s3" class="clip layer" data-start="10" data-duration="2.7" data-track-index="10" style="inset:0">
        <div class="t kicker" style="top:360px">Step 3</div>
        <div class="t head words" style="top:430px">Blink slowly</div>
      </div>
      <div id="s4" class="clip layer" data-start="12.4" data-duration="2.6" data-track-index="11" style="inset:0">
        <div class="t head words" style="top:360px; font-size:80px">Breathe in, breathe out</div>
        <div class="t sub words" style="top:1080px">Take care of your eyes</div>
      </div>

      <div id="timer" class="clip layer" data-start="0" data-duration="15" data-track-index="12">15</div>
      <div id="logo" class="clip layer" data-start="0" data-duration="15" data-track-index="13" aria-label="TIMEOPTIC"><div class="shine"><i></i></div></div>
      <div id="bar" class="clip layer" data-start="0" data-duration="15" data-track-index="14"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      document.querySelectorAll('.words').forEach((el) => {
        const words = el.textContent.split(' ');
        el.textContent = '';
        words.forEach((w, i) => {
          const s = document.createElement('span');
          s.className = 'w';
          s.textContent = w;
          el.append(s);
          if (i < words.length - 1) el.append(' ');
        });
      });
      const LETTERS = [[0, 282], [310, 392], [438, 834], [876, 1134], [1170, 1498], [1540, 1784], [1808, 2078], [2112, 2164], [2214, 2520]];
      const logo = document.getElementById('logo'), k = 300 / 2520;
      LETTERS.forEach(([x0, x1]) => {
        const el = document.createElement('b');
        el.style.cssText = `left:${x0 * k}px;width:${(x1 - x0) * k + 1}px;background-position:${-x0 * k}px 0;`;
        logo.insertBefore(el, logo.firstChild);
      });

      const wordsIn = (sel, at, stagger = 0.12) => tl.from(`${sel} .w`, { opacity: 0, y: 24, filter: 'blur(8px)', duration: 0.7, ease: 'power2.out', stagger }, at);
      const fadeIn = (sel, at, d = 0.6) => tl.from(sel, { opacity: 0, y: 12, duration: d, ease: 'power2.out' }, at);
      const out = (sel, at) => tl.to(sel, { opacity: 0, filter: 'blur(10px)', duration: 0.45, ease: 'power2.in' }, at);
      const bg = (id, at, d = 0.8) => tl.to(id, { opacity: 1, duration: d, ease: 'sine.inOut' }, at);

      // countdown + progress
      tl.fromTo('#bar', { scaleX: 0 }, { scaleX: 1, duration: 15, ease: 'none' }, 0);
      for (let s = 14; s >= 1; s--) tl.set('#timer', { textContent: String(s) }, 15 - s);
      tl.set('#timer', { color: '#eef5ef' }, 6.7); tl.set('#timer', { color: '#123A29' }, 10);

      // 0-3: hook — the big eye opens, the promise lands
      tl.fromTo('#eye', { scale: 1.15, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'power3.out' }, 0);
      tl.fromTo('#lid', { attr: { y: 0 } }, { attr: { y: -420 }, duration: 1.1, ease: 'power2.inOut' }, 0.25);
      tl.to('#iris', { x: -40, duration: 0.7, ease: 'sine.inOut' }, 1.3);
      tl.to('#iris', { x: 40, duration: 0.8, ease: 'sine.inOut' }, 2.0);
      fadeIn('#s0 .kicker', 0.2);
      wordsIn('#s0 .head', 0.4);
      out('#s0 .t', 2.75);
      tl.to('#eye', { scale: 0.4, y: -200, opacity: 0, duration: 0.6, ease: 'power2.in' }, 2.7);

      // 3-6.5: look far away — hills drift back, the sun rises softly
      bg('#bg1', 2.8);
      tl.to('#hills', { opacity: 1, duration: 0.8 }, 2.9);
      tl.fromTo('#h4', { y: 0 }, { y: 120, duration: 3.6, ease: 'sine.out' }, 3);
      tl.fromTo('#h3', { y: 0 }, { y: 70, duration: 3.6, ease: 'sine.out' }, 3);
      tl.fromTo('#h2', { y: 0 }, { y: 35, duration: 3.6, ease: 'sine.out' }, 3);
      tl.fromTo('#hills', { scale: 1.12 }, { scale: 1, transformOrigin: '50% 30%', duration: 3.6, ease: 'sine.out' }, 3);
      tl.fromTo('#sun', { opacity: 0, y: 60, scale: 0.7 }, { opacity: 1, y: -40, scale: 1, duration: 2.6, ease: 'sine.out' }, 3.2);
      fadeIn('#s1 .kicker', 3.1);
      wordsIn('#s1 .head', 3.2);
      wordsIn('#s1 .sub', 4.0, 0.08);
      out('#s1 .t', 6.1);
      tl.to(['#hills', '#sun'], { opacity: 0, duration: 0.6, ease: 'power2.in' }, 6.2);

      // 6.5-10: follow the dot — slow, smooth, on the dark calm green
      bg('#bg2', 6.2, 0.7);
      tl.to('#trail', { opacity: 1, duration: 0.5 }, 6.6);
      tl.to('#dot', { opacity: 1, duration: 0.4 }, 6.6);
      tl.to('#dot', { keyframes: [
        { x: -360, duration: 0.7, ease: 'sine.inOut' },
        { x: 360, duration: 1.0, ease: 'sine.inOut' },
        { x: 0, y: 0, duration: 0.5, ease: 'sine.inOut' },
        { y: -360, duration: 0.5, ease: 'sine.inOut' },
        { y: 360, duration: 0.7, ease: 'sine.inOut' },
      ] }, 6.8);
      fadeIn('#s2 .kicker', 6.5);
      wordsIn('#s2 .head', 6.6);
      wordsIn('#s2 .sub', 7.3, 0.08);
      tl.to(['#dot', '#trail'], { opacity: 0, duration: 0.4 }, 9.9);
      out('#s2 .t', 9.8);

      // 10-12.5: blink slowly — the eye returns and blinks twice
      bg('#bg3', 9.8, 0.6);
      tl.set('#lid', { attr: { fill: '#eceee6' } }, 10);
      tl.set('#iris', { x: 0 }, 10);
      tl.fromTo('#eye', { opacity: 0, scale: 0.9, y: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'power2.out', immediateRender: false }, 10);
      [10.6, 11.6].forEach((t) => {
        tl.to('#lid', { attr: { y: 0 }, duration: 0.35, ease: 'sine.in' }, t);
        tl.to('#lid', { attr: { y: -420 }, duration: 0.45, ease: 'sine.out' }, t + 0.45);
      });
      fadeIn('#s3 .kicker', 10.05);
      wordsIn('#s3 .head', 10.15);
      out('#s3 .t', 12.3);
      tl.to('#eye', { opacity: 0, scale: 0.85, duration: 0.4, ease: 'power2.in' }, 12.3);

      // 12.5-15: breathe, then the wordmark
      tl.fromTo('#breath', { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1.05, duration: 1.3, ease: 'sine.inOut' }, 12.4);
      tl.to('#breath', { scale: 0.8, opacity: 0.5, duration: 1.2, ease: 'sine.inOut' }, 13.7);
      wordsIn('#s4 .head', 12.5, 0.1);
      tl.set('#logo', { opacity: 1 }, 12.9);
      tl.fromTo('#logo', { scale: 2.2, y: -200 }, { scale: 2.6, y: -200, duration: 2.1, ease: 'none', immediateRender: false }, 12.9);
      tl.from('#logo b', { y: 30, opacity: 0, filter: 'blur(6px)', duration: 0.7, ease: 'power2.out', stagger: 0.07 }, 12.9);
      tl.fromTo('#logo .shine i', { x: -90 }, { x: 320, duration: 1.2, ease: 'power2.inOut', immediateRender: false }, 13.9);
      wordsIn('#s4 .sub', 13.6, 0.08);

      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
