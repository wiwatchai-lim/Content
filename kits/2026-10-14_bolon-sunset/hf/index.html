<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!--
      BOLON golden hour — two user AI stills (front on water, side temple) brought to life with Wan 2.2 (water, clouds),
      the sharp glasses from each still composited back on top (work/composite.py), extra rivets removed from the front still.
      Mood: calm luxury sunset, gold on black. White type and white TIMEOPTIC wordmark (dark footage).
      Cut to "Kabut Senja" (161.5 BPM, half-time 80.75), from 16.0 s in the song. 18 beats = 13.375 s.
        beats 0-4    hook: frame 0 slams in on the gold BOLON letters (side), then hard cuts: side wide, front left temple, front right temple
        beats 4-8    drop: the full front view on the water, GOLDEN HOUR letters bounce in, a reframe on beat 7
        beats 8-12   side view: SIGNATURE GOLD LETTERS, punch-in on the letters on beat 10, front bridge on beat 11
        beats 12-18  veil: the front view softens, white TIMEOPTIC wordmark rises to the centre, letters hop, gold shine
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/tokens.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1c1a22; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--to-font-display); color: #fff; }
      .layer { position: absolute; }
      #punch { position: absolute; inset: 0; transform-origin: 50% 50%; }
      .shot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 0 0; }
      #veil { inset: 0; opacity: 0; background: radial-gradient(ellipse 80% 45% at 50% 50%, rgba(20, 16, 24, .35), rgba(20, 16, 24, .8)); }
      #sheen { left: -600px; top: -200px; width: 360px; height: 2320px; transform: rotate(16deg); opacity: 0;
               background: linear-gradient(90deg, rgba(255, 226, 170, 0), rgba(255, 236, 200, .55) 50%, rgba(255, 226, 170, 0)); }
      #topshade { left: 0; top: 0; width: 1080px; height: 700px; background: linear-gradient(180deg, rgba(18, 12, 18, .6) 0%, rgba(18, 12, 18, .35) 55%, rgba(18, 12, 18, 0) 100%); }
      #botshade { left: 0; top: 1050px; width: 1080px; height: 870px; background: linear-gradient(0deg, rgba(18, 12, 18, .5) 0%, rgba(18, 12, 18, .35) 50%, rgba(18, 12, 18, 0) 100%); }
      #flash { inset: 0; background: #fff6e6; opacity: 0; }

      .type { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
      .type .ch, .type .w { display: inline-block; will-change: transform; }
      .shade { text-shadow: 0 4px 24px rgba(20, 12, 10, .65), 0 1px 3px rgba(20, 12, 10, .5); }
      .kicker { font-weight: 700; font-size: 30px; letter-spacing: .38em; color: #f6e2b8; }
      .mega { font-weight: 900; font-size: 150px; line-height: 1; letter-spacing: .02em; color: #fff; }
      .mega.md { font-size: 112px; }
      .gold { color: #f3cf86; }
      .serif { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 500; font-size: 52px; color: #fbeed4; }

      #blogo { left: 64px; top: 64px; width: 200px; height: 52px; filter: brightness(0) invert(1) drop-shadow(0 2px 8px rgba(0, 0, 0, .45)); }
      #logo { left: 384px; top: 1415px; width: 312px; height: 48px; transform-origin: 50% 50%; }
      #logo b { position: absolute; top: 0; height: 48px; background: url(assets/timeoptic-mono.svg) no-repeat; background-size: 300px 47.6px; filter: brightness(0) invert(1); }
      #logo .shine { position: absolute; inset: 0; -webkit-mask: url(assets/timeoptic-mono.svg) center / 100% no-repeat; mask: url(assets/timeoptic-mono.svg) center / 100% no-repeat; overflow: hidden; }
      #logo .shine i { position: absolute; top: 0; bottom: 0; left: 0; width: 80px; transform: translateX(-90px); background: linear-gradient(100deg, transparent, rgba(243, 207, 134, .95), transparent); }
      #rule { left: 465px; top: 1062px; width: 150px; height: 4px; background: #f3cf86; transform-origin: center; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13.375" data-width="1080" data-height="1920">
      <div id="cam" class="layer" style="inset:0"><div id="punch">
        <video id="s1" class="shot clip" data-start="0" data-duration="0.743" data-media-start="0.2" data-track-index="1" src="assets/side_comp.mp4" muted playsinline></video>
        <video id="s2" class="shot clip" data-start="0.743" data-duration="0.743" data-media-start="1.0" data-track-index="2" src="assets/side_comp.mp4" muted playsinline></video>
        <video id="s3" class="shot clip" data-start="1.486" data-duration="0.743" data-media-start="0.2" data-track-index="3" src="assets/front_comp.mp4" muted playsinline></video>
        <video id="s4" class="shot clip" data-start="2.229" data-duration="0.743" data-media-start="1.0" data-track-index="4" src="assets/front_comp.mp4" muted playsinline></video>
        <video id="s5" class="shot clip" data-start="2.972" data-duration="2.972" data-media-start="1.8" data-track-index="5" src="assets/front_comp.mp4" muted playsinline></video>
        <video id="s6" class="shot clip" data-start="5.944" data-duration="1.486" data-media-start="1.9" data-track-index="6" src="assets/side_comp.mp4" muted playsinline></video>
        <video id="s7" class="shot clip" data-start="7.43" data-duration="0.743" data-media-start="3.5" data-track-index="7" src="assets/side_comp.mp4" muted playsinline></video>
        <video id="s8" class="shot clip" data-start="8.173" data-duration="0.743" data-media-start="0.6" data-track-index="8" src="assets/front_comp.mp4" muted playsinline></video>
        <video id="s9" class="shot clip" data-start="8.916" data-duration="4.459" data-media-start="0.5" data-track-index="9" src="assets/front_comp.mp4" muted playsinline></video>
        <div id="sheen" class="layer"></div>
        <div id="topshade" class="layer"></div>
        <div id="botshade" class="layer"></div>
        <div id="veil" class="layer"></div>
      </div></div>

      <!-- hook -->
      <div id="t0" class="clip layer" data-start="0" data-duration="2.972" data-track-index="10" style="inset:0">
        <div class="type kicker shade split" style="top:300px">GOLD ON BLACK</div>
      </div>
      <!-- drop -->
      <div id="t1" class="clip layer" data-start="2.972" data-duration="2.972" data-track-index="11" style="inset:0">
        <div class="type mega md shade split" style="top:1150px">GOLDEN</div>
        <div class="type mega md gold shade split" style="top:1268px">HOUR</div>
      </div>
      <!-- side -->
      <div id="t2" class="clip layer" data-start="5.944" data-duration="2.972" data-track-index="12" style="inset:0">
        <div class="type kicker shade split" style="top:300px">THE SIGNATURE</div>
        <div class="type mega md gold shade split" style="top:350px">GOLD LETTERS</div>
        <div class="type serif shade words" style="top:1240px">on a glossy black temple</div>
      </div>
      <!-- end -->
      <div id="t3" class="clip layer" data-start="8.916" data-duration="4.459" data-track-index="13" style="inset:0">
        <div class="type serif shade words" style="top:1110px">Find yours at <b>Time</b> <b>Optic</b></div>
      </div>

      <img id="blogo" class="clip layer" data-start="0" data-duration="13.375" data-track-index="14" src="assets/bolon.svg" alt="BOLON" width="200" height="52" />
      <div id="rule" class="clip layer" data-start="8.916" data-duration="4.459" data-track-index="15"></div>
      <div id="logo" class="clip layer" data-start="0" data-duration="13.375" data-track-index="16" aria-label="TIMEOPTIC"><div class="shine"><i></i></div></div>
      <div id="flash" class="clip layer" data-start="0" data-duration="13.375" data-track-index="17"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const BPM = 80.75;               // "Kabut Senja" half-time, grid from 16.0 s in the song
      const B = 60 / BPM;
      const b = (n) => n * B;

      // split letters / words
      document.querySelectorAll('.split').forEach((el) => {
        const text = el.textContent; el.textContent = '';
        for (const c of text) {
          if (c === ' ') { el.append(' '); continue; }
          const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; el.append(s);
        }
      });
      document.querySelectorAll('.words').forEach((el) => {
        const nodes = [...el.childNodes]; el.textContent = '';
        nodes.forEach((n) => {
          if (n.nodeType === 1) { const s = document.createElement('span'); s.className = 'w'; s.append(n); el.append(s, ' '); return; }
          n.textContent.split(' ').filter(Boolean).forEach((w) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w; el.append(s, ' '); });
        });
      });

      // white TIMEOPTIC wordmark, letter slices with a small gap between TIME and OPTIC
      const LETTERS = [[0, 282], [310, 392], [438, 834], [876, 1134], [1170, 1498], [1540, 1784], [1808, 2078], [2112, 2164], [2214, 2520]];
      const logo = document.getElementById('logo'), k = 300 / 2520;
      const LOGO_GAP = 12;
      LETTERS.forEach(([x0, x1], n) => {
        const el = document.createElement('b');
        el.style.cssText = `left:${x0 * k + (n >= 4 ? LOGO_GAP : 0)}px;width:${(x1 - x0) * k + 1}px;background-position:${-x0 * k}px 0;`;
        logo.insertBefore(el, logo.firstChild);
      });

      // ---------- helpers ----------
      const q = (id, n) => `#${id} .type:nth-child(${n})`;
      // frame a point of the 1080x1920 shot at (cx, cy) on screen with scale s, edges kept covered
      const frame = (px, py, s, cx = 540, cy = 960) => ({
        x: Math.min(0, Math.max(1080 - 1080 * s, cx - px * s)),
        y: Math.min(0, Math.max(1920 - 1920 * s, cy - py * s)), scale: s,
      });
      const bounceIn = (sel, at, stagger = 0.035) => tl.from(`${sel} .ch`, { scale: 0, y: 50, rotation: (i) => (i % 2 ? 12 : -12), opacity: 0, duration: 0.5, ease: 'back.out(3)', stagger }, at);
      const hop = (sel, at) => tl.to(`${sel} .ch`, { keyframes: { y: [0, -18, 0] }, duration: B * 0.7, ease: 'sine.inOut', stagger: 0.025 }, at);
      const bounceOut = (sel, at) => tl.to(`${sel} .ch`, { scale: 0, y: -30, opacity: 0, duration: 0.25, ease: 'back.in(2)', stagger: 0.012 }, at);
      const letterFade = (sel, at, stagger = 0.04) => tl.from(`${sel} .ch`, { opacity: 0, y: 16, duration: 0.5, ease: 'power2.out', stagger }, at);
      const wordsGlide = (sel, at, from = 60) => tl.from(`${sel} .w`, { x: from, opacity: 0, duration: 0.6, ease: 'power3.out', stagger: 0.08 }, at);
      const punch = (at, s = 1.08, d = 0.22) => tl.fromTo('#punch', { scale: s }, { scale: 1, duration: d, ease: 'power3.out', immediateRender: false }, at);
      const sheen = (at) => { tl.fromTo('#sheen', { x: 0, opacity: 1 }, { x: 1900, opacity: 1, duration: 0.6, ease: 'power2.inOut', immediateRender: false }, at); tl.set('#sheen', { opacity: 0 }, at + 0.6); };

      // ---------- shots ----------
      // side letters BOLON centre at (588, 822) in the 1080 frame; front temples at (210, 912) and (862, 912); front bridge (540, 905)
      gsap.set('#s1', frame(588, 822, 2.0));
      tl.fromTo('#s1', frame(588, 822, 2.0), { ...frame(588, 822, 1.85), duration: B, ease: 'power2.out', immediateRender: false }, 0);
      tl.fromTo('#s2', frame(260, 860, 1.3), { ...frame(300, 860, 1.22), duration: B, ease: 'none', immediateRender: false }, b(1));
      tl.fromTo('#s3', { ...frame(210, 912, 2.1), x: '+=80' }, { ...frame(210, 912, 2.0), duration: B, ease: 'expo.out', immediateRender: false }, b(2));
      tl.fromTo('#s4', { ...frame(862, 912, 2.1), x: '-=80' }, { ...frame(862, 912, 2.0), duration: B, ease: 'expo.out', immediateRender: false }, b(3));
      // drop: the full front view, slow push, a reframe on beat 7
      tl.fromTo('#s5', frame(540, 960, 1.0), { ...frame(540, 960, 1.06), duration: b(3), ease: 'sine.out', immediateRender: false }, b(4));
      tl.set('#s5', frame(540, 905, 1.3), b(7));
      tl.to('#s5', { ...frame(540, 905, 1.36), duration: B, ease: 'none' }, b(7));
      // side: wide, then the letters on beat 10, front bridge on beat 11
      tl.fromTo('#s6', frame(400, 900, 1.0), { ...frame(400, 900, 1.07), duration: b(2), ease: 'none', immediateRender: false }, b(8));
      tl.fromTo('#s7', { ...frame(588, 822, 1.7), y: '+=120', filter: 'blur(8px)' }, { ...frame(588, 822, 1.6), filter: 'blur(0px)', duration: 0.35, ease: 'expo.out', immediateRender: false }, b(10));
      tl.fromTo('#s8', frame(540, 905, 1.7), { ...frame(540, 905, 1.6), duration: B, ease: 'power2.out', immediateRender: false }, b(11));
      // end: front view, slow pull back under the veil
      tl.fromTo('#s9', frame(540, 960, 1.12), { ...frame(540, 960, 1.0), duration: b(6), ease: 'power2.out', immediateRender: false }, b(12));
      tl.fromTo('#veil', { opacity: 0 }, { opacity: 1, duration: B * 1.2, ease: 'sine.inOut', immediateRender: false }, b(12));
      tl.fromTo('#s9', { filter: 'blur(0px)' }, { filter: 'blur(5px)', duration: B * 1.2, ease: 'sine.inOut', immediateRender: false }, b(12));

      // ---------- hook: frame 0 slams in ----------
      tl.fromTo('#punch', { scale: 1.35, filter: 'blur(18px)' }, { scale: 1, filter: 'blur(0px)', duration: 0.15, ease: 'power3.out', immediateRender: false }, 0);
      tl.fromTo('#flash', { opacity: 0.8 }, { opacity: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, 0);
      tl.to('#punch', { keyframes: { x: [0, -16, 12, -7, 4, 0], y: [0, 8, -6, 3, 0, 0] }, duration: 0.3, ease: 'none' }, 0.12);
      sheen(0.25);
      [1, 2, 3].forEach((n) => punch(b(n)));
      // the drop: flash + bigger punch
      tl.fromTo('#flash', { opacity: 0.55 }, { opacity: 0, duration: 0.4, ease: 'power2.out', immediateRender: false }, b(4));
      punch(b(4), 1.12, 0.3);
      [5, 6].forEach((n) => punch(b(n), 1.025, B * 0.8));
      punch(b(7)); punch(b(8), 1.1, 0.3); punch(b(10)); punch(b(11));
      sheen(b(9));

      // ---------- type ----------
      letterFade(q('t0', 1), 0.2, 0.03);
      tl.to(`${q('t0', 1)} .ch`, { opacity: 0, duration: 0.2, stagger: 0.01 }, b(4) - 0.25);

      bounceIn(q('t1', 1), b(4) + 0.08);
      bounceIn(q('t1', 2), b(5));
      hop(q('t1', 1), b(6)); hop(q('t1', 2), b(6) + 0.1);
      bounceOut(`${q('t1', 1)}, ${q('t1', 2)}`, b(8) - 0.3);

      letterFade(q('t2', 1), b(8), 0.03);
      bounceIn(q('t2', 2), b(8) + 0.1, 0.03);
      wordsGlide(q('t2', 3), b(9), -60);
      hop(q('t2', 2), b(10));
      bounceOut(`${q('t2', 1)}, ${q('t2', 2)}`, b(12) - 0.3);
      tl.to(`${q('t2', 3)} .w`, { opacity: 0, y: -20, duration: 0.25, stagger: 0.03 }, b(12) - 0.3);

      wordsGlide(q('t3', 1), b(14), 60);

      // ---------- brand ----------
      tl.from('#blogo', { opacity: 0, x: -30, duration: 0.4, ease: 'power2.out' }, 0.1);
      tl.from('#logo b', { y: -30, opacity: 0, duration: 0.6, ease: 'power2.out', stagger: B / 6 }, b(1));
      tl.fromTo('#logo .shine i', { x: -90 }, { x: 320, duration: B * 1.5, ease: 'power2.inOut' }, b(2));
      tl.to('#logo', { y: 960 - 24 - 1415 - 40, scale: 2.7, duration: B * 1.1, ease: 'expo.out' }, b(12));
      tl.to('#logo', { scale: 2.85, duration: b(5), ease: 'none' }, b(12) + B * 1.1);
      tl.from('#rule', { scaleX: 0, duration: B, ease: 'power3.out' }, b(13));
      [14, 15, 16, 17].forEach((n) => tl.to('#logo b', { keyframes: { y: [0, -10, 0] }, duration: B * 0.8, ease: 'sine.inOut', stagger: 0.03 }, b(n)));
      tl.fromTo('#logo .shine i', { x: -90 }, { x: 320, duration: B * 1.4, ease: 'power2.inOut', immediateRender: false }, b(15));

      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
