<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!--
      Oakley OX8080-0158 x ZEISS — vertical beat clip v2, cut to "PRIVATE JET!" (user audio, ~135 BPM, felt at 67.5).
      4 bars of 67.5 BPM = 16 beats = 14.22 s; the song segment from 1.024 s is muxed on after render.
        beats 0-4   front view on a tilted (dutch) camera that slides slowly
        beat 4      whip zoom, then one detail punch-in per beat (hinge emblem, temple tip, bridge, lens)
        beats 8-12  three-quarter view whips in, bops and sways
        beat 12     whip out, the TIMEOPTIC wordmark pushes up to the centre, big, and holds to the end
      The glasses are the real cutouts (assets/OX8080-0158_*.png); lens glass drawn inside the lens mask.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/tokens.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #e6ebee; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--to-font-body); color: var(--to-black); }
      .layer { position: absolute; }

      /* ---------- camera: #cam drifts (dutch tilt + slide), #punch takes beat pulses and whips ---------- */
      #cam, #punch { position: absolute; inset: 0; transform-origin: 50% 55%; }
      #bg { left: -400px; top: -400px; width: 1880px; height: 2720px;
            background: radial-gradient(ellipse 45% 38% at 50% 55%, #f7f9fa 0%, #e7ecef 55%, #cdd6dc 100%); }
      #wall-lines { left: -400px; top: -400px; width: 1880px; height: 1760px; opacity: .5;
                    background: repeating-linear-gradient(90deg, transparent 0 238px, rgba(150, 165, 175, .28) 238px 240px); }
      #floor { left: -400px; top: 1330px; width: 1880px; height: 1000px;
               background: linear-gradient(180deg, rgba(150, 165, 175, .0) 0%, rgba(150, 165, 175, .28) 25%, rgba(130, 145, 155, .42) 100%); }
      #rings i { position: absolute; left: 540px; top: 1100px; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%;
                 border: 3px solid rgba(255, 255, 255, .9); box-shadow: 0 0 0 1px rgba(120, 140, 150, .12); opacity: 0; }

      /* ---------- glasses: position > travel > sway > bop ---------- */
      .glasses { position: absolute; }
      .glasses > div, .gwrap { position: relative; }
      .glasses img, .gwrap img { display: block; width: 100%; }
      .glasses .shadow { position: absolute; left: 10%; right: 10%; bottom: -60px; height: 60px; border-radius: 50%;
                         background: radial-gradient(closest-side, rgba(30, 45, 55, .42), rgba(30, 45, 55, 0)); filter: blur(10px); }
      .glass { position: absolute; inset: 0; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; overflow: hidden;
               background: linear-gradient(170deg, rgba(255, 255, 255, .22) 0%, rgba(200, 215, 225, .07) 50%, rgba(235, 245, 255, .18) 100%); }
      .glass .tint { position: absolute; inset: 0; background: linear-gradient(120deg, transparent 20%, rgba(120, 170, 235, .22) 50%, transparent 80%); }
      .glass .win { position: absolute; top: 8%; width: 14%; height: 50%; border-radius: 16px; filter: blur(5px);
                    background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .06)); transform: skewX(-14deg); }
      .glass .streak { position: absolute; left: 0; transform: translateX(-150px); top: -20%; bottom: -20%; width: 9%; filter: blur(3px);
                       background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .7), transparent); }
      .rimglint { position: absolute; inset: 0; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; overflow: hidden; }
      .rimglint i { position: absolute; left: 0; transform: translateX(-200px); top: -20%; bottom: -20%; width: 160px; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .85), transparent); }

      /* Detail punch-ins: the real cutout at 2x, one per beat */
      .detail { position: absolute; left: -400px; top: -400px; width: 1880px; height: 2720px; overflow: hidden;
                background: radial-gradient(ellipse 45% 38% at 50% 55%, #f7f9fa 0%, #e2e8ec 60%, #c9d3d9 100%); }
      .detail .zoom { position: absolute; inset: 0; transform-origin: 940px 1360px; }
      .detail .gwrap { position: absolute; }

      /* ---------- type (outside the camera, so it stays level and readable) ---------- */
      .type { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
      .type .ch { display: inline-block; will-change: transform; }
      .kicker { font-family: var(--to-font-display); font-weight: 700; font-size: 30px; letter-spacing: .3em; color: var(--to-green); }
      .mega { font-family: var(--to-font-display); font-weight: 900; font-size: 200px; line-height: 1; letter-spacing: -.02em; color: var(--to-green); text-transform: uppercase; }
      .big { font-family: var(--to-font-display); font-weight: 800; font-size: 104px; line-height: 1; letter-spacing: -.02em; color: var(--to-black); text-transform: uppercase; }
      .x { font-family: var(--to-font-display); font-weight: 500; font-size: 70px; color: #5b6b75; }
      .sub { font-family: var(--to-font-body); font-weight: 500; font-size: 36px; color: #3f4a51; }
      .chip { display: inline-block; padding: 16px 30px; background: var(--to-green); color: var(--to-snow); font-family: var(--to-font-display);
              font-weight: 700; font-size: 34px; letter-spacing: .12em; text-transform: uppercase; }
      .spec { font-family: var(--to-font-display); font-weight: 500; font-size: 26px; letter-spacing: .22em; color: #3f4a51; }
      .rule { position: absolute; left: 465px; width: 150px; height: 5px; background: var(--to-peach); transform-origin: center; }

      #store { right: -60px; top: 20px; width: 400px; opacity: .6; filter: drop-shadow(0 1px 1px rgba(33, 33, 33, .16)) drop-shadow(0 0 1px rgba(33, 33, 33, .3)); }
      #logo { left: 390px; top: 1755px; width: 300px; height: 48px; transform-origin: 50% 50%; }
      #logo b { position: absolute; top: 0; height: 48px; background: url(assets/timeoptic.svg) no-repeat; background-size: 300px 47.6px; }
      #logo .shine { position: absolute; inset: 0; -webkit-mask: url(assets/timeoptic-mono.svg) center / 100% no-repeat; mask: url(assets/timeoptic-mono.svg) center / 100% no-repeat; overflow: hidden; }
      #logo .shine i { position: absolute; top: 0; bottom: 0; left: 0; width: 80px; transform: translateX(-90px); background: linear-gradient(100deg, transparent, rgba(239, 207, 156, .95), transparent); }
      #logo-rule { left: 465px; top: 1085px; width: 150px; height: 6px; background: var(--to-peach); transform-origin: center; }
      #veil { inset: 0; background: #eef2f4; opacity: 0; }
      #flash { inset: 0; background: #fff; opacity: 0; }
      #fade { inset: 0; background: #e6ebee; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.224" data-width="1080" data-height="1920">
      <div id="cam" class="clip" data-start="0" data-duration="14.224" data-track-index="0"><div id="punch">
        <div id="bg" class="layer"></div>
        <div id="wall-lines" class="layer"></div>
        <div id="floor" class="layer"></div>
        <div id="rings" class="layer" style="inset:0"></div>

        <!-- Shot A: front view, beats 0-4 -->
        <div id="gA" class="glasses" style="left:140px; top:990px; width:800px;">
          <div class="travel"><div class="sway"><div class="shadow"></div><div class="bop">
            <img src="assets/OX8080-0158_1.png" alt="" />
            <div class="glass" style="-webkit-mask-image:url(assets/OX8080-0158_1_lens.png); mask-image:url(assets/OX8080-0158_1_lens.png);">
              <i class="tint"></i><i class="win" style="left:14%"></i><i class="win" style="left:62%"></i><i class="streak"></i>
            </div>
            <div class="rimglint" style="-webkit-mask-image:url(assets/OX8080-0158_1.png); mask-image:url(assets/OX8080-0158_1.png);"><i></i></div>
          </div></div></div>
        </div>

        <!-- Details, one per beat 4-7 (point of interest placed at the frame centre 540,960 → 940,1360 inside .detail) -->
        <div class="detail" id="d1"><div class="zoom"><div class="gwrap" style="width:1896px; left:-470px; top:1138px;">
          <img src="assets/OX8080-0158_2.png" alt="" /></div></div></div>
        <div class="detail" id="d2"><div class="zoom"><div class="gwrap" style="width:1896px; left:-850px; top:968px;">
          <img src="assets/OX8080-0158_2.png" alt="" /></div></div></div>
        <div class="detail" id="d3"><div class="zoom"><div class="gwrap" style="width:1898px; left:-8px; top:1120px;">
          <img src="assets/OX8080-0158_1.png" alt="" />
          <div class="glass" style="-webkit-mask-image:url(assets/OX8080-0158_1_lens.png); mask-image:url(assets/OX8080-0158_1_lens.png);"><i class="tint"></i></div></div></div></div>
        <div class="detail" id="d4"><div class="zoom"><div class="gwrap" style="width:1898px; left:-380px; top:1080px;">
          <img src="assets/OX8080-0158_1.png" alt="" />
          <div class="glass" style="-webkit-mask-image:url(assets/OX8080-0158_1_lens.png); mask-image:url(assets/OX8080-0158_1_lens.png);">
            <i class="tint"></i><i class="win" style="left:62%"></i><i class="streak"></i></div></div></div></div>

        <!-- Shot B: three-quarter view, beats 8-12 -->
        <div id="gB" class="glasses" style="left:120px; top:1000px; width:840px;">
          <div class="travel"><div class="sway"><div class="shadow"></div><div class="bop">
            <img src="assets/OX8080-0158_2.png" alt="" />
            <div class="glass" style="-webkit-mask-image:url(assets/OX8080-0158_2_lens.png); mask-image:url(assets/OX8080-0158_2_lens.png);">
              <i class="tint"></i><i class="win" style="left:10%"></i><i class="win" style="left:50%"></i><i class="streak"></i>
            </div>
            <div class="rimglint" style="-webkit-mask-image:url(assets/OX8080-0158_2.png); mask-image:url(assets/OX8080-0158_2.png);"><i></i></div>
          </div></div></div>
        </div>
      </div></div>

      <div id="veil" class="clip layer" data-start="0" data-duration="14.224" data-track-index="1"></div>
      <img id="store" class="clip layer" data-start="0" data-duration="14.224" data-track-index="7" src="assets/store-lineart.png" alt="" />

      <!-- Type, shot A -->
      <div id="tA" class="clip layer" data-start="0" data-duration="3.65" data-track-index="5" style="inset:0">
        <div class="type kicker split" style="top:200px">NEW IN STORE</div>
        <div class="type mega split" style="top:300px">OAKLEY</div>
        <div class="type" style="top:515px"><span class="x split">×</span></div>
        <div class="type big split" style="top:630px">ZEISS</div>
        <div class="rule" id="ruleA" style="top:765px"></div>
        <div class="type sub split" style="top:805px">Crosslink Zero · Satin Gray Smoke</div>
      </div>
      <!-- Type, details: the lens -->
      <div id="tL" class="clip layer" data-start="3.54" data-duration="3.72" data-track-index="6" style="inset:0">
        <div class="type kicker split" style="top:200px">THE LENS</div>
        <div class="type big split" style="top:260px">ZEISS SMARTLIFE</div>
        <div class="type sub split" style="top:385px">Screens to real world, all day</div>
      </div>
      <!-- Type, shot B: the coating + model -->
      <div id="tB" class="clip layer" data-start="7.05" data-duration="3.78" data-track-index="9" style="inset:0">
        <div class="type kicker split" style="top:200px">THE COATING</div>
        <div class="type big split" style="top:260px; font-size:74px">DURAVISION PLUS</div>
        <div class="type big split" style="top:345px; font-size:74px">BLUEPROTECT UV</div>
        <div class="rule" id="ruleB" style="top:450px"></div>
        <div class="type sub split" style="top:490px">Reduces blue-violet light 390–440 nm</div>
        <div class="type" style="top:1420px"><span class="chip split" id="chip" data-layout-allow-overlap>OX8080 · Crosslink Zero</span></div>
        <div class="type spec split" style="top:1520px">OAKLEY OX8080-0158</div>
      </div>

      <div id="logo-rule" class="clip layer" data-start="10.58" data-duration="3.644" data-track-index="10"></div>
      <div id="logo" class="clip layer" data-start="0" data-duration="14.224" data-track-index="8" aria-label="TIMEOPTIC"><div class="shine"><i></i></div></div>
      <div id="flash" class="clip layer" data-start="0" data-duration="14.224" data-track-index="11"></div>
      <div id="fade" class="clip layer" data-start="0" data-duration="14.224" data-track-index="12"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const BPM = 67.49;               // PRIVATE JET! is ~135 BPM; the clip moves on the half-time feel, ticks on every beat
      const B = 60 / BPM;
      const D = 16 * B;                // 4 bars
      const b = (n) => n * B;

      document.querySelectorAll('.split').forEach((el) => {
        const text = el.textContent;
        el.textContent = '';
        for (const c of text) {
          if (c === ' ') { el.append(' '); continue; }
          const s = document.createElement('span');
          s.className = 'ch';
          s.textContent = c;
          el.append(s);
        }
      });

      const LETTERS = [[0, 282], [310, 392], [438, 834], [876, 1134], [1170, 1498], [1540, 1784], [1808, 2078], [2112, 2164], [2214, 2520]];
      const logo = document.getElementById('logo'), k = 300 / 2520;
      LETTERS.forEach(([x0, x1]) => {
        const el = document.createElement('b');
        el.style.cssText = `left:${x0 * k}px;width:${(x1 - x0) * k + 1}px;background-position:${-x0 * k}px 0;`;
        logo.insertBefore(el, logo.firstChild);
      });

      const rings = document.getElementById('rings');
      for (let i = 0; i < 4; i++) rings.append(document.createElement('i'));
      const ringEls = rings.querySelectorAll('i');

      const bounceIn = (sel, at, stagger = 0.045) =>
        tl.from(`${sel} .ch`, { y: 150, scale: 0.2, rotation: (i) => (i % 2 ? 24 : -24), opacity: 0, duration: 0.6, ease: 'back.out(3.4)', stagger }, at);
      const hop = (sel, at, h = 22) =>
        tl.to(`${sel} .ch`, { keyframes: { y: [0, -h, 0], scale: [1, 1.12, 1] }, duration: B * 0.8, ease: 'sine.inOut', stagger: 0.025 }, at);
      const bounceOut = (sel, at) =>
        tl.to(`${sel} .ch`, { y: -100, scale: 0.3, rotation: (i) => (i % 2 ? -20 : 20), opacity: 0, duration: 0.28, ease: 'back.in(2.5)', stagger: 0.01 }, at);
      const q = (id, n) => `#${id} .type:nth-child(${n})`;
      const show = (sel, from, to) => { tl.set(sel, { autoAlpha: 0 }, 0); tl.set(sel, { autoAlpha: 1 }, from); if (to) tl.set(sel, { autoAlpha: 0 }, to); };

      // ---------- visibility of the shots inside the camera ----------
      show('#gA', 0, b(4));
      ['#d1', '#d2', '#d3', '#d4'].forEach((d, i) => show(d, b(4 + i), b(5 + i)));
      show('#gB', b(8), b(12));

      // ---------- camera: slow dutch-angle slide, like a handheld gimbal move ----------
      tl.fromTo('#cam', { rotation: -6, x: -30, y: 20, scale: 1.04 }, { rotation: -3.5, x: 30, y: -10, scale: 1.1, duration: b(4), ease: 'none' }, 0);
      tl.fromTo('#cam', { rotation: 5, x: 30, scale: 1.1 }, { rotation: 3, x: -30, scale: 1.14, duration: b(4), ease: 'none', immediateRender: false }, b(4));
      tl.fromTo('#cam', { rotation: -5, x: -30, y: 0, scale: 1.03 }, { rotation: -2.5, x: 30, y: -20, scale: 1.09, duration: b(4), ease: 'none', immediateRender: false }, b(8));
      tl.fromTo('#cam', { rotation: 0, x: 0, y: 0, scale: 1.2 }, { scale: 1.1, duration: b(4), ease: 'power2.out', immediateRender: false }, b(12));

      // Whip zoom into beats 4, 8, 12: blur and punch through the cut.
      const whip = (n) => {
        tl.to('#punch', { scale: 1.35, filter: 'blur(22px)', duration: 0.18, ease: 'power3.in' }, b(n) - 0.18);
        tl.fromTo('#punch', { scale: 0.85, filter: 'blur(22px)' }, { scale: 1, filter: 'blur(0px)', duration: 0.3, ease: 'power3.out', immediateRender: false }, b(n));
        tl.fromTo('#flash', { opacity: 0.6 }, { opacity: 0, duration: 0.35, ease: 'power2.out', immediateRender: false }, b(n));
      };
      [4, 8, 12].forEach(whip);

      // ---------- every beat: rings, a small camera pump, glasses bop ----------
      for (let n = 0; n < 16; n++) {
        const t = b(n), down = n % 4 === 0;
        tl.fromTo(ringEls[n % 4], { scale: 0.35, opacity: down ? 0.95 : 0.55 }, { scale: down ? 1.5 : 1.15, opacity: 0, duration: B * 1.6, ease: 'power2.out', immediateRender: false }, t);
        if (n % 4 !== 0) tl.fromTo('#punch', { scale: 1.025 }, { scale: 1, duration: B * 0.6, ease: 'power2.out', immediateRender: false }, t);
        const g = n < 4 ? '#gA' : n >= 8 && n < 12 ? '#gB' : null;
        if (!g || n === 8) continue;
        tl.fromTo(`${g} .bop`, { y: 10, scaleY: 0.93, scaleX: 1.035 },
          { keyframes: { y: [10, down ? -46 : -30, 0], scaleY: [0.93, 1.03, 1], scaleX: [1.035, 0.99, 1] }, duration: B * 0.9, ease: 'sine.out', immediateRender: false }, t);
        tl.fromTo(`${g} .shadow`, { scaleX: 1.05, opacity: 1 }, { keyframes: { scaleX: [1.05, 0.75, 1], opacity: [1, 0.55, 1] }, duration: B * 0.9, ease: 'sine.out', immediateRender: false }, t);
        // off-beat 8th (the 170 BPM hi-hat): tiny tick
        tl.to(`${g} .sway`, { keyframes: { y: [0, -16, 0], scaleY: [1, 0.97, 1] }, duration: B * 0.45, ease: 'sine.inOut' }, t + B / 2);
      }

      // Sway left/right every beat (half-time groove).
      const sway = (g, from, to) => {
        for (let n = from; n < to; n++) {
          const dir = (n - from) % 2 ? -1 : 1;
          tl.to(`${g} .sway`, { x: 40 * dir, rotation: 4 * dir, duration: B, ease: 'sine.inOut' }, b(n));
        }
      };
      sway('#gA', 0.5, 4);
      sway('#gB', 8.5, 12);

      // ---------- travel ----------
      tl.from('#gA .travel', { x: -1250, rotation: -18, duration: B * 0.9, ease: 'power3.out' }, 0);
      tl.to('#gA .travel', { y: -90, scale: 1.08, duration: b(2), ease: 'back.inOut(1.6)' }, b(2));
      tl.to('#gA .glass .win', { xPercent: 140, duration: b(4), ease: 'none' }, 0);
      tl.fromTo('#gA .rimglint i', { x: -200 }, { x: 1100, duration: B * 1.4, ease: 'power2.inOut' }, b(1.5));

      tl.from('#gB .travel', { x: 1250, rotation: 16, duration: B * 0.7, ease: 'power3.out' }, b(8));
      tl.fromTo('#gB .bop', { scaleY: 0.85, scaleX: 1.08 }, { scaleY: 1, scaleX: 1, duration: B, ease: 'elastic.out(1.2, 0.4)', immediateRender: false }, b(8) + B * 0.6);
      tl.to('#gB .travel', { y: 40, scale: 1.1, duration: b(3), ease: 'power2.inOut' }, b(9));
      tl.to('#gB .glass .win', { xPercent: 120, duration: b(4), ease: 'none' }, b(8));
      tl.fromTo('#gB .glass .streak', { x: -150 }, { x: 1100, duration: B * 1.5, ease: 'power2.inOut' }, b(9));
      tl.fromTo('#gB .rimglint i', { x: -200 }, { x: 1100, duration: B * 1.4, ease: 'power2.inOut' }, b(10.5));

      // Details: each punches in on its beat, slides a little, alternating direction.
      ['#d1', '#d2', '#d3', '#d4'].forEach((d, i) => {
        const dir = i % 2 ? -1 : 1;
        tl.fromTo(`${d} .zoom`, { scale: 1.2, x: 90 * dir, rotation: 3 * dir, filter: 'blur(10px)' },
          { scale: 1.05, x: 0, rotation: 0, filter: 'blur(0px)', duration: 0.22, ease: 'power3.out', immediateRender: false }, b(4 + i));
        tl.to(`${d} .zoom`, { scale: 1, x: -30 * dir, duration: B - 0.22, ease: 'none' }, b(4 + i) + 0.22);
      });
      tl.fromTo('#d4 .glass .streak', { x: -150 }, { x: 1900, duration: B * 0.8, ease: 'power2.inOut', immediateRender: false }, b(7) + 0.1);

      // ---------- type on the grid ----------
      bounceIn(q('tA', 1), b(0), 0.03);
      bounceIn(q('tA', 2), b(0.5), 0.05);
      bounceIn(q('tA', 3), b(1));
      bounceIn(q('tA', 4), b(1) + 0.08, 0.05);
      tl.from('#ruleA', { scaleX: 0, duration: B * 0.8, ease: 'back.out(2)' }, b(1.5));
      bounceIn(q('tA', 6), b(1.5), 0.012);
      hop(q('tA', 2), b(2));
      hop(q('tA', 4), b(2.5));
      hop(q('tA', 2), b(3));
      [1, 2, 3, 4, 6].forEach((n, i) => bounceOut(q('tA', n), b(4) - 0.34 + i * 0.02));
      tl.to('#ruleA', { scaleX: 0, duration: 0.22, ease: 'power2.in' }, b(4) - 0.3);

      bounceIn(q('tL', 1), b(4), 0.03);
      bounceIn(q('tL', 2), b(4) + 0.08, 0.035);
      bounceIn(q('tL', 3), b(5), 0.012);
      hop(q('tL', 2), b(6));
      hop(q('tL', 2), b(7));
      [1, 2, 3].forEach((n, i) => bounceOut(q('tL', n), b(8) - 0.34 + i * 0.02));

      bounceIn(q('tB', 1), b(8), 0.03);
      bounceIn(q('tB', 2), b(8) + 0.08, 0.03);
      bounceIn(q('tB', 3), b(8.5), 0.03);
      tl.from('#ruleB', { scaleX: 0, duration: B * 0.8, ease: 'back.out(2)' }, b(9));
      bounceIn(q('tB', 5), b(9), 0.012);
      tl.from('#chip', { scale: 0, rotation: -8, duration: B, ease: 'back.out(3)' }, b(10));
      bounceIn('#chip', b(10) + 0.05, 0.02);
      bounceIn(q('tB', 7), b(10.5), 0.02);
      hop(q('tB', 2), b(11)); hop(q('tB', 3), b(11) + 0.06);
      [1, 2, 3, 5, 6, 7].forEach((n, i) => bounceOut(q('tB', n), b(12) - 0.34 + i * 0.02));
