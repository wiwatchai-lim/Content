<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>closure notice facebook en</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../brand/tokens.css">
<link rel="stylesheet" href="notice.css">
</head>
<body data-width="1080" data-height="1350">
  <div class="background" data-layer="background"></div>
  <div class="card" data-layer="card">
    <img class="logo" src="../../brand/logo/timeoptic.svg" alt="TIMEOPTIC">
    <div class="accent"></div>
    <p class="eyebrow">Notice of Closure</p>
    <div class="hero"><p class="h-top">Closed</p><p class="h-main">Saturday 28</p><p class="h-sub">November 2026</p></div>
    <div class="rule"></div>
    <p class="reopen-label">We reopen on</p>
    <p class="reopen">Monday, 30 November 2026</p>
    <p class="hours">09:30–18:00</p>
    <p class="sorry">We apologise for any inconvenience.</p>
  </div>
  <div class="footer" data-layer="footer">
    <p class="name" style="margin:0">Time Optic Hua Hin</p>
    <p class="info" style="margin:10px 0 0">Tel 032-511-360<span class="dot"></span>Phet Kasem Road, opposite Hua Hin Temple</p>
  </div>
</body>
</html>
