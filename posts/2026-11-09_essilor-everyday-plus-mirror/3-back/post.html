<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>essilor-everyday-plus-mirror 3-back</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../brand/tokens.css">
<style>
  html, body { margin: 0; background: transparent; }
  body { position: relative; width: 1080px; height: 1080px; overflow: hidden; font-family: var(--to-font-body); color: var(--to-snow); }
  body > [data-layer] { position: absolute; box-sizing: border-box; }
  .scene { inset: 0; width: 1080px; height: 1080px; object-fit: cover; }
  .shade { inset: 0; background: linear-gradient(180deg, rgba(8,12,24,.6) 0%, rgba(8,12,24,0) 24%, rgba(8,12,24,0) 62%, rgba(8,12,24,.78) 100%); }
  .brand { left: calc(50% - 120px); top: 52px; width: 240px; display: flex; justify-content: center; }
  .brand img { height: 84px; }
  .lens { left: 0; right: 0; bottom: 136px; text-align: center; text-shadow: 0 2px 14px rgba(0,0,0,.45); }
  .lens .eyebrow { font-size: 16px; font-weight: 600; letter-spacing: var(--to-track-eyebrow); text-transform: uppercase; color: rgba(250,250,250,.8); }
  .lens h1 { margin: 10px 0 0; font-family: var(--to-font-display); font-weight: 800; font-size: 54px; line-height: 1; letter-spacing: var(--to-track-display); }
  .lens .sub { margin-top: 12px; font-size: 21px; font-weight: 500; letter-spacing: .06em; color: rgba(250,250,250,.92); }
  .logo { left: calc(50% - 82px); bottom: 56px; width: 164px; }
</style>
</head>
<body data-width="1080" data-height="1080">
  <img class="scene" data-layer="scene" src="layers/scene.png" alt="">
  <div class="shade" data-layer="shade"></div>
  <div class="brand" data-layer="brand"><img src="../../../brand/partner-logos/essilor-white.svg" alt=""></div>
  <div class="lens" data-layer="lens">
    <div class="eyebrow">Near to far · One lens</div>
    <h1>Everyday Plus 1.5</h1>
    <div class="sub">Clear + Mirrors · Progressive</div>
  </div>
  <img class="logo" data-layer="logo" src="../../../brand/logo/timeoptic-white-spaced.svg" alt="">
</body>
</html>
