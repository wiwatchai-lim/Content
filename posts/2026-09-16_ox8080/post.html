<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2026-09-16 OX8080</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../brand/tokens.css">
<style>
  /* Style 9-spec-callout on the brand tokens. Dark ground, so: the white wordmark, and any green
     accent uses --to-green-on-dark, never --to-green. The radial keeps a light centre on purpose —
     the product is an opaque black frame and disappears on a flat dark field.
     Every callout proof is the manufacturer's own claim from data/lenses/hoya.md and data/coatings/hoya.md. */
  html, body { margin: 0; background: transparent; }
  body { position: relative; width: 1080px; height: 1080px; overflow: hidden;
         font-family: var(--to-font-body); color: var(--to-snow); }
  body > [data-layer] { position: absolute; box-sizing: border-box; }

  /* The product is an opaque black frame: it needs a LIGHT stage or it disappears. Timberwolf core,
     easing out to Phthalo Green and then Raisin Black so the top stays dark enough for white type. */
  .background { inset: 0; background: radial-gradient(58% 44% at 50% 56%, var(--to-timberwolf) 0%, #6E8577 38%, var(--to-green) 68%, var(--to-black) 100%); }
  .logo { left: var(--to-margin); top: 64px; width: var(--to-logo-width); }
  .headline { left: 120px; right: 120px; top: 152px; margin: 0; text-align: center;
              font-family: var(--to-font-display); font-weight: 800; font-size: 46px; line-height: 1.06;
              letter-spacing: var(--to-track-display); text-transform: uppercase; color: var(--to-snow); }
  .product { left: 130px; top: 430px; width: 820px; transform: rotate(-6deg); filter: drop-shadow(0 30px 40px rgba(0, 0, 0, .5)); }

  [data-layer^="callout"] { font-size: 21px; font-weight: 400; line-height: 1.36; color: rgba(250, 250, 250, .74); }
  [data-layer^="callout"] b { display: block; font-family: var(--to-font-display); font-weight: 700;
                              font-size: 15px; letter-spacing: var(--to-track-eyebrow); text-transform: uppercase;
                              color: var(--to-snow); margin-bottom: 4px; }
  [data-layer^="callout"] .dot { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--to-peach); }
  [data-layer^="callout"] .line { position: absolute; height: 1px; background: rgba(250, 250, 250, .45); transform-origin: left center; }

  .callout-a { left: 70px; top: 306px; width: 340px; text-align: right; }
  .callout-a .dot { right: -30px; top: 24px; }
  .callout-a .line { right: -142px; top: 29px; width: 116px; transform: rotate(16deg); }

  .callout-b { left: 50px; top: 770px; width: 310px; text-align: right; }
  .callout-b .dot { right: -30px; top: 22px; }
  .callout-b .line { right: -128px; top: 27px; width: 104px; transform: rotate(-26deg); }

  .callout-c { right: 60px; top: 306px; width: 340px; }
  .callout-c .dot { left: -30px; top: 22px; }
  .callout-c .line { left: -134px; top: 27px; width: 110px; transform: rotate(10deg); }

  .callout-d { right: 60px; top: 770px; width: 320px; }
  .callout-d .dot { left: -30px; top: 22px; }
  .callout-d .line { left: -140px; top: 27px; width: 116px; transform: rotate(-26deg); }

  .specs { left: 0; right: 0; bottom: var(--to-margin); text-align: center; font-family: var(--to-font-display);
           font-weight: 500; font-size: 17px; letter-spacing: var(--to-track-eyebrow); text-transform: uppercase;
           color: rgba(250, 250, 250, .72); }
</style>
</head>
<body data-width="1080" data-height="1080">
  <div class="background" data-layer="background"></div>
  <img class="logo" data-layer="logo" src="../../brand/logo/timeoptic-white.svg" alt="">
  <h1 class="headline" data-layer="headline">One lens, from indoors to sunlight</h1>
  <img class="product" data-layer="product" src="layers/OX8080-0758_1.png" alt="">
  <div class="callout-a" data-layer="callout-a"><b>Darkens outdoors</b>21% faster to a category 3 tint<span class="dot"></span><span class="line"></span></div>
  <div class="callout-b" data-layer="callout-b"><b>Clears indoors</b>almost 2x faster fade-back<span class="dot"></span><span class="line"></span></div>
  <div class="callout-c" data-layer="callout-c"><b>Colour that holds</b>3x more colour stability<span class="dot"></span><span class="line"></span></div>
  <div class="callout-d" data-layer="callout-d"><b>UV front and back</b>UV Control coats the rear surface<span class="dot"></span><span class="line"></span></div>
  <div class="specs" data-layer="specs">Oakley OX8080 · HOYA Sensity 3 · Hi-Vision LongLife UV Control</div>
</body>
</html>
